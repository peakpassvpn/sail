# Fuzz targets for the parsers sniffing runs on what clients send, for
# share links, which come from subscriptions anyone may serve, and for the
# DHCP lease files other programs write. From the
# repository root, with cargo-fuzz:
#
#     cargo +nightly fuzz run --fuzz-dir fuzz sniff_quic -- -max_total_time=60
#
# Targets: sniff_tls, sniff_http, sniff_dns, sniff_quic, sniff_any,
# share_link, dhcp_leases, and on Linux the TUN's tun_vnet_header and
# tun_coalesce.

[package]
name = "sail-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The sniffers, btls for QUIC's Initial packets, and the entry points of
# sail's fuzzing module.
sail = { path = "../sail", default-features = false, features = ["aead", "fuzzing", "inbound-tun"] }

# A workspace of its own: the targets build on nightly with sanitizers,
# apart from sail's.
[workspace]

# The workspace's, kept identical by tools/fuzz-check.sh.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "ac0737da7704788407daab3c5e6abd3dca7ae55e" }
# tun-rs's netlink graph without paste (RUSTSEC-2024-0436); see
# tools/security/policy.toml for when these go.
netconfig-rs = { git = "https://github.com/peakpassvpn/netconfig-rs.git", rev = "a5caf848a0e0f18bc9810c1fa854f3ac6a903443" }
route_manager = { git = "https://github.com/peakpassvpn/route_manager.git", rev = "5703367f56a7b4fed9fd02e216f2f110b4186eda" }

[[bin]]
name = "sniff_tls"
path = "fuzz_targets/sniff_tls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sniff_http"
path = "fuzz_targets/sniff_http.rs"
