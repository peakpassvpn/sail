# Fuzz targets for the parsers sniffing runs on what clients send, for
# share links, which come from subscriptions anyone may serve, and for the
# DHCP lease files other programs write. From the
# repository root, with cargo-fuzz:
#
#     cargo +nightly fuzz run --fuzz-dir fuzz sniff_quic -- -max_total_time=60
#
# Targets: sniff_tls, sniff_http, sniff_dns, sniff_quic, sniff_any,
# share_link, dhcp_leases, on Linux the TUN's tun_vnet_header and
# tun_coalesce, the protocols' wire as a peer sends it: proto_anytls,
# proto_hysteria2, proto_tuic, proto_shadowtls, proto_vless, and what a
# host passes the C ABI: ffi_settings, ffi_control, ffi_host.

[package]
name = "sail-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The sniffers, btls for QUIC's Initial packets, and the entry points of
# sail's fuzzing module.
sail = { path = "../sail", default-features = false, features = [
    "aead", "fuzzing", "inbound-tun",
    "inbound-anytls", "outbound-anytls",
    "inbound-hysteria2", "outbound-hysteria2",
    "inbound-tuic", "outbound-tuic",
    "inbound-shadowtls", "outbound-shadowtls",
    "inbound-vless", "outbound-vless",
    "mux", "inbound-amux", "outbound-amux",
] }

# The C functions themselves, called from Rust: sail-ffi's sources as a
# library (ffi/Cargo.toml says why). It adds no feature of sail's to the
# ones above.
sail_ffi = { package = "sail-ffi-fuzz", path = "ffi" }

# A workspace of its own: the targets build on nightly with sanitizers,
# apart from sail's.
[workspace]

# The workspace's, kept identical by tools/fuzz-check.sh.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "132da2caff5d94c0f9ea52aa82bbc170bf2baaa6" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "132da2caff5d94c0f9ea52aa82bbc170bf2baaa6" }
# One revision for both; FORK.md there says what each carries.
quinn = { git = "https://github.com/peakpassvpn/quinn.git", rev = "635ad5a1b20bc9152ddf219b709ff7ac10c343d8" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "635ad5a1b20bc9152ddf219b709ff7ac10c343d8" }

