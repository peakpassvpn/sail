[workspace]
members = [
    "sail",
    "sail-cli",
    "sail-ffi",
    "sail-netstack",
    "sail-plugins/shadowsocks",
]
default-members = ["sail-cli"]
resolver = "2"

# sail's forks, each with a FORK.md on its `sail` branch: btls with the
# REALITY and ECH GREASE hooks, the Apple deployment target and the SslRef
# handshake-side setters; quinn-proto with the scattered ClientHello.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "3eb203a7ed44fd93d31056156a1ddfab5a6b9338" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "3eb203a7ed44fd93d31056156a1ddfab5a6b9338" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "a0294adec58a09e6d4d1322ed123ff647dfa619b" }
# tun-rs's netlink graph without paste (RUSTSEC-2024-0436); see
# tools/security/policy.toml for when these go.
netconfig-rs = { git = "https://github.com/peakpassvpn/netconfig-rs.git", rev = "a5caf848a0e0f18bc9810c1fa854f3ac6a903443" }
route_manager = { git = "https://github.com/peakpassvpn/route_manager.git", rev = "5703367f56a7b4fed9fd02e216f2f110b4186eda" }

[profile.release]
opt-level = 3
lto = true
# codegen-units = 1
panic = "abort"
strip = "symbols"

# What a release ships: release, with line tables kept so that
# scripts/release/split-symbols.sh can move them out of the shipped file
# into one of their own, matched to it by build ID.
[profile.dist]
inherits = "release"
debug = "line-tables-only"
strip = false

[profile.dev]
opt-level = 0
debug = true
