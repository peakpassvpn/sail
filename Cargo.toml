[workspace]
members = [
    "sail",
    "sail-cli",
    "sail-ffi",
    "sail-netstack",
    "sail-plugins/shadowsocks",
]
default-members = ["sail-cli"]
resolver = "2"

# sail's forks, each with a FORK.md on its `sail` branch: btls with the
# REALITY and ECH GREASE hooks, the Apple deployment target and the SslRef
# handshake-side setters; quinn-proto with the scattered ClientHello.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "ac0737da7704788407daab3c5e6abd3dca7ae55e" }
# tun-rs's netlink graph without paste (RUSTSEC-2024-0436); see
# tools/security/policy.toml for when these go.
netconfig-rs = { git = "https://github.com/peakpassvpn/netconfig-rs.git", rev = "a5caf848a0e0f18bc9810c1fa854f3ac6a903443" }
route_manager = { git = "https://github.com/peakpassvpn/route_manager.git", rev = "5703367f56a7b4fed9fd02e216f2f110b4186eda" }

[profile.release]
opt-level = 3
lto = true
# codegen-units = 1
panic = "abort"
strip = "symbols"

# What a release ships: release, with line tables kept so that
# scripts/release/split-symbols.sh can move them out of the shipped file
# into one of their own, matched to it by build ID.
[profile.dist]
inherits = "release"
debug = "line-tables-only"
strip = false

# BoringSSL at -O3, as in release. cmake-rs takes CMake's build type from
# btls-sys's settings: opt-level 3 with debug info is RelWithDebInfo, -O2;
# without, Release, -O3. BoringSSL adds -ggdb itself either way (not with
# MSVC), so its frames keep their symbols and lines. dist-router's
# opt-level "z" stays MinSizeRel, -Os. With MSVC BoringSSL's frames have no
# debug info; when Windows crash reports want them, set
# CMAKE_C_FLAGS_RELEASE / CMAKE_CXX_FLAGS_RELEASE to add /Zi for btls-sys.
[profile.dist.package.btls-sys]
debug = false

# A router's build: every feature, smaller for its flash. Measured on
# armv7 musl: 19.1 MB at dist, about 11 MB here; forwarding CPU on x86_64
# within the judged limit (-2 to +6% per GiB for direct, ss and trojan).
# Its allocator, musl's, is chosen by build-cli.sh, not here.
[profile.dist-router]
inherits = "dist"
opt-level = "z"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
