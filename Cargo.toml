[workspace]
members = [
    "sail",
    "sail-cli",
    "sail-ffi",
    "sail-plugins/shadowsocks",
]
default-members = ["sail-cli"]
resolver = "2"

# btls with the patches sail needs before they are upstream: the ClientHello
# hook REALITY uses, the Apple deployment target, SslRef::set_*_state.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "4123de36dc5ac86914c8a744f958025e598aa712" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "4123de36dc5ac86914c8a744f958025e598aa712" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "6d1e2b9e29895c1707a83167fb482348a70ac65c" }

[profile.release]
opt-level = 3
lto = true
# codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
