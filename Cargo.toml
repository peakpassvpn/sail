[workspace]
members = [
    "leaf",
    "leaf-cli",
    "leaf-ffi",
    "leaf-plugins/shadowsocks",
]
default-members = ["leaf-cli"]
resolver = "2"

# btls with the patches leaf needs before they are upstream: the ClientHello
# hook REALITY uses, the Apple deployment target, SslRef::set_*_state.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "da71229e485e89fa2a403a491e145b53b56841a4" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "da71229e485e89fa2a403a491e145b53b56841a4" }

[profile.release]
opt-level = 3
lto = true
# codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
