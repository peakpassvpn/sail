name: upstream watch

# Once a week: how far each fork sail depends on (tools/upstream-watch/
# forks.json) is from its upstream, written into one issue that this job
# keeps up to date. It merges and pushes nothing.
on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: report
        run: python3 tools/upstream-watch/report.py > report.md

      - name: update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Upstream sync report
        run: |
          gh label create upstream-watch --color c5def5 --description "Weekly fork report" 2>/dev/null || true
          n=$(gh issue list --label upstream-watch --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file report.md
          else
            gh issue create --title "$TITLE" --label upstream-watch --body-file report.md
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
