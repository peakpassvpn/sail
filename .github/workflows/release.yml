name: release

# A release is started by hand on master, with its version; without
# `publish` it is a dry run, whose files stay in the run's artifacts.
# The 5.8 release design: each target is built by its own job with the
# scripts ci.yml's cross job checks, symbols are kept apart, two Linux
# targets are built twice and must match, and the release stays a draft
# until every file is in it. The tag is the workflow's: its commit is the
# branch's with the root's Package.swift pointing at the release's
# XCFramework, which only then has a checksum. Its notes begin with
# docs/releases/<version>.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: version, as in sail-cli/Cargo.toml (no "v")
        required: true
      publish:
        description: tag and publish the release (otherwise a dry run)
        type: boolean
        default: false
      prerelease:
        description: a pre-release, not marked the latest
        type: boolean
        default: false
      apple:
        description: build Apple's on a macOS runner (off for a dry run only)
        type: boolean
        default: true

permissions:
  contents: read

env:
  # rust-toolchain.toml's; keep them in step.
  TOOLCHAIN: 1.98.1
  # wintun.net's zip, with the hash its download page gives.
  WINTUN_VERSION: 0.14.1
  WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
  CARGO_CYCLONEDX_VERSION: 0.5.9
  # The AAR's build: the Android Gradle plugin, Gradle, and the JDK it runs
  # on. The NDK is scripts/install_cross_toolchain.sh's, the one the
  # static libraries are built with.
  AGP_VERSION: 9.4.1
  GRADLE_VERSION: 9.8.0
  JAVA_VERSION: 21

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      epoch: ${{ steps.epoch.outputs.epoch }}
      release: ${{ steps.release.outputs.flags }}
    steps:
      - uses: actions/checkout@v4

      - name: version and branch
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' sail-cli/Cargo.toml | head -1)
          [ "$crate" = "$VERSION" ] ||
            { echo "::error::sail-cli is $crate, not $VERSION"; exit 1; }
          if [ "$PUBLISH" = true ] && [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::a release is published from master only"; exit 1
          fi

      # Not run again here: the ci run on this commit must have passed.
      - name: ci passed on this commit
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --json conclusion --jq '.[].conclusion' | grep -qx success ||
            { echo "::error::no successful ci run on $GITHUB_SHA"; exit 1; }

      # What the publish job does with the release, said here so that a dry
      # run shows it.
      - name: release settings
        id: release
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          PRERELEASE: ${{ inputs.prerelease }}
          APPLE: ${{ inputs.apple }}
        run: |
          if [ "$PUBLISH" = true ] && [ "$APPLE" != true ]; then
            echo "::error::a release is published with Apple's"; exit 1
          fi
          notes=docs/releases/$VERSION.md
          if [ "$PUBLISH" = true ] && [ ! -s "$notes" ]; then
            echo "::error::no release notes in $notes"; exit 1
          fi
          if [ "$PRERELEASE" = true ]; then
            flags="--prerelease --latest=false"
          else
            flags="--latest"
          fi
          echo "flags=$flags" >>"$GITHUB_OUTPUT"
          echo "release v$VERSION: publish=$PUBLISH, gh release edit $flags, notes $notes ($( [ -s "$notes" ] && echo present || echo missing ))"

      - name: source date
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"

  cli:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabi
          - i686-unknown-linux-musl
          - x86_64-pc-windows-gnu
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: llvm-tools

      - name: install cross toolchain
        run: scripts/install_cross_toolchain.sh ${{ matrix.target }}

      - name: build
        run: scripts/release/build-cli.sh ${{ matrix.target }} "${{ inputs.version }}" out

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: out/

  android-lib:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-linux-android, abi: arm64-v8a }
          - { target: armv7-linux-androideabi, abi: armeabi-v7a }
          - { target: x86_64-linux-android, abi: x86_64 }
          - { target: i686-linux-android, abi: x86 }
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}

      - name: install cross toolchain
        run: scripts/install_cross_toolchain.sh ${{ matrix.target }}

      - name: build
        run: scripts/release/build-lib-android.sh ${{ matrix.target }} ${{ matrix.abi }} libs

      - uses: actions/upload-artifact@v4
        with:
          name: android-lib-${{ matrix.abi }}
          path: libs/

  aar:
    needs: [check, android-lib]
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: llvm-tools

      # The NDK alone: any Android target installs it.
      - name: install the NDK
        run: scripts/install_cross_toolchain.sh aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          pattern: android-lib-*
          path: libs
          merge-multiple: true

      - name: build and check
        run: |
          NDK_PATH=$(echo "$HOME"/.sail-cross/android-ndk-*) \
            scripts/release/package-aar.sh "${{ inputs.version }}" libs out

      - uses: actions/upload-artifact@v4
        with:
          name: aar
          path: out/

  # Apple's: sail for macOS (both architectures in one file) and the
  # XCFramework, one job, as they build the same crates. Standard runner.
  apple:
    if: ${{ inputs.apple }}
    needs: check
    runs-on: macos-latest
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: GNU tar
        run: command -v gtar || brew install gnu-tar

      - name: build
        run: scripts/release/build-apple.sh "${{ inputs.version }}" out

      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: out/

  # The same commit built again on another runner must give the same bytes.
  reproducible:
    needs: [check, cli]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: llvm-tools

      - name: install cross toolchain
        run: scripts/install_cross_toolchain.sh ${{ matrix.target }}

      - name: build again
        run: scripts/release/build-cli.sh ${{ matrix.target }} "${{ inputs.version }}" again

      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: first

      - name: compare
        env:
          T: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "first: $(cat "first/$T.sha256")  again: $(cat "again/$T.sha256")"
          cmp "first/$T.sha256" "again/$T.sha256"
          cmp "first/ship/sail-$VERSION-$T.tar.gz" "again/ship/sail-$VERSION-$T.tar.gz"

  assemble:
    needs: [check, cli, reproducible, aar, apple]
    # Apple's may be skipped, in a dry run; nothing may fail.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: built

      - uses: actions/download-artifact@v4
        with:
          name: aar
          path: built/aar

      - uses: actions/download-artifact@v4
        if: ${{ inputs.apple }}
        with:
          name: apple
          path: built/apple

      - name: gather
        run: |
          mkdir -p dist symbols
          cp built/*/ship/* dist/
          cat built/*/ids.txt >dist/ids.txt
          cp -R built/*/symbols/* symbols/
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" \
            -cf - symbols | gzip -n -9 >"dist/sail-$VERSION-symbols.tar.gz"
          cp THIRD_PARTY_LICENSES.md dist/

      - name: software bill of materials
        run: |
          cargo install --locked cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION"
          cargo cyclonedx --manifest-path sail-cli/Cargo.toml -f json --spec-version 1.5 \
            --override-filename sail-sbom
          cp sail-cli/sail-sbom.json "dist/sail-$VERSION-sbom.cdx.json"

      - name: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The last release's, for the change in size; none before the first.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern manifest.json \
            --dir last 2>/dev/null || true
          scripts/release/manifest.py dist "$VERSION" last/manifest.json | tee grown.txt
          rm dist/ids.txt

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            grown.txt

  # The only job that may write: it tags the commit and publishes.
  publish:
    if: ${{ inputs.publish }}
    needs: [check, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: nothing that must not be public
        run: tools/sensitive-check.sh tree

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: .

      # The tagged commit: this one, with the Swift package fetching the
      # release's XCFramework. Only the tag is pushed; the branch keeps
      # building SailC from the source.
      - name: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release/swift-package.sh "$GITHUB_REPOSITORY" "$VERSION" dist/SailC.xcframework.zip
          git commit -q -am "release: sail $VERSION, its Swift package on the release's XCFramework"
          tools/sensitive-check.sh range "$GITHUB_SHA" HEAD
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FLAGS: ${{ needs.check.outputs.release }}
        run: |
          tag=v$VERSION
          {
            cat "docs/releases/$VERSION.md"
            echo
            echo "---"
            echo
            echo "Every file's hash is in SHA256SUMS, its size and build ID in manifest.json,"
            echo "and its build provenance can be checked with \`gh attestation verify\`."
            echo
            echo "Swift: the package at this tag (the repository's root) fetches SailC.xcframework.zip from here."
            if [ -s grown.txt ]; then echo; echo "Grown since the last release:"; sed 's/^/- /' grown.txt; fi
          } >notes.md
          # A draft until every file is in it.
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "sail $VERSION" --notes-file notes.md --draft dist/*
          read -ra flags <<<"$RELEASE_FLAGS"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
