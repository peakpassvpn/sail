name: perf-desktop

# The desktop cell (tools/perf/desktop): sail against sing-box as a local client
# on a Windows and a macOS runner, by hand only. Every other throughput and
# CPU number of sail's is Linux's.
#
# Runners are noisy and differ from run to run, so both clients run in the
# same job, turn about, and the report's ratios are what to read; the
# absolute numbers are that runner's, that hour.
#
# The default is Windows alone: macOS is asked for by name.
#
# sail is built natively, at the profile a release ships (dist), with the
# BoringSSL ci.yml's jobs link. On Windows that is MSVC, as windows-msvc in
# ci.yml, and the cell compares three builds of the commit in one run:
#
#   sail           dist, MSVC, the system's allocator;
#   sail-mimalloc  the same with --cfg sail_measure_mimalloc, sail-cli's
#                  measurement switch: what the allocator costs on Windows;
#   sail-gnu       what a release ships for Windows: the x86_64-pc-windows-gnu
#                  cross build, made on Linux by the job `gnu` with the
#                  release's scripts (as release.yml's cli job), stripped as
#                  the shipped file is. Not built on the Windows runner:
#                  there is no prebuilt BoringSSL for windows-gnu, and its
#                  MinGW is not the one a release is built with.
#
# macOS measures its one native build.
#
# Time, from the first run (2026-10-12, windows-latest, 4 CPUs, no cache):
# the dist build 15 minutes, the cell with one build of sail 3.5, the rest
# 2. Now: the second build is a whole one, as its RUSTFLAGS differ, so
# another 15; the cell with three builds about 7; so about 40 of the 60
# minutes. The gnu job, 9 minutes in a release, runs before.
on:
  workflow_dispatch:
    inputs:
      os:
        description: the runners to measure on
        type: choice
        options: [windows, macos, both]
        default: windows

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SING_BOX_VERSION: 1.14.2

jobs:
  # sail-gnu for the Windows cell: scripts/cross.sh at the dist profile, as
  # scripts/release/build-cli.sh builds it, and scripts/release/
  # split-symbols.sh as package-cli.sh strips it. BoringSSL is compiled:
  # windows-gnu has no prebuilt one.
  gnu:
    if: ${{ inputs.os != 'macos' }}
    name: sail-gnu (cross build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # The version is rust-toolchain.toml's; keep them in step. llvm-tools
      # for split-symbols.sh.
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools

      - name: install cross toolchain
        run: scripts/install_cross_toolchain.sh x86_64-pc-windows-gnu

      - name: build sail
        run: scripts/cross.sh x86_64-pc-windows-gnu build --locked --profile dist -p sail-cli

      - name: strip
        run: |
          mkdir -p sail-gnu
          cp target/x86_64-pc-windows-gnu/dist/sail.exe sail-gnu/sail-gnu.exe
          scripts/release/split-symbols.sh sail-gnu/sail-gnu.exe "$RUNNER_TEMP/symbols"
          ls -l sail-gnu

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: sail-gnu
          path: sail-gnu/sail-gnu.exe
          if-no-files-found: error
          retention-days: 7

  cell:
    # After gnu, which a macOS run skips. When it failed, the cell runs
    # without sail-gnu and says so.
    needs: gnu
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'both' && '["windows-latest","macos-15"]' || inputs.os == 'macos' && '["macos-15"]' || '["windows-latest"]') }}
    name: cell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      EXE: ${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false

      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # The version is rust-toolchain.toml's; keep them in step.
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # bindgen's libclang, from the runner's LLVM, as windows-msvc in ci.yml.
      - name: libclang (Windows)
        if: runner.os == 'Windows'
        run: printf '%s\n' 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # The fork's BoringSSL, as ci.yml's header says.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: perf-desktop
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # What a release ships: the dist profile (release, with line tables).
      # Each build of the cell is kept under its name in variants/.
      - name: build sail
        run: |
          cargo build --locked --profile dist -p sail-cli
          mkdir -p variants
          cp "target/dist/sail$EXE" "variants/sail$EXE"

      # The measurement switch (sail-cli's Cargo.toml): mimalloc in place of
      # the system's allocator. In a target directory of its own: other
      # RUSTFLAGS build every crate again, and the build above stays as the
      # cache saves it. BoringSSL is the prebuilt one in both.
      - name: build sail-mimalloc (Windows)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: --cfg sail_measure_mimalloc
          CARGO_TARGET_DIR: target-mimalloc
        run: |
          cargo build --locked --profile dist -p sail-cli
          cp target-mimalloc/dist/sail.exe variants/sail-mimalloc.exe
          rm -rf target-mimalloc

      - name: sail-gnu (Windows)
        if: runner.os == 'Windows' && needs.gnu.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sail-gnu
          path: variants

      # BoringSSL without its assembly would be several times slower at
      # AES-GCM and ChaCha20, and the cell would measure that: the prebuilt
      # library defines the assembly's functions (as ci.yml checks). One
      # compiled here, when there was no prebuilt one, is only told.
      - name: BoringSSL has its assembly (Windows)
        if: runner.os == 'Windows'
        run: |
          path=${BORING_BSSL_PATH_x86_64_pc_windows_msvc:-}
          if [ -z "$path" ]; then
            echo "::warning title=BoringSSL from source::its assembly is not checked; compare the numbers with care"
            exit 0
          fi
          # Read once: grep -q ending a pipe early fails it under pipefail.
          syms=$(llvm-nm "$path/lib/crypto.lib" | tr -d '\r')
          for f in gcm_ghash_avx ChaCha20_ctr32_avx2; do
            grep -qE " T $f\$" <<<"$syms" || { echo "$path/lib/crypto.lib does not define $f"; exit 1; }
          done

      - name: install go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: build netgen
        run: |
          mkdir -p bin
          (cd scripts/netem/netgen && CGO_ENABLED=0 go build -o ../../../bin/ .)
          ls -l bin

      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The release's own archive, checked against the hash written here
      # (of the files of v1.14.2, downloaded and hashed 2026-10-12).
      - name: sing-box
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
          Windows-X64)
            name=sing-box-$SING_BOX_VERSION-windows-amd64 ext=zip
            sha256=c2d8bfff918755808781dfdeeb8581b6c91eb3a243d9a7b55483cfc0c0684d32
            ;;
          macOS-ARM64)
            name=sing-box-$SING_BOX_VERSION-darwin-arm64 ext=tar.gz
            sha256=925c5382eca8492b0150f868a6db20b18290a38700e621724b3703fd453e032d
            ;;
          # macos-15 is arm64. For an Intel runner, darwin-amd64.tar.gz is
          # b0bfb0dc70a5fc708710b9f5ea98b9ee76d40fa4169928d25d73edc4331df2fe.
          *)
            echo "no sing-box archive is pinned for $RUNNER_OS-$RUNNER_ARCH"
            exit 1
            ;;
          esac
          curl -fsSL --retry 3 -o "$name.$ext" \
            "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/$name.$ext"
          python - "$name.$ext" "$sha256" <<'EOF'
          import hashlib, shutil, sys
          archive, pinned = sys.argv[1:]
          actual = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          if actual != pinned:
              sys.exit(f"{archive}: sha256 {actual}, not the pinned {pinned}")
          shutil.unpack_archive(archive, "sing-box-release")
          EOF
          mkdir -p bin
          # Windows' has a DLL beside it.
          cp "sing-box-release/$name"/* bin/
          chmod +x bin/sing-box*
          bin/sing-box version

      - name: psutil
        run: python -m pip install psutil

      # One build on macOS, under the name sail; Windows' three.
      - name: measure
        run: |
          builds=(--sail variants/sail)
          if [ "$RUNNER_OS" = Windows ]; then
            builds=(--sail sail=variants/sail --sail sail-mimalloc=variants/sail-mimalloc)
            if [ -f variants/sail-gnu.exe ]; then
              builds+=(--sail sail-gnu=variants/sail-gnu)
            else
              echo "::warning title=sail-gnu::the cross build failed; the cell runs without it"
            fi
            for f in variants/*.exe; do "$f" --version; done
            {
              echo "Builds of this commit, all at the dist profile: \`sail\` is MSVC with the"
              echo "system's allocator; \`sail-mimalloc\` the same with mimalloc (built with"
              echo "\`--cfg sail_measure_mimalloc\`, a measurement switch that no release has);"
              echo "\`sail-gnu\` the x86_64-pc-windows-gnu cross build, as a release ships."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python tools/perf/desktop/run.py "${builds[@]}" --sing-box bin/sing-box \
            --netgen bin/netgen --work cell-work --out results.json

      # The numbers, and the logs of a cell that failed. Not the keys.
      - name: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-desktop-${{ matrix.os }}
          path: |
            results.json
            cell-work/**/*.log
            cell-work/**/*.json
          if-no-files-found: warn
