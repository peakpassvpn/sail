name: perf-desktop

# The desktop cell (tools/perf/desktop): sail against sing-box as a local client
# on a Windows and a macOS runner, by hand only. Every other throughput and
# CPU number of sail's is Linux's.
#
# Runners are noisy and differ from run to run, so both clients run in the
# same job, turn about, and the report's ratios are what to read; the
# absolute numbers are that runner's, that hour.
#
# The default is Windows alone: macOS is asked for by name.
#
# sail is built natively, at the profile a release ships (dist), with the
# BoringSSL ci.yml's jobs link; on Windows that is MSVC, as windows-msvc in
# ci.yml. What the cell compares is the input `builds`.
#
# `buffers`, the default: one build, started four ways, over Hysteria2 alone
# (the other two protocols have no UDP socket). The UDP sockets of QUIC keep
# the system's buffers unless `quic.udp_receive_buffer` and
# `quic.udp_send_buffer` are set, and Windows' are 64 KiB:
#
#   sail        as it ships: the system's buffers;
#   sail-buf1m  both at 1024 KiB, as Chromium asks;
#   sail-buf7m  both at 7168 KiB, as sing-box's QUIC (quic-go) asks;
#   sail-rcv7m  the receive buffer alone at 7168 KiB.
#
# What the runner gives a socket that asks for those sizes is in the summary.
# Nothing else of the socket is varied, and Windows' receive offload (URO)
# is not a candidate: it corrupts datagrams on some Windows 11 systems.
#
# `allocators`: three builds of the commit on Windows, all three protocols:
#
#   sail           dist, MSVC, the system's allocator;
#   sail-mimalloc  the same with --cfg sail_measure_mimalloc, sail-cli's
#                  measurement switch: what the allocator costs on Windows;
#   sail-gnu       what a release ships for Windows: the x86_64-pc-windows-gnu
#                  cross build, made on Linux by the job `gnu` with the
#                  release's scripts (as release.yml's cli job), stripped as
#                  the shipped file is. Not built on the Windows runner:
#                  there is no prebuilt BoringSSL for windows-gnu, and its
#                  MinGW is not the one a release is built with.
#
# `profile`: Windows only, whatever `os` says. One build, one round of
# Hysteria2 and of Trojan, and every download sampled by xperf (the Windows
# Performance Toolkit's: the whole system, a sample a millisecond, with
# stacks). The summary says where each client's process spent its CPU: by
# what it was doing, in CPU seconds per GiB (profile.py's markers, an
# approximation), by module, by function and by stack; the artifact has
# every stack with its count. sail's frames have their names from the build's PDB (dist has line
# tables), Windows' own from Microsoft's symbol server; sing-box's, a Go
# program without a PDB, have none. The run's tables are of sampled
# transfers: not ones to compare with another run's.
#
# macOS has its one native build: started the same four ways with `buffers`
# (its UDP buffers are small too), and once, over all three protocols, with
# `allocators`.
#
# Time, from the first run (2026-10-12, windows-latest, 4 CPUs, no cache):
# the dist build 15 minutes, the cell with one build of sail 3.5, the rest
# 2. `allocators`: the second build is a whole one, as its RUSTFLAGS differ,
# so another 15; the cell with three builds about 7; so about 40 of the 60
# minutes, and the gnu job, 9 minutes in a release, runs before. `buffers`
# builds once and has no gnu job; its cell is not timed yet.
on:
  workflow_dispatch:
    inputs:
      os:
        description: the runners to measure on
        type: choice
        options: [windows, macos, both]
        default: windows
      builds:
        description: "plain: one build, all protocols; buffers: one build, four socket buffer sizes, Hysteria2; allocators: three builds (Windows), all protocols; workers: one build with 1, 2 (as shipped) and 4 worker threads and single-threaded, all protocols; profile: where the CPU goes (Windows only), Hysteria2 and Trojan"
        type: choice
        options: [plain, buffers, allocators, workers, profile]
        default: plain
      streams:
        description: "the streams of a transfer, at once (not for profile)"
        type: choice
        options: ["4", "1"]
        default: "4"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SING_BOX_VERSION: 1.14.2

jobs:
  # sail-gnu for the Windows cell: scripts/cross.sh at the dist profile, as
  # scripts/release/build-cli.sh builds it, and scripts/release/
  # split-symbols.sh as package-cli.sh strips it. BoringSSL is compiled:
  # windows-gnu has no prebuilt one.
  gnu:
    if: ${{ inputs.os != 'macos' && inputs.builds == 'allocators' }}
    name: sail-gnu (cross build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # The version is rust-toolchain.toml's; keep them in step. llvm-tools
      # for split-symbols.sh.
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools

      - name: install cross toolchain
        run: scripts/install_cross_toolchain.sh x86_64-pc-windows-gnu

      - name: build sail
        run: scripts/cross.sh x86_64-pc-windows-gnu build --locked --profile dist -p sail-cli

      - name: strip
        run: |
          mkdir -p sail-gnu
          cp target/x86_64-pc-windows-gnu/dist/sail.exe sail-gnu/sail-gnu.exe
          scripts/release/split-symbols.sh sail-gnu/sail-gnu.exe "$RUNNER_TEMP/symbols"
          ls -l sail-gnu

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: sail-gnu
          path: sail-gnu/sail-gnu.exe
          if-no-files-found: error
          retention-days: 7

  cell:
    # After gnu, which only `allocators` on Windows runs. When it failed,
    # the cell runs without sail-gnu and says so.
    needs: gnu
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # `profile` is Windows alone, whatever was asked for.
        os: ${{ fromJSON(inputs.builds != 'profile' && inputs.os == 'both' && '["windows-latest","macos-15"]' || inputs.builds != 'profile' && inputs.os == 'macos' && '["macos-15"]' || '["windows-latest"]') }}
    name: cell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.builds == 'profile' && 90 || 60 }}
    env:
      CARGO_INCREMENTAL: 0
      EXE: ${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false

      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # The version is rust-toolchain.toml's; keep them in step.
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # bindgen's libclang, from the runner's LLVM, as windows-msvc in ci.yml.
      - name: libclang (Windows)
        if: runner.os == 'Windows'
        run: printf '%s\n' 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # The fork's BoringSSL, as ci.yml's header says.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: perf-desktop
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # What a release ships: the dist profile (release, with line tables).
      # Each build of the cell is kept under its name in variants/.
      - name: build sail
        run: |
          cargo build --locked --profile dist -p sail-cli
          mkdir -p variants
          cp "target/dist/sail$EXE" "variants/sail$EXE"

      # The measurement switch (sail-cli's Cargo.toml): mimalloc in place of
      # the system's allocator. In a target directory of its own: other
      # RUSTFLAGS build every crate again, and the build above stays as the
      # cache saves it. BoringSSL is the prebuilt one in both.
      - name: build sail-mimalloc (Windows)
        if: runner.os == 'Windows' && inputs.builds == 'allocators'
        env:
          RUSTFLAGS: --cfg sail_measure_mimalloc
          CARGO_TARGET_DIR: target-mimalloc
        run: |
          cargo build --locked --profile dist -p sail-cli
          cp target-mimalloc/dist/sail.exe variants/sail-mimalloc.exe
          rm -rf target-mimalloc

      - name: sail-gnu (Windows)
        if: runner.os == 'Windows' && inputs.builds == 'allocators' && needs.gnu.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: sail-gnu
          path: variants

      # BoringSSL without its assembly would be several times slower at
      # AES-GCM and ChaCha20, and the cell would measure that: the prebuilt
      # library defines the assembly's functions (as ci.yml checks). One
      # compiled here, when there was no prebuilt one, is only told.
      - name: BoringSSL has its assembly (Windows)
        if: runner.os == 'Windows'
        run: |
          path=${BORING_BSSL_PATH_x86_64_pc_windows_msvc:-}
          if [ -z "$path" ]; then
            echo "::warning title=BoringSSL from source::its assembly is not checked; compare the numbers with care"
            exit 0
          fi
          # Read once: grep -q ending a pipe early fails it under pipefail.
          syms=$(llvm-nm "$path/lib/crypto.lib" | tr -d '\r')
          for f in gcm_ghash_avx ChaCha20_ctr32_avx2; do
            grep -qE " T $f\$" <<<"$syms" || { echo "$path/lib/crypto.lib does not define $f"; exit 1; }
          done

      - name: install go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: build netgen
        run: |
          mkdir -p bin
          (cd scripts/netem/netgen && CGO_ENABLED=0 go build -o ../../../bin/ .)
          ls -l bin

      - name: install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The release's own archive, checked against the hash written here
      # (of the files of v1.14.2, downloaded and hashed 2026-10-12).
      - name: sing-box
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
          Windows-X64)
            name=sing-box-$SING_BOX_VERSION-windows-amd64 ext=zip
            sha256=c2d8bfff918755808781dfdeeb8581b6c91eb3a243d9a7b55483cfc0c0684d32
            ;;
          macOS-ARM64)
            name=sing-box-$SING_BOX_VERSION-darwin-arm64 ext=tar.gz
            sha256=925c5382eca8492b0150f868a6db20b18290a38700e621724b3703fd453e032d
            ;;
          # macos-15 is arm64. For an Intel runner, darwin-amd64.tar.gz is
          # b0bfb0dc70a5fc708710b9f5ea98b9ee76d40fa4169928d25d73edc4331df2fe.
          *)
            echo "no sing-box archive is pinned for $RUNNER_OS-$RUNNER_ARCH"
            exit 1
            ;;
          esac
          curl -fsSL --retry 3 -o "$name.$ext" \
            "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/$name.$ext"
          python - "$name.$ext" "$sha256" <<'EOF'
          import hashlib, shutil, sys
          archive, pinned = sys.argv[1:]
          actual = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          if actual != pinned:
              sys.exit(f"{archive}: sha256 {actual}, not the pinned {pinned}")
          shutil.unpack_archive(archive, "sing-box-release")
          EOF
          mkdir -p bin
          # Windows' has a DLL beside it.
          cp "sing-box-release/$name"/* bin/
          chmod +x bin/sing-box*
          bin/sing-box version

      - name: psutil
        run: python -m pip install psutil py-cpuinfo

      # Which machine this is: the cell's ratios differ from runner to
      # runner (Hysteria2's download was 0.63 on one and 1.38 on another,
      # the same image), so each run says what it ran on, and the CPU
      # features BoringSSL chooses its code by.
      - name: the runner
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, platform, urllib.request
          import cpuinfo
          info = cpuinfo.get_cpu_info()
          flags = set(info.get("flags", []))
          region = "not known"
          try:
              request = urllib.request.Request(
                  "http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text",
                  headers={"Metadata": "true"})
              region = urllib.request.urlopen(request, timeout=2).read().decode().strip()
          except Exception:
              pass
          names = [("aes", "aes"), ("pclmulqdq", "pclmulqdq"), ("avx2", "avx2"), ("bmi2", "bmi2"),
                   ("adx", "adx"), ("sha", "sha"), ("sha_ni", "sha"), ("vaes", "vaes"),
                   ("vpclmulqdq", "vpclmulqdq"), ("avx512f", "avx512f"), ("avx512vl", "avx512vl"),
                   ("avx512bw", "avx512bw")]
          have = {}
          for flag, name in names:
              have[name] = have.get(name, False) or flag in flags
          print(f"Runner: {info.get('brand_raw', 'CPU not known')}, {os.cpu_count()} CPUs, "
                f"{platform.platform()}, region {region}.")
          print()
          print("CPU features: " + ", ".join(f"{name} {'yes' if yes else 'no'}" for name, yes in have.items()) + ".")
          print()
          EOF

      # `plain`: one build, all protocols, three rounds: the run to repeat
      # across runners.
      # `allocators`: Windows' three builds, or macOS's one, all protocols.
      # `buffers`: one build started four ways, which differ by the buffers
      # its QUIC sockets ask for, over Hysteria2, and five rounds of it: the
      # four are closer to each other than builds are.
      - name: measure
        if: inputs.builds != 'profile'
        env:
          BUILDS: ${{ inputs.builds }}
          STREAMS: ${{ inputs.streams }}
        run: |
          if [ "$BUILDS" = plain ] || { [ "$BUILDS" = allocators ] && [ "$RUNNER_OS" != Windows ]; }; then
            builds=(--sail variants/sail)
            "variants/sail$EXE" --version
          elif [ "$BUILDS" = workers ]; then
            builds=(
              --sail sail=variants/sail
              --sail sail-w1=variants/sail
              --sail sail-w4=variants/sail
              --sail sail-1t=variants/sail
              --sail-args "sail-w1=--threads 1"
              --sail-args "sail-w4=--threads 4"
              --sail-args "sail-1t=--single-thread"
            )
            "variants/sail$EXE" --version
            {
              echo "One build of this commit, at the dist profile, started four ways: \`sail\` as it"
              echo "ships, the desktop profile's two worker threads; \`sail-w1\` and \`sail-w4\` with"
              echo "one and four (\`--threads\`), four being a worker to each of a runner's CPUs;"
              echo "\`sail-1t\` with \`--single-thread\`, everything on the one thread."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$BUILDS" = allocators ]; then
            builds=(--sail sail=variants/sail --sail sail-mimalloc=variants/sail-mimalloc)
            if [ -f variants/sail-gnu.exe ]; then
              builds+=(--sail sail-gnu=variants/sail-gnu)
            else
              echo "::warning title=sail-gnu::the cross build failed; the cell runs without it"
            fi
            for f in variants/*.exe; do "$f" --version; done
            {
              echo "Builds of this commit, all at the dist profile: \`sail\` is MSVC with the"
              echo "system's allocator; \`sail-mimalloc\` the same with mimalloc (built with"
              echo "\`--cfg sail_measure_mimalloc\`, a measurement switch that no release has);"
              echo "\`sail-gnu\` the x86_64-pc-windows-gnu cross build, as a release ships."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            receive=quic.udp_receive_buffer send=quic.udp_send_buffer
            builds=(
              --sail sail=variants/sail
              --sail sail-buf1m=variants/sail
              --sail sail-buf7m=variants/sail
              --sail sail-rcv7m=variants/sail
              --sail-args "sail-buf1m=--set $receive=1024 --set $send=1024"
              --sail-args "sail-buf7m=--set $receive=7168 --set $send=7168"
              --sail-args "sail-rcv7m=--set $receive=7168"
              --protocols hysteria2 --rounds 5
            )
            "variants/sail$EXE" --version
            {
              echo "One build of this commit, at the dist profile, started four ways: \`sail\` with"
              echo "the system's UDP socket buffers, as it ships; \`sail-buf1m\` asking for 1024 KiB"
              echo "both ways; \`sail-buf7m\` for 7168 KiB both ways, as sing-box's QUIC does;"
              echo "\`sail-rcv7m\` for 7168 KiB to receive alone. Hysteria2 only: the other"
              echo "protocols have no UDP socket."
              echo
              echo "What this runner gives a UDP socket (receive / send, bytes):"
              echo
              python - <<'EOF'
          import socket
          def sizes(asked):
              with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as s:
                  got = []
                  for option in (socket.SO_RCVBUF, socket.SO_SNDBUF):
                      try:
                          if asked:
                              s.setsockopt(socket.SOL_SOCKET, option, asked << 10)
                          got.append(str(s.getsockopt(socket.SOL_SOCKET, option)))
                      except OSError as e:
                          got.append(f"refused ({e})")
                  return " / ".join(got)
          print(f"- as the system makes it: {sizes(0)}")
          for kib in (1024, 7168):
              print(f"- asked for {kib} KiB: {sizes(kib)}")
          EOF
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          python tools/perf/desktop/run.py "${builds[@]}" --streams "$STREAMS" --sing-box bin/sing-box \
            --netgen bin/netgen --work cell-work --out results.json

      # xperf is the Windows Performance Toolkit's, a part of the Windows
      # SDK that the image may have without it.
      - name: xperf (profile)
        if: inputs.builds == 'profile' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $wpt = "${env:ProgramFiles(x86)}\Windows Kits\10\Windows Performance Toolkit"
          if (-not (Test-Path "$wpt\xperf.exe")) {
            choco install windows-performance-toolkit -y --no-progress
          }
          if (-not (Test-Path "$wpt\xperf.exe")) { throw "no xperf.exe in $wpt" }
          Add-Content $env:GITHUB_PATH $wpt
          & "$wpt\xperf.exe" -help start | Select-Object -First 3

      # One round, both clients, each download in a trace of its own (the
      # uploads too with run.py's --profile-directions up,down). More bytes
      # than the cell's 256 MiB a stream, for the samples: Trojan is several
      # times as fast as Hysteria2, so it gets as many times the bytes.
      - name: profile
        if: inputs.builds == 'profile' && runner.os == 'Windows'
        run: |
          variants/sail.exe --version
          ls -l target/dist/sail.pdb
          {
            echo "One build of this commit, at the dist profile. Every download below was"
            echo "sampled by xperf, which costs CPU: read the profiles, not these tables."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          cell() {
            python tools/perf/desktop/run.py --sail variants/sail --sing-box bin/sing-box \
              --netgen bin/netgen --work cell-work --rounds 1 --profile profile \
              --protocols "$1" --bytes "$2" --out "results-$1.json" || failed=1
          }
          cell hysteria2 $((512 << 20))
          cell trojan $((2048 << 20))
          ls -l profile
          exit $failed

      # sail's PDB is beside the build; Windows' own are fetched once. The
      # traces and their text are large and stay here: what is uploaded is
      # the reports and the stacks with their counts.
      - name: profile, read
        if: ${{ !cancelled() && inputs.builds == 'profile' && runner.os == 'Windows' }}
        run: |
          pdbs=$(cygpath -w "$PWD/target/dist")
          temp=$(cygpath -w "$RUNNER_TEMP")
          export _NT_SYMBOL_PATH="$pdbs;srv*$temp\\symbols*https://msdl.microsoft.com/download/symbols"
          export _NT_SYMCACHE_PATH="$temp\\symcache"
          shopt -s nullglob
          for etl in profile/*.etl; do
            name=${etl%.etl}
            echo "::group::$name"
            xperf -i "$(cygpath -w "$etl")" -a tracestats > "$name.stats.txt" 2>&1 || true
            cat "$name.stats.txt"
            if xperf -i "$(cygpath -w "$etl")" -o "$(cygpath -w "$name.txt")" -symbols -a dumper \
              > "$name.xperf.log" 2>&1; then
              python tools/perf/desktop/profile.py "$name.txt" --roles "$name.json" --out "$name" \
                >> "$GITHUB_STEP_SUMMARY" || echo "::warning title=profile::$name was not read"
            else
              echo "::warning title=profile::xperf made no text of $name"
            fi
            tail -n 20 "$name.xperf.log"
            ls -l "$name".*
            rm -f "$name.txt" "$etl"
            echo "::endgroup::"
          done

      # The numbers, and the logs of a cell that failed. Not the keys.
      - name: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-desktop-${{ matrix.os }}
          path: |
            results*.json
            cell-work/**/*.log
            cell-work/**/*.json
            profile/*.md
            profile/*.json
            profile/*.folded
            profile/*.stats.txt
            profile/*.xperf.log
          if-no-files-found: warn
