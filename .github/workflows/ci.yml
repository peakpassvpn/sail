name: ci

# Day-to-day checks, Linux only. A ci/* branch runs two jobs (check,
# features); master adds three cross jobs. Apple builds run at release.
on: [push, pull_request, workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The pre-merge check, on every push: the sensitive check, format, lint
  # and the tests, in one job.
  check:
    runs-on: ubuntu-latest
    env:
      # Line numbers in a failing test's backtrace, without the full debug
      # info, which only costs compile and link time and cache space here.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # Nothing with local paths, run logs or evidence reaches the public repository.
      - name: sensitive (tracked files)
        run: tools/sensitive-check.sh tree

      - name: sensitive (added lines and messages)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            tools/sensitive-check.sh range "$BASE" "$GITHUB_SHA"
          fi

      # The version is rust-toolchain.toml's; keep them in step.
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      # Saved from master only: a ci/* branch restores master's cache, and
      # per-branch saves would push master's out of the 10 GB the repo gets.
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: format
        run: cargo fmt --all --check

      - name: lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # sail, sail-netstack and sail-ffi (the C ABI as a host calls it, the
      # command service included) in one run, so that sail is built once
      # for all three: sail-ffi only adds sail's auto-reload feature, which
      # the features job checks on its own as well.
      - name: test
        run: cargo test -p sail -p sail-netstack -p sail-ffi

      # include/sail.h is committed: it must be what cbindgen makes of the
      # source. The CLI is run, not linked (it is MPL-2.0); its binary is
      # cached by version, saved from master only.
      - name: restore cbindgen
        id: cbindgen
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-0.29.4-${{ runner.os }}

      - name: install cbindgen
        if: steps.cbindgen.outputs.cache-hit != 'true'
        run: cargo install cbindgen --version 0.29.4 --locked

      - name: save cbindgen
        if: steps.cbindgen.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-0.29.4-${{ runner.os }}

      - name: header is cbindgen's
        run: |
          if ! (cd sail-ffi && cbindgen --config cbindgen.toml src/lib.rs) | diff -u sail-ffi/include/sail.h -; then
            echo "::error file=sail-ffi/include/sail.h::not what cbindgen makes of the source; generate it again: (cd sail-ffi && cbindgen --config cbindgen.toml src/lib.rs -o include/sail.h)"
            exit 1
          fi

  # Small builds, one feature set at a time, tests included, so that cfg
  # gates and feature dependencies stay right.
  features:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: check feature sets
        run: |
          set -e
          for features in \
            inbound-socks,outbound-direct \
            inbound-shadowsocks,outbound-shadowsocks \
            inbound-trojan,inbound-tls,outbound-trojan,outbound-tls \
            inbound-vless,inbound-tls,inbound-reality,outbound-vless,outbound-tls,outbound-reality \
            inbound-hysteria2,outbound-hysteria2 \
            inbound-tuic,outbound-tuic \
            inbound-mptp,outbound-direct \
            outbound-mptp,inbound-socks \
            inbound-tun,outbound-direct \
            rule-set,inbound-socks,outbound-direct \
            outbound-load-balance,outbound-redirect \
            outbound-urltest,outbound-redirect \
            config-clash,inbound-mixed,outbound-direct \
            config-surge,inbound-mixed,outbound-direct \
            outbound-provider,outbound-select,outbound-direct,inbound-socks \
            api,outbound-direct
          do
            echo "::group::$features"
            cargo check -p sail --no-default-features --features "$features" --all-targets
            echo "::endgroup::"
          done

      # The generated configuration reference (website) must match the
      # code's fields and tiers; a field change regenerates it.
      - name: configuration reference is current
        run: cd website && node scripts/build-config.mjs --check

  # The non-Apple release targets, built from Linux with the scripts the
  # release uses, in three jobs: a debug build links, which `cargo check`
  # would not, and BoringSSL is compiled either way. On master and by hand
  # only; a ci/* branch skips them.
  # - linux: the musl and Windows CLIs, each started once (`sail --version`,
  #   under qemu-user or wine), which catches a binary that does not load;
  # - aarch64: the sail tests under qemu-user, the one non-x86 test run;
  # - android: the four sail-ffi libraries, built only.
  cross:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            targets: x86_64-unknown-linux-musl i686-unknown-linux-musl armv7-unknown-linux-musleabihf arm-unknown-linux-musleabi x86_64-pc-windows-gnu
            package: sail-cli
            run: smoke
          - name: aarch64
            targets: aarch64-unknown-linux-musl
            package: sail-cli
            run: test
          - name: android
            targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
            package: sail-ffi
            run: ''
    name: cross (${{ matrix.name }})
    env:
      # Debug info and incremental state only cost disk and time here; the
      # statically linked test binaries are large enough without them.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # scripts/install_cross_toolchain.sh downloads into ~/.sail-cross.
      - name: cache cross toolchain
        uses: actions/cache@v4
        with:
          path: ~/.sail-cross
          key: sail-cross-${{ matrix.name }}-${{ hashFiles('scripts/install_cross_toolchain.sh') }}

      # The targets' dependencies (BoringSSL above all), one cache per job,
      # saved from master only like the others; sail itself is rebuilt.
      - name: cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: install cross toolchains
        run: |
          for t in ${{ matrix.targets }}; do
            scripts/install_cross_toolchain.sh "$t" ${{ matrix.run && '--run' || '' }}
          done

      # One target at a time; the host-side build (scripts, proc macros) is
      # shared, and each target's output stays for the build cache (the
      # runner has the disk for it).
      - name: build, then smoke or nothing
        if: ${{ matrix.run != 'test' }}
        run: |
          for t in ${{ matrix.targets }}; do
            echo "::group::$t"
            scripts/cross.sh "$t" build -p ${{ matrix.package }}
            if [ "${{ matrix.run }}" = smoke ]; then
              scripts/cross.sh "$t" run -p sail-cli -- --version
            fi
            echo "::endgroup::"
          done
          df -h / | tail -1

      # test_tls_split pushes 32 MiB each way within a 20 s deadline. Its
      # tests run one at a time here: side by side under qemu-user they
      # miss it on throughput alone, though each passes on its own.
      - name: test sail
        if: ${{ matrix.run == 'test' }}
        run: |
          for t in ${{ matrix.targets }}; do
            scripts/cross.sh "$t" test -p sail -- --skip test_tls_split_
            scripts/cross.sh "$t" test -p sail --test test_tls_split -- --test-threads=1
          done
