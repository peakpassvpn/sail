name: ci

# Day-to-day checks. A ci/* branch runs four jobs in parallel (lint,
# test, features, fuzz), and the bindings' tests (Kotlin on Linux, Swift on
# macOS) when it touches what they test; master adds the cross jobs, one
# per target, a native aarch64 test run and a native Windows MSVC build and
# test run, and always runs the bindings' tests.
# Apple builds run at release. Public-repository runners are free, so jobs
# are split for wall time.
# BoringSSL: each job links the one the btls fork publishes for the commit
# Cargo.lock pins (scripts/prebuilt-boringssl.sh: release bssl-<commit>,
# checked against its SHA256SUMS and build attestation), rather than
# compile it. While that release is not there yet (after a pin bump), or
# has no build for the target, the job compiles it from source with a
# warning; an archive that does not check out fails the job. After a
# build, `--check` reads from btls-sys's build output that it linked the
# downloaded library, not one a cache kept from a source build. Compiled from
# source, as the release ships it: check-32bit on every push (the compile
# path, cross toolchain and CMake), test-aarch64 on master (sail's tests
# against it), cross windows-gnu (no prebuilt build) and release.yml.
on: [push, pull_request, workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The pre-merge checks, on every push, in two parallel jobs. lint: the
  # sensitive check, format, clippy and the generated C header.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # Nothing with local paths, run logs or evidence reaches the public repository.
      - name: sensitive (tracked files)
        run: tools/sensitive-check.sh tree

      - name: sensitive (added lines and messages)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            tools/sensitive-check.sh range "$BASE" "$GITHUB_SHA"
          fi

      # The version is rust-toolchain.toml's; keep them in step.
      # The licences the release's notices accept are cargo-deny's.
      - name: licences
        run: python3 tools/licences/check.py

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      # The fork's BoringSSL, as the header says.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

      # Saved from master only: a ci/* branch restores master's cache, and
      # per-branch saves would push master's out of the 10 GB the repo gets.
      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: format
        run: cargo fmt --all --check

      - name: lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: BoringSSL linked
        run: scripts/prebuilt-boringssl.sh --check "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

      # include/sail.h is committed: it must be what cbindgen makes of the
      # source. The CLI is run, not linked (it is MPL-2.0); its binary is
      # cached by version, saved from master only.
      - name: restore cbindgen
        id: cbindgen
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-0.29.4-${{ runner.os }}

      # rust-cache may restore ~/.cargo/bin with cbindgen already in it, while
      # the cache above misses: install only when that version isn't there.
      - name: install cbindgen
        if: steps.cbindgen.outputs.cache-hit != 'true'
        run: |
          if cbindgen --version 2>/dev/null | grep -qx 'cbindgen 0.29.4'; then
            echo "cbindgen 0.29.4 already installed"
          else
            cargo install cbindgen --version 0.29.4 --locked --force
          fi

      - name: save cbindgen
        if: steps.cbindgen.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-0.29.4-${{ runner.os }}

      - name: header is cbindgen's
        run: |
          if ! (cd sail-ffi && cbindgen --config cbindgen.toml src/lib.rs) | diff -u sail-ffi/include/sail.h -; then
            echo "::error file=sail-ffi/include/sail.h::not what cbindgen makes of the source; generate it again: (cd sail-ffi && cbindgen --config cbindgen.toml src/lib.rs -o include/sail.h)"
            exit 1
          fi

      # The C ABI only grows: each function of the latest release's header
      # keeps its signature, and SailPlatform grows only at its end.
      - name: the C ABI only grows
        run: tools/ffi-abi-check.py

  # test: the tests of sail, sail-netstack and sail-ffi.
  test:
    runs-on: ubuntu-latest
    env:
      # Line numbers in a failing test's backtrace, without the full debug
      # info, which only costs compile and link time and cache space here.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # The fork's BoringSSL, as the header says.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # sail, sail-netstack and sail-ffi (the C ABI as a host calls it, the
      # command service included) in one run, so that sail is built once
      # for all three. sail-ffi adds sail's auto-reload feature, so sail's
      # tests run with it on; the features job builds sail without it.
      # A task spawned outside any instance's scope aborts the run (E2):
      # one on a task of its own would only panic where tokio catches it.
      - name: test
        env:
          SAIL_SCOPE_STRICT: "1"
        run: cargo test -p sail -p sail-netstack -p sail-ffi

      # The mobile libraries' profile unwinds: a contained panic leaves the
      # instance and the host process running. Built as dist-mobile is, but
      # without LTO, which the panic strategy does not depend on.
      - name: a panic in a mobile build
        env:
          CARGO_PROFILE_DIST_MOBILE_LTO: "false"
        run: cargo test --locked -p sail --profile dist-mobile --features fault-injection --test test_panic_unwind

      - name: BoringSSL linked
        run: scripts/prebuilt-boringssl.sh --check "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

  # Small builds, one feature set at a time, tests included, linted as the
  # full build is, so that cfg gates and feature dependencies stay right.
  # With lint and test, this is the whole merge gate: no local gate run is
  # needed before a ci/* branch merges. A new feature (or a group whose
  # cfg gates matter) adds its set to the list below.
  features:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy

      # The fork's BoringSSL, as the header says.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # fault-injection panics where a test arms it: no shipped build may
      # have it. Nothing that makes one names it, and no feature of sail's
      # pulls it in.
      - name: fault-injection stays out of shipped builds
        run: |
          if grep -rn "fault-injection" .github/workflows/release.yml scripts/cross.sh \
               scripts/release scripts/build_*.sh packaging sail-cli/Cargo.toml \
               sail-ffi/Cargo.toml bindings; then
            echo "::error::fault-injection is named where a shipped build is made"
            exit 1
          fi
          if grep -n '"fault-injection"' sail/Cargo.toml; then
            echo "::error::a feature of sail's pulls in fault-injection"
            exit 1
          fi

      - name: lint feature sets
        run: |
          set -e
          echo "::group::no default features"
          cargo clippy -p sail --no-default-features --all-targets
          echo "::endgroup::"
          for features in \
            inbound-socks,outbound-direct \
            inbound-shadowsocks,outbound-shadowsocks \
            inbound-trojan,inbound-tls,outbound-trojan,outbound-tls \
            inbound-vless,inbound-tls,inbound-reality,outbound-vless,outbound-tls,outbound-reality \
            inbound-hysteria2,outbound-hysteria2 \
            inbound-tuic,outbound-tuic \
            inbound-mptp,outbound-direct \
            outbound-mptp,inbound-socks \
            inbound-tun,outbound-direct \
            rule-set,inbound-socks,outbound-direct \
            outbound-load-balance,outbound-redirect \
            outbound-urltest,outbound-redirect \
            config-clash,inbound-mixed,outbound-direct \
            config-surge,inbound-mixed,outbound-direct \
            outbound-provider,outbound-select,outbound-direct,inbound-socks \
            api,outbound-direct \
            outbound-fallback,outbound-direct \
            config-clash,outbound-fallback,outbound-direct \
            inbound-tun,outbound-direct,fault-injection
          do
            echo "::group::$features"
            cargo clippy -p sail --no-default-features --features "$features" --all-targets
            echo "::endgroup::"
          done

      # The generated configuration reference (website) must match the
      # code's fields and tiers; a field change regenerates it.
      - name: configuration reference is current
        run: cd website && node scripts/build-config.mjs --check

  # The fuzz workspaces build apart from sail's, with a BoringSSL of their
  # own: a job of its own, beside the others, so that it adds no wall time.
  # They must build, with the workspace's [patch]es; nothing is fuzzed here.
  fuzz:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # The fork's BoringSSL, as the header says.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fuzz -> target
            sail-netstack/fuzz -> target
            fuzz-config -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: fuzz workspaces build
        run: tools/fuzz-check.sh

  # The non-Apple release targets, built from Linux with the scripts the
  # release uses, one job per target so that they run side by side: a debug
  # build links, which `cargo check` would not, and BoringSSL is compiled
  # either way. The CLIs are started once (`sail --version`, under qemu-user
  # or wine), which catches a binary that does not load; the Android
  # sail-ffi libraries are built only. On master and by hand only; a ci/*
  # branch skips them.
  # A 32-bit target on every push: what only a 32-bit or musl target warns
  # of (libc's time_t on 32-bit musl, usize casts) surfaces before master's
  # cross builds, which do not deny warnings, or a release build does.
  # cross.sh sets the target's own RUSTFLAGS, so -D warnings goes through
  # SAIL_RUSTFLAGS.
  # BoringSSL from source, as the header says: the cross toolchain and
  # CMake path the release's musl builds take, on every push.
  check-32bit:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      SAIL_RUSTFLAGS: -D warnings
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy

      - name: cache cross toolchain
        uses: actions/cache@v4
        with:
          path: ~/.sail-cross
          key: sail-cross-armv7-unknown-linux-musleabihf-${{ hashFiles('scripts/install_cross_toolchain.sh') }}

      - name: cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: check-32bit
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: install cross toolchain
        run: scripts/install_cross_toolchain.sh armv7-unknown-linux-musleabihf

      - name: lint armv7 musl
        run: scripts/cross.sh armv7-unknown-linux-musleabihf clippy -p sail-cli -p sail-ffi

      - name: lint armv7 musl, as a router build (musl's allocator)
        run: scripts/cross.sh armv7-unknown-linux-musleabihf clippy -p sail-cli --no-default-features

  cross:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, package: sail-cli, run: smoke }
          - { target: i686-unknown-linux-musl, package: sail-cli, run: smoke }
          - { target: aarch64-unknown-linux-musl, package: sail-cli, run: smoke }
          - { target: armv7-unknown-linux-musleabihf, package: sail-cli, run: smoke }
          - { target: arm-unknown-linux-musleabi, package: sail-cli, run: smoke }
          - { target: x86_64-pc-windows-gnu, package: sail-cli, run: smoke }
          - { target: aarch64-linux-android, package: sail-ffi, run: '' }
          - { target: armv7-linux-androideabi, package: sail-ffi, run: '' }
          - { target: x86_64-linux-android, package: sail-ffi, run: '' }
          - { target: i686-linux-android, package: sail-ffi, run: '' }
    name: cross (${{ matrix.target }})
    env:
      # Debug info and incremental state only cost disk and time here.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # scripts/install_cross_toolchain.sh downloads into ~/.sail-cross. The
      # four Android jobs share one NDK entry (it is large).
      - name: cache cross toolchain
        uses: actions/cache@v4
        with:
          path: ~/.sail-cross
          key: sail-cross-${{ contains(matrix.target, 'android') && 'android' || matrix.target }}-${{ hashFiles('scripts/install_cross_toolchain.sh') }}

      # The target's dependencies (BoringSSL above all), saved from master
      # only like the other caches; sail itself is rebuilt. Not for the
      # Android libraries: four more large entries would push the others
      # out of the 10 GB the repository gets.
      - name: cache build
        if: ${{ matrix.package == 'sail-cli' }}
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: install cross toolchain
        run: scripts/install_cross_toolchain.sh ${{ matrix.target }} ${{ matrix.run && '--run' || '' }}

      # The fork's BoringSSL, as the header says; windows-gnu has none.
      - name: prebuilt BoringSSL
        if: ${{ matrix.target != 'x86_64-pc-windows-gnu' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh ${{ matrix.target }}

      - name: build
        run: scripts/cross.sh ${{ matrix.target }} build -p ${{ matrix.package }}

      - name: BoringSSL linked
        run: scripts/prebuilt-boringssl.sh --check ${{ matrix.target }}

      - name: smoke
        if: ${{ matrix.run == 'smoke' }}
        run: scripts/cross.sh ${{ matrix.target }} run -p sail-cli -- --version

  # The one non-x86 test run, natively on an arm64 runner (free for public
  # repositories) rather than under qemu-user, which took about 20 minutes.
  test-aarch64:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: test sail
        env:
          SAIL_SCOPE_STRICT: "1"
        run: cargo test -p sail

      - name: BoringSSL linked
        run: scripts/prebuilt-boringssl.sh --check "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

  # Windows with the MSVC toolchain, natively: what an MSVC host app links
  # (sail-ffi's DLL and static library, or sail as a crate). The release's
  # Windows CLI is still the gnu cross build above.
  windows-msvc:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
      # bindgen's libclang, from the runner's LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      # The runner's git checks text out with CRLF, which the tests that
      # compare generated files byte for byte would take for a change.
      - name: LF checkout
        run: git config --global core.autocrlf false

      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc

      # The fork's BoringSSL, as the header says.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh x86_64-pc-windows-msvc

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: tools
        run: cmake --version | head -1; go version; clang --version | head -1

      - name: build sail-cli
        run: cargo build --locked -p sail-cli --target x86_64-pc-windows-msvc

      - name: build sail-ffi
        run: cargo build --locked -p sail-ffi --target x86_64-pc-windows-msvc

      - name: BoringSSL linked
        run: scripts/prebuilt-boringssl.sh --check x86_64-pc-windows-msvc

      # BoringSSL without its assembly (OPENSSL_NO_ASM, or no NASM found)
      # would be several times slower at AES-GCM and ChaCha20: the
      # prebuilt library defines the assembly's functions, or the one
      # compiled here was configured with NASM.
      - name: BoringSSL has its assembly
        run: |
          if [ -n "${BORING_BSSL_PATH_x86_64_pc_windows_msvc:-}" ]; then
            lib="$BORING_BSSL_PATH_x86_64_pc_windows_msvc/lib/crypto.lib"
            # Read once: grep -q ending a pipe early fails it under pipefail.
            syms=$(llvm-nm "$lib" | tr -d '\r')
            for f in gcm_ghash_avx ChaCha20_ctr32_avx2; do
              grep -qE " T $f\$" <<<"$syms" || { echo "$lib does not define $f"; exit 1; }
            done
            exit 0
          fi
          where nasm || true
          cache=$(find target/x86_64-pc-windows-msvc/debug/build -path '*btls-sys-*/out/build/CMakeCache.txt' | head -1)
          grep -E '^(OPENSSL_NO_ASM|CMAKE_ASM_NASM_COMPILER|CMAKE_GENERATOR)[:=]' "$cache" || true
          if grep -qE '^OPENSSL_NO_ASM:[A-Z]+=(1|ON|YES|TRUE)' "$cache"; then exit 1; fi
          grep -qE '^CMAKE_ASM_NASM_COMPILER:[A-Z]+=.+' "$cache"

      - name: smoke
        run: |
          ls -l target/x86_64-pc-windows-msvc/debug/sail.{exe,dll,lib,dll.lib}
          target/x86_64-pc-windows-msvc/debug/sail.exe --version

      # Known failures, each skipped by name until its fix lands; a new
      # failure fails the job.
      - name: test sail
        run: |
          skip=(
            # The corpus's expected outcomes are Linux's, with variants for
            # macOS, and none for Windows (redirect, path separators).
            test_corpus::the_corpus_reads_as_expected
          )
          args=()
          for test in "${skip[@]}"; do args+=(--skip "$test"); done
          cargo test --locked -p sail --target x86_64-pc-windows-msvc -- --exact "${args[@]}"

      # A failing instance leaves nothing while its process lives on
      # (tests/test_teardown.rs): sail in the test's own process, with a
      # TUN, auto_route and strict_route (only 198.18.0.0/16, so the
      # runner's own traffic stays out), failed by a fault the test arms
      # (feature fault-injection). The runner is administrator; wintun.dll,
      # release.yml's pinned one, goes beside the test.
      # Run whatever the tests before did, so that one failure hides no other.
      - name: teardown
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          WINTUN_VERSION: 0.14.1
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:WINTUN_SHA256) { throw "wintun zip: not the pinned hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\wintun"
          $deps = "target\x86_64-pc-windows-msvc\debug\deps"
          New-Item -ItemType Directory -Force $deps | Out-Null
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" $deps
          cargo test --locked -p sail --features fault-injection --target x86_64-pc-windows-msvc --test test_teardown -- --ignored --test-threads 1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Whether the bindings' tests run: on master, when dispatched, and on a
  # branch whose changes since master reach them (the bindings, the C ABI,
  # sail::embed, the JSON snapshot the models are checked against, the
  # Swift package's manifest, this file). Other branches skip both jobs.
  bindings-paths:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: what changed
        id: paths
        run: |
          if [ "$GITHUB_REF" = refs/heads/master ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo run=true >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base HEAD origin/master)
          git diff --name-only "$base" HEAD | tee changed.txt
          if grep -qE '^(bindings/|sail-ffi/|sail/src/embed|sail/src/control/json_snapshot\.json$|Package\.swift$|\.github/workflows/ci\.yml$)' changed.txt; then
            echo run=true >>"$GITHUB_OUTPUT"
          else
            echo run=false >>"$GITHUB_OUTPUT"
          fi

  # The Kotlin binding's tests, on a desktop JVM, against libsail_jni built
  # for this host (jni/build-host.sh).
  bindings-kotlin:
    needs: bindings-paths
    if: needs.bindings-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A hung Gradle daemon or swift test fails the job, rather than hold
    # the runner for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # The fork's BoringSSL, as the header says.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle's own cache: saved from master only, as rust-cache's.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: libsail_jni for this host
        run: bindings/kotlin/jni/build-host.sh

      - name: test
        working-directory: bindings/kotlin
        run: gradle --no-daemon test

  # The Swift binding's tests, on a standard macOS runner, against
  # sail-ffi's static library (bindings/swift/test.sh).
  bindings-swift:
    needs: bindings-paths
    if: needs.bindings-paths.outputs.run == 'true'
    runs-on: macos-15
    # A hung Gradle daemon or swift test fails the job, rather than hold
    # the runner for GitHub's six hours.
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # The fork's BoringSSL, as the header says.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: test
        run: bindings/swift/test.sh

  # The macOS TUN, as root on a runner: the utun chosen at start, a taken
  # name, auto_route's routes of both families and their going after a stop
  # or a kill -9, a route already there replaced, and last a desktop's
  # config that takes the runner's own traffic. Its code is macOS-only, so
  # nothing else runs it: on master, by hand, and on branches touching it.
  tun-macos-paths:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: what changed
        id: paths
        run: |
          if [ "$GITHUB_REF" = refs/heads/master ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo run=true >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base HEAD origin/master)
          git diff --name-only "$base" HEAD | tee changed.txt
          if grep -qE '^(sail/src/protocol/tun/|sail/src/platform/|sail/src/runtime/teardown\.rs|sail/src/fault\.rs|sail/tests/test_teardown\.rs|sail/tests/scripts/macos_utun|\.github/workflows/ci\.yml$)' changed.txt; then
            echo run=true >>"$GITHUB_OUTPUT"
          else
            echo run=false >>"$GITHUB_OUTPUT"
          fi

  tun-macos:
    needs: tun-macos-paths
    if: needs.tun-macos-paths.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # The fork's BoringSSL, as the header says.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh aarch64-apple-darwin

      - name: build
        run: cargo build --locked -p sail-cli --target aarch64-apple-darwin

      - name: route socket tests
        run: cargo test --locked -p sail --lib --target aarch64-apple-darwin -- platform::route_socket

      # A datagram to lo0's link-local fe80::1 keeps its zone through
      # sail::embed's dial_udp (Linux runs it on the runner's Ethernet).
      - name: link-local zone
        run: cargo test --locked -p sail --test it --target aarch64-apple-darwin -- test_embed::a_datagram_to_a_link_local_address_keeps_its_zone

      - name: utun, names and routes
        run: SAIL=target/aarch64-apple-darwin/debug/sail sail/tests/scripts/macos_utun.sh

      # sail in the test's own process, failed by faults it arms (feature
      # fault-injection): nothing of it is left in the routing table, and
      # it starts again. As root, the test binary alone.
      - name: what a failing instance leaves
        run: |
          bin=$(cargo test --locked -p sail --features fault-injection --test test_teardown \
            --target aarch64-apple-darwin --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable')
          sudo "$bin" --ignored --nocapture --test-threads=1

      # Last: it takes the runner's own traffic, and may lose the runner.
      - name: a desktop's config (the default route)
        if: always()
        timeout-minutes: 10
        run: SAIL=target/aarch64-apple-darwin/debug/sail sail/tests/scripts/macos_utun_default.sh

  # The Linux netns suites (sail/tests/scripts/*_netns.sh), as root on a
  # runner, each in network namespaces of its own: the TUN with auto_route
  # and auto_redirect, what a failing instance leaves (in-process, feature
  # fault-injection), a kill's leftovers swept, tproxy, a network switch,
  # and WireGuard against the kernel's. Like tun-macos: on master, by hand,
  # and on branches touching them. The runner has all they need (measured:
  # tun, nf_tables, nft_redir, nft_tproxy, nf_tproxy_ipv4/6, nft_socket,
  # nft_queue, nfnetlink_queue, nft_fib, nft_ct, wireguard load;
  # /dev/net/tun; systemd-resolved; nftables 1.0.9, wireguard-tools and
  # socat installed if missing), so nothing of the suites is left to the
  # test host.
  netns-linux-paths:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: what changed
        id: paths
        run: |
          if [ "$GITHUB_REF" = refs/heads/master ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo run=true >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base HEAD origin/master)
          git diff --name-only "$base" HEAD | tee changed.txt
          if grep -qE '^(sail/src/protocol/tun/|sail/src/net/netstack/|sail/src/platform/|sail/src/runtime/|sail/src/fault\.rs|sail/src/protocol/wireguard/|sail/tests/test_wireguard_interop\.rs|sail/tests/scripts/[a-z_]+_netns\.sh|sail/tests/test_[a-z_]+_linux\.rs|sail/tests/test_teardown\.rs|\.github/workflows/ci\.yml$)' changed.txt; then
            echo run=true >>"$GITHUB_OUTPUT"
          else
            echo run=false >>"$GITHUB_OUTPUT"
          fi

  netns-linux:
    needs: netns-linux-paths
    if: needs.netns-linux-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # The fork's BoringSSL, as the header says.
      - name: prebuilt BoringSSL
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prebuilt-boringssl.sh "$(rustc -vV | sed -n 's/^host:[[:space:]]*//p')"

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # What the suites need of the kernel and the system, said in the log
      # whether there or not: a missing one shows here before a test fails.
      - name: what the runner has
        run: |
          uname -r
          command -v nft >/dev/null || sudo apt-get install -y -qq nftables
          command -v wg >/dev/null && command -v socat >/dev/null ||
            sudo apt-get install -y -qq wireguard-tools socat
          nft --version
          for module in tun nf_tables nft_redir nft_tproxy nf_tproxy_ipv4 nf_tproxy_ipv6 \
              nft_socket nft_queue nfnetlink_queue nft_fib nft_ct wireguard; do
            if sudo modprobe "$module" 2>/dev/null; then echo "module $module: loaded"; else echo "module $module: MISSING"; fi
          done
          ls -l /dev/net/tun
          resolvectl status 2>&1 | head -4 || true

      # As the runner, so that the suites' own builds, as root, find it done.
      - name: build
        id: build
        run: |
          cargo build --locked -p sail-cli
          cargo test --locked -p sail --no-run --test test_auto_redirect_linux \
            --test test_auto_route_linux --test test_network_switch_linux --test test_tproxy_linux
          cargo test --locked -p sail --features fault-injection --test test_teardown --no-run
          cargo test --locked -p sail --features wireguard --test test_wireguard_interop --no-run

      - name: auto_redirect, and what a failing instance leaves
        if: always() && steps.build.outcome == 'success'
        run: sudo -E env "PATH=$PATH" sail/tests/scripts/auto_redirect_netns.sh

      - name: auto_route
        if: always() && steps.build.outcome == 'success'
        run: sudo -E env "PATH=$PATH" sail/tests/scripts/auto_route_netns.sh

      - name: tproxy
        if: always() && steps.build.outcome == 'success'
        run: sudo -E env "PATH=$PATH" sail/tests/scripts/tproxy_netns.sh

      - name: a network switch
        if: always() && steps.build.outcome == 'success'
        run: sudo -E env "PATH=$PATH" sail/tests/scripts/network_switch_netns.sh

      - name: WireGuard against the kernel's
        if: always() && steps.build.outcome == 'success'
        run: sudo -E env "PATH=$PATH" sail/tests/scripts/wireguard_interop_netns.sh
