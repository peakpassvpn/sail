name: ci

# Day-to-day checks, Linux only: macOS runners are costly, so the Apple
# builds run at release (release.yml) and nowhere else.
on: [push, pull_request, workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing with local paths, run logs or evidence reaches the public repository.
  sensitive:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: tracked files
        run: tools/sensitive-check.sh tree

      - name: added lines and messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            tools/sensitive-check.sh range "$BASE" "$GITHUB_SHA"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # The version is rust-toolchain.toml's; keep them in step.
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all --check

      - name: lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test sail
        run: cargo test -p sail

      - name: test sail-netstack
        run: cargo test -p sail-netstack

  # Small builds, one feature set at a time, tests included, so that cfg
  # gates and feature dependencies stay right.
  check-features:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: check feature sets
        run: |
          set -e
          for features in \
            inbound-socks,outbound-direct \
            inbound-shadowsocks,outbound-shadowsocks \
            inbound-trojan,inbound-tls,outbound-trojan,outbound-tls \
            inbound-vless,inbound-tls,inbound-reality,outbound-vless,outbound-tls,outbound-reality \
            inbound-hysteria2,outbound-hysteria2 \
            inbound-tuic,outbound-tuic \
            inbound-tun,outbound-direct \
            rule-set,inbound-socks,outbound-direct \
            outbound-load-balance,outbound-redirect \
            outbound-urltest,outbound-redirect \
            config-clash,inbound-mixed,outbound-direct \
            config-surge,inbound-mixed,outbound-direct \
            outbound-provider,outbound-select,outbound-direct,inbound-socks \
            api,outbound-direct
          do
            echo "::group::$features"
            cargo check -p sail --no-default-features --features "$features" --all-targets
            echo "::endgroup::"
          done

      # The generated configuration reference (website) must match the
      # code's fields and tiers; a field change regenerates it.
      - name: configuration reference is current
        run: cd website && node scripts/build-config.mjs --check

  # Every non-Apple release target, built from Linux with the scripts the
  # release uses. A debug build: it links, which `cargo check` would not,
  # and BoringSSL is compiled either way. Then, where the runner can run
  # the result: `test` runs the sail tests (natively, or under qemu-user),
  # `smoke` runs `sail --version` (qemu-user, wine), which catches a binary
  # that does not load. Android libraries are only built.
  #
  # The matrix is most of a run's minutes, so a ci/* branch (the pre-merge
  # check) skips it: it runs on master, and by hand.
  cross:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, package: sail-cli, run: test }
          - { target: i686-unknown-linux-musl, package: sail-cli, run: smoke }
          - { target: aarch64-unknown-linux-musl, package: sail-cli, run: test }
          - { target: armv7-unknown-linux-musleabihf, package: sail-cli, run: smoke }
          - { target: arm-unknown-linux-musleabi, package: sail-cli, run: smoke }
          - { target: x86_64-pc-windows-gnu, package: sail-cli, run: smoke }
          - { target: aarch64-linux-android, package: sail-ffi }
          - { target: armv7-linux-androideabi, package: sail-ffi }
          - { target: x86_64-linux-android, package: sail-ffi }
          - { target: i686-linux-android, package: sail-ffi }
    env:
      # Debug info and incremental state only cost disk and time here; the
      # statically linked test binaries are large enough without them.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # scripts/install_cross_toolchain.sh downloads into ~/.sail-cross.
      - name: cache cross toolchain
        uses: actions/cache@v4
        with:
          path: ~/.sail-cross
          key: sail-cross-${{ matrix.target }}-${{ hashFiles('scripts/install_cross_toolchain.sh') }}

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install cross toolchain
        run: scripts/install_cross_toolchain.sh ${{ matrix.target }} ${{ matrix.run && '--run' || '' }}

      - name: build
        run: scripts/cross.sh ${{ matrix.target }} build -p ${{ matrix.package }}

      - name: smoke
        if: ${{ matrix.run == 'smoke' }}
        run: scripts/cross.sh ${{ matrix.target }} run -p sail-cli -- --version

      # test_tls_split pushes 32 MiB each way within a 20 s deadline. Its
      # tests run one at a time here: side by side under qemu-user they
      # miss it on throughput alone, though each passes on its own.
      - name: test sail
        if: ${{ matrix.run == 'test' }}
        run: |
          scripts/cross.sh ${{ matrix.target }} test -p sail -- --skip test_tls_split_
          scripts/cross.sh ${{ matrix.target }} test -p sail --test test_tls_split -- --test-threads=1
