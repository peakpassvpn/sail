# Generates sail-ffi/src/command/proto.rs from sail-ffi/proto/command.proto.
# Outside the workspace, so the code generators are never built with sail:
#   cargo run --manifest-path tools/command-proto/Cargo.toml
[package]
name = "command-proto"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
tonic-prost-build = { version = "=0.14.6", default-features = false, features = ["transport"] }
protoc-bin-vendored = "3.2"
