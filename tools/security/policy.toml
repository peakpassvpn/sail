schema = 1
lockfile = "Cargo.lock"
manifests = [
  "Cargo.toml",
  "sail/Cargo.toml",
  "sail-cli/Cargo.toml",
  "sail-ffi/Cargo.toml",
  "sail-netstack/Cargo.toml",
  "sail-plugins/shadowsocks/Cargo.toml",
]

# Git dependencies are an explicit, exact allowlist. A repository added here
# still has to use this full 40-character revision in both its manifest and
# Cargo.lock; branches, tags, abbreviated revisions, and floating HEADs fail.
[[git]]
url = "https://github.com/peakpassvpn/btls.git"
rev = "3eb203a7ed44fd93d31056156a1ddfab5a6b9338"

[[git]]
url = "https://github.com/peakpassvpn/quinn.git"
rev = "29761c5b2d16f3508dcd3f5b525a2dd052810bb0"

[[git]]
url = "https://github.com/peakpassvpn/quinn-btls.git"
rev = "c951a76455cd3b1849296ef20469e93338dbe885"

# tun-rs reaches these two on every target; upstream still requires
# netlink-packet-core 0.8, which depends on the unmaintained paste
# (RUSTSEC-2024-0436). The forks' only change is netlink-packet-core 0.9
# and netlink-packet-route 0.33. Drop each [patch.crates-io] entry, and
# its line here, once the upstream crate (tun-rs/netconfig-rs,
# tun-rs/route_manager) releases on netlink-packet-core 0.9 or later and
# tun-rs takes that release.
[[git]]
url = "https://github.com/peakpassvpn/netconfig-rs.git"
rev = "a5caf848a0e0f18bc9810c1fa854f3ac6a903443"

[[git]]
url = "https://github.com/peakpassvpn/route_manager.git"
rev = "5703367f56a7b4fed9fd02e216f2f110b4186eda"
