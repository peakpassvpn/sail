# cargo-about's licences for THIRD_PARTY_LICENSES.md, which every release
# archive carries (scripts/release/notices.sh). `accepted` is
# tools/security/deny.toml's `allow`, and the two crates below are its
# `exceptions`: tools/licences/check.py keeps them the same.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
ignore-dev-dependencies = true
no-clearly-defined = true

[webpki-root-certs]
accepted = ["CDLA-Permissive-2.0"]

[tun]
accepted = ["WTFPL"]
