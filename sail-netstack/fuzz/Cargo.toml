[package]
name = "sail-netstack-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sail-netstack = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "wire_parse"
path = "fuzz_targets/wire_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fragment_reassembly"
path = "fuzz_targets/fragment_reassembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_state"
path = "fuzz_targets/tcp_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_table"
path = "fuzz_targets/tcp_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sack_scoreboard"
path = "fuzz_targets/sack_scoreboard.rs"
test = false
doc = false
bench = false

# Keep the fuzz harness independent from Sail's workspace and release graph.
[workspace]

# The workspace's, kept identical by tools/fuzz-check.sh.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
# One revision for both; FORK.md there says what each carries.
quinn = { git = "https://github.com/peakpassvpn/quinn.git", rev = "f814623b47c3435cf71b7570780c1dcf136a9b5c" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "f814623b47c3435cf71b7570780c1dcf136a9b5c" }
# tun-rs's netlink graph without paste (RUSTSEC-2024-0436), on one
# netlink-sys (0.9); see tools/security/policy.toml for when these go.
netconfig-rs = { git = "https://github.com/peakpassvpn/netconfig-rs.git", rev = "c4186a6416cce1b66ca65200b7a23b5e859181d7" }
route_manager = { git = "https://github.com/tun-rs/route_manager.git", rev = "d0a6c5e3fbea1b4fba74bd2ad9739bc670936aaf" }
