[package]
name = "sail-netstack-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sail-netstack = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "wire_parse"
path = "fuzz_targets/wire_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fragment_reassembly"
path = "fuzz_targets/fragment_reassembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_state"
path = "fuzz_targets/tcp_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_table"
path = "fuzz_targets/tcp_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sack_scoreboard"
path = "fuzz_targets/sack_scoreboard.rs"
test = false
doc = false
bench = false

# Keep the fuzz harness independent from Sail's workspace and release graph.
[workspace]

# The workspace's, kept identical by tools/fuzz-check.sh.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "132da2caff5d94c0f9ea52aa82bbc170bf2baaa6" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "132da2caff5d94c0f9ea52aa82bbc170bf2baaa6" }
# One revision for both; FORK.md there says what each carries.
quinn = { git = "https://github.com/peakpassvpn/quinn.git", rev = "0007e82aa0a4e7b47b6c1ecdc932aa65ed65cf17" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "0007e82aa0a4e7b47b6c1ecdc932aa65ed65cf17" }
