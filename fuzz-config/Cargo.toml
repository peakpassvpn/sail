# Isolated cargo-fuzz workspace for public configuration parsers.
[package]
name = "sail-config-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sail = { path = "../sail", default-features = false, features = ["fuzzing"] }

[workspace]

# The workspace's own, which tools/fuzz-check.sh keeps equal.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "447310e4d6c2d1e33d869558d8c6a1a1b27b2433" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "447310e4d6c2d1e33d869558d8c6a1a1b27b2433" }
# One revision for both; FORK.md there says what each carries.
quinn = { git = "https://github.com/peakpassvpn/quinn.git", rev = "b19aa3ec659ff90d068deb14fafa594136fd86e8" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "b19aa3ec659ff90d068deb14fafa594136fd86e8" }

[[bin]]
name = "config_json"
path = "fuzz_targets/config_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_auto"
path = "fuzz_targets/config_auto.rs"
test = false
doc = false
bench = false

[[bin]]
name = "subscription"
path = "fuzz_targets/subscription.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_set_source"
path = "fuzz_targets/rule_set_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_set_binary"
path = "fuzz_targets/rule_set_binary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_set_mrs"
path = "fuzz_targets/rule_set_mrs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_message"
path = "fuzz_targets/dns_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sniff"
path = "fuzz_targets/sniff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_inbound"
path = "fuzz_targets/protocol_inbound.rs"
test = false
