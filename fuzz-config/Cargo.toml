# Isolated cargo-fuzz workspace for public configuration parsers.
[package]
name = "sail-config-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sail = { path = "../sail", default-features = false, features = ["fuzzing"] }

[workspace]

# The workspace's own, which tools/fuzz-check.sh keeps equal.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
# One revision for both; FORK.md there says what each carries.
quinn = { git = "https://github.com/peakpassvpn/quinn.git", rev = "f814623b47c3435cf71b7570780c1dcf136a9b5c" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "f814623b47c3435cf71b7570780c1dcf136a9b5c" }

[[bin]]
name = "config_json"
path = "fuzz_targets/config_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_auto"
path = "fuzz_targets/config_auto.rs"
test = false
doc = false
bench = false

[[bin]]
name = "subscription"
path = "fuzz_targets/subscription.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_set_source"
path = "fuzz_targets/rule_set_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_set_binary"
path = "fuzz_targets/rule_set_binary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_set_mrs"
path = "fuzz_targets/rule_set_mrs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_message"
path = "fuzz_targets/dns_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sniff"
path = "fuzz_targets/sniff.rs"
test = false
doc = false
bench = false

[[bin]]
