# Isolated cargo-fuzz workspace for public configuration parsers.
[package]
name = "sail-config-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sail = { path = "../sail", default-features = false, features = ["fuzzing"] }

[workspace]

# The workspace's own, which tools/fuzz-check.sh keeps equal.
[patch.crates-io]
btls = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
btls-sys = { git = "https://github.com/peakpassvpn/btls.git", rev = "c0fb9dd9f610d0f76ae2b5afb30d65dce9b5e74c" }
quinn-proto = { git = "https://github.com/peakpassvpn/quinn.git", rev = "ac0737da7704788407daab3c5e6abd3dca7ae55e" }
# tun-rs's netlink graph without paste (RUSTSEC-2024-0436); see
# tools/security/policy.toml for when these go.
netconfig-rs = { git = "https://github.com/peakpassvpn/netconfig-rs.git", rev = "a5caf848a0e0f18bc9810c1fa854f3ac6a903443" }
route_manager = { git = "https://github.com/peakpassvpn/route_manager.git", rev = "5703367f56a7b4fed9fd02e216f2f110b4186eda" }

[[bin]]
name = "config_json"
path = "fuzz_targets/config_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_auto"
path = "fuzz_targets/config_auto.rs"
test = false
doc = false
bench = false

[[bin]]
name = "subscription"
path = "fuzz_targets/subscription.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_set_source"
path = "fuzz_targets/rule_set_source.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_set_binary"
path = "fuzz_targets/rule_set_binary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rule_set_mrs"
path = "fuzz_targets/rule_set_mrs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_message"
path = "fuzz_targets/dns_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sniff"
path = "fuzz_targets/sniff.rs"
test = false
