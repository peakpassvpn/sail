socks-port: 7891
allow-lan: false
mode: Rule
log-level: info
tun:
  enable: false
  stack: system
  auto-route: true
  auto-detect-interface: true
dns:
  enabled: true
  nameserver:
    - 192.0.2.1
  fallback:
    - tls://192.0.2.2:853
    - https://192.0.2.3/dns-query
    - https://h1.example.com/dns-query
proxies:
  - {name: Proxy 1, server: 192.0.2.4, port: 443, type: trojan, password: password1, sni: sni1.example.org}
proxy-providers:
  provider-1:
    type: http
    url: https://h2.example.com/p1.yaml
    interval: 800
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 600
      lazy: true
      url: http://h3.example.com/generate_204
  provider-2:
    type: file
    path: ./path-2.yml
    health-check:
      enable: true
      interval: 300
      url: http://h3.example.com/generate_204
  provider-3:
    type: file
    path: ./path-3.yml
    health-check:
      enable: true
      interval: 300
      url: http://h3.example.com/generate_204
proxy-groups:
  - name: Group 1
    type: load-balance
    use:
      - provider-3
    url: http://h3.example.com/generate_204
    interval: 50
    strategy: round-robin
  - name: Group 2
    type: url-test
    proxies:
      - Proxy 1
    url: http://h3.example.com/generate_204
    interval: 90
  - name: Group 3
    type: load-balance
    use:
      - provider-3
      - provider-2
    url: http://h3.example.com/generate_204
    interval: 50
    strategy: round-robin
  - name: Group 4
    type: fallback
    proxies:
      - DIRECT
      - Group 3
    url: http://h3.example.com/generate_204
    interval: 210
rules:
  - DOMAIN,d2.example,REJECT
  - PROCESS-NAME,app1.exe,Group 4
  - DOMAIN-SUFFIX,d3.example,DIRECT
  - DOMAIN-SUFFIX,d4.example,DIRECT
  - DOMAIN-SUFFIX,d5.example,DIRECT
  - DOMAIN-SUFFIX,d6.example,DIRECT
  - DOMAIN-SUFFIX,d7.example,Group 3
  - DOMAIN-SUFFIX,d8.example,Group 3
  - DOMAIN-KEYWORD,kw1,Group 3
