anchor-1: &a1 {type: http, interval: 28800, health-check: {enable: true, url: 'http://h1.example.com/p1', interval: 300}}
proxy-providers:
  provider-1: {<<: *a1, url: 'str1', override: {additional-prefix: 'str2'}}
  provider-2: {<<: *a1, url: 'str3', override: {additional-prefix: 'str4'}}
anchor-2: &a9 {type: url-test, interval: 200, lazy: true, url: 'http://h1.example.com/p1'}
anchor-3: &a10 {type: url-test, interval: 200, lazy: true, empty-fallback: REJECT, url: 'http://h1.example.com/p1', hidden: true, uselightgbm: true}
anchor-4: &a2 {type: select, proxies: [Group 2, Group 9]}
anchor-5: &a4 {type: select, proxies: [Group 1, Group 9]}
anchor-6: &a6 {type: select, proxies: [Group 9, Group 1]}
anchor-7: &a5 {type: select, proxies: [Group 1]}
anchor-8: &a11 'str6'
anchor-9: &a12 'str7'
anchor-10: &a13 'str8'
anchor-11: &a14 'str9'
anchor-12: &a15 'str10'
anchor-13: &a16 'str11'
anchor-14: &a3 'Proxy [0-9]+|Group 1'
mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
allow-lan: false
unified-delay: true
tcp-concurrent: true
log-level: warning
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600
experimental:
  quic-go-disable-gso: true
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "str5"
    - "+.d1.example"
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
    - 192.0.2.3
  nameserver:
    - https://h2.example.com/dns-query
    - https://h3.example.com/dns-query
  fake-ip-filter:
    - rule-set:set-1
    - rule-set:set-2
    - rule-set:set-21
    - +.d2.example
    - +.d3.example
    - +.d4.example
    - +.d1.example
proxy-groups:
  - {name: Group 1, <<: *a2, icon: https://h4.example.com/p2.png}
  - {name: Group 2, type: select, include-all: true, filter: *a3, icon: https://h4.example.com/p3.png}
  - {name: Group 3, <<: *a4, icon: https://h4.example.com/p4.png}
  - {name: Group 4, <<: *a4, icon: https://h4.example.com/p5.png}
  - {name: Group 5, <<: *a5, icon: https://h4.example.com/p6.png, include-all: true}
  - {name: Group 6, <<: *a4, icon: https://h4.example.com/p7.png}
  - {name: Group 7, <<: *a6, icon: https://h4.example.com/p8.png}
  - {name: Group 8, <<: *a4, icon: https://h4.example.com/p9.png}
  - {name: Group 9, type: select, proxies: [DIRECT], hidden: true, icon: https://h4.example.com/p10.png}
rules:
  - DOMAIN-KEYWORD,kw1,DIRECT
  - OR,((RULE-SET,set-33),(RULE-SET,set-35,no-resolve)),REJECT
  - OR,((AND,((NETWORK,TCP),(DST-PORT,5349))),(AND,((NETWORK,UDP),(DST-PORT,5350))),(AND,((NETWORK,UDP),(DST-PORT,5351))),(AND,((NETWORK,UDP),(DST-PORT,19302))),(RULE-SET,set-34),(DST-PORT,3478)),REJECT
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOIP,CN,no-resolve)))),REJECT
  - RULE-SET,set-2,Group 9
  - RULE-SET,set-1,Group 9
  - RULE-SET,set-12,Group 9
  - RULE-SET,set-15,Group 9
  - RULE-SET,set-4,Group 9
  - RULE-SET,set-6,Group 3
  - DOMAIN-KEYWORD,kw2,Group 5
  - RULE-SET,set-5,Group 5
  - RULE-SET,set-7,Group 4
  - RULE-SET,set-8,Group 6
  - RULE-SET,set-9,Group 6
  - RULE-SET,set-10,Group 6
  - RULE-SET,set-11,Group 6
  - RULE-SET,set-13,Group 6
  - RULE-SET,set-14,Group 6
  - RULE-SET,set-16,Group 9
  - RULE-SET,set-17,Group 6
  - RULE-SET,set-18,Group 6
  - RULE-SET,set-19,Group 6
  - RULE-SET,set-20,Group 6
  - RULE-SET,set-21,Group 9
  - RULE-SET,set-22,Group 9,no-resolve
  - RULE-SET,set-26,Group 9,no-resolve
  - RULE-SET,set-23,Group 3,no-resolve
  - RULE-SET,set-24,Group 4,no-resolve
  - RULE-SET,set-25,Group 6,no-resolve
  - RULE-SET,set-27,Group 6,no-resolve
  - RULE-SET,set-28,Group 6,no-resolve
  - RULE-SET,set-29,Group 6,no-resolve
  - RULE-SET,set-30,Group 6,no-resolve
  - RULE-SET,set-31,Group 6,no-resolve
  - RULE-SET,set-32,Group 9,no-resolve
  - MATCH,Group 8
