port: 8080
sock5-port: 8081
mixed-port: 7890
allow-lan: true
mode: rule
log-level: silent
external-controller: 127.0.0.1:9090
proxy-providers:
  provider-1:
    type: http
    path: "./path-1.yaml"
    url: https://h1.example.com/p1?token=v1
    interval: 3600
    health-check:
      enable: true
      url: http://h2.example.com/generate_204
      interval: 600
  provider-2:
    type: http
    path: "./path-2.yaml"
    url: https://h3.example.com/p2
    interval: 3600
    health-check:
      enable: true
      url: http://h2.example.com/generate_204
      interval: 600
proxy-groups:
  - name: PROXY
    type: select
    disable-udp: false
    proxies:
      - Group 1
      - Group 2
      - Group 12
      - Group 13
      - Group 14
      - Group 15
      - Group 16
      - DIRECT
    use:
      - provider-1
      - provider-2
  - name: Group 1
    type: url-test
    disable-udp: false
    use:
      - provider-1
    url: http://h2.example.com/generate_204
    interval: 600
    tolerance: 150
  - name: Group 2
    type: url-test
    use:
