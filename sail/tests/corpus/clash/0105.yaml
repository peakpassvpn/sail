mixed-port: 7890
socks-port: 7891
port: 7892
allow-lan: false
mode: rule
log-level: info
ipv6: false
enable-process: true
find-process-mode: strict
tcp-concurrent: false
disable-keep-alive: true
unified-delay: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  listen: :1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.d1.example
    - +.d2.example
    - +.localhost
    - +.d3.example
    - str1
    - str2
    - "*.d4.example"
    - "*.d5.example"
    - "*.d6.example"
    - "*.d7.example"
    - d8.example
    - d9.example
    - d10.example
    - d11.example
    - d12.*.example
    - d13.*.example
  default-nameserver:
    - https://192.0.2.1/dns-query
  direct-nameserver:
    - system
  proxy-server-nameserver:
    - quic://h1.example.com
    - system
  nameserver:
    - https://h2.example.com/dns-query
    - https://h3.example.com/dns-query
    - https://h4.example.com/dns-query
  direct-nameserver-follow-policy: false
  prefer-h3: false
  respect-rules: false
  use-hosts: true
  use-system-hosts: true
  fallback: []
  fallback-filter:
    geoip: false
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 192.0.2.0/24
    domain: []
tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  device: if1
proxy-providers:
  provider-1:
    type: http
    url: https://h5.example.com/p1.yaml
    interval: 14400
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://h6.example.com/generate_204
      timeout: 10000
    override:
      udp: true
  provider-2:
    type: http
    url: https://h5.example.com/p2
    interval: 14400
    path: ./path-2.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://h6.example.com/generate_204
      timeout: 10000
    exclude-type: str3
    override:
      udp: true
  provider-3:
    type: http
    url: https://h5.example.com/p3.yml
    interval: 14400
    path: ./path-3.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://h6.example.com/generate_204
      timeout: 10000
    exclude-type: str3
    override:
      udp: true
  provider-4:
    type: http
    url: https://h5.example.com/p4.yaml
    interval: 14400
    path: ./path-4.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://h6.example.com/generate_204
      timeout: 10000
    exclude-type: str3
    override:
      udp: true
  provider-5:
    type: http
    url: https://h5.example.com/p5.yaml
    interval: 14400
    path: ./path-5.yaml
    health-check:
      enable: true
      interval: 1800
      url: https://h6.example.com/generate_204
      timeout: 10000
    exclude-type: str3
    override:
      udp: true
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Group 2
    use:
      - provider-1
      - provider-2
      - provider-3
      - provider-4
      - provider-5
  - name: Group 2
    type: url-test
    url: https://h6.example.com/generate_204
    interval: 300
    tolerance: 0
    use:
      - provider-1
      - provider-2
      - provider-3
      - provider-4
      - provider-5
rule-providers:
  set-1:
    type: http
    behavior: domain
    format: mrs
    url: https://h5.example.com/p6.mrs
    path: ./path-6.mrs
    interval: 86400
  set-2:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://h5.example.com/p7.mrs
    path: ./path-7.mrs
    interval: 86400
  set-3:
    type: http
    behavior: domain
    format: mrs
    url: https://h5.example.com/p8.mrs
    path: ./path-8.mrs
    interval: 86400
  set-4:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://h5.example.com/p9.mrs
    path: ./path-9.mrs
    interval: 86400
  set-5:
    type: http
    behavior: domain
    format: mrs
    url: https://h5.example.com/p10.mrs
    path: ./path-10.mrs
    interval: 86400
  set-6:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://h5.example.com/p11.mrs
    path: ./path-11.mrs
    interval: 86400
  set-7:
    type: http
    behavior: domain
    format: mrs
    url: https://h5.example.com/p12.mrs
    path: ./path-12.mrs
    interval: 86400
rules:
  - IP-CIDR,127.0.0.1/32,DIRECT,no-resolve
  - IP-CIDR,198.18.0.1/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - DOMAIN-SUFFIX,d1.example,DIRECT
  - DOMAIN-SUFFIX,d2.example,DIRECT
  - DOMAIN-SUFFIX,d3.example,DIRECT
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,d14.example,DIRECT
  - DOMAIN-SUFFIX,d15.example,DIRECT
  - DOMAIN-SUFFIX,d16.example,REJECT
  - DOMAIN-SUFFIX,d17.example,REJECT
  - DOMAIN-SUFFIX,d18.example,REJECT
  - DOMAIN-SUFFIX,d19.example,REJECT
  - DOMAIN-SUFFIX,d20.example,REJECT
  - DOMAIN-SUFFIX,d21.example,REJECT
  - RULE-SET,set-7,Group 1
  - RULE-SET,set-1,REJECT
  - RULE-SET,set-2,REJECT,no-resolve
  - DOMAIN-SUFFIX,d22.example,DIRECT
  - RULE-SET,set-5,DIRECT
  - RULE-SET,set-3,Group 1
  - RULE-SET,set-6,DIRECT,no-resolve
  - RULE-SET,set-4,Group 1,no-resolve
  - MATCH,Group 1
geo-auto-update: false
geo-update-interval: 90
geodata-mode: false
geox-url:
  geoip: https://h7.example.com/p13.dat
  geosite: https://h7.example.com/p14.dat
  mmdb: https://h7.example.com/p15.metadb
  asn: https://h7.example.com/p16.mmdb
