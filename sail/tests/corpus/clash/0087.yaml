secret: ""
sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    QUIC: {ports: [443, 8443]}
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880]}
  skip-domain:
    - "str2"
    - "+.d1.example"
geox-url:
  mmdb: "https://h6.example.com/p76.mmdb"
ntp:
  enable: true
  write-to-system: true
tun:
  enable: true
  stack: mixed
  dns-hijack: [udp://any:53, tcp://any:53]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: false
  endpoint-independent-nat: true
  route-exclude-address-set: [str3]
dns:
  enable: true
  cache-algorithm: arc
  respect-rules: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
  proxy-server-nameserver:
    - https://h2.example.com/dns-query
    - https://h3.example.com/dns-query
  direct-nameserver:
    - https://h2.example.com/dns-query
    - https://h3.example.com/dns-query
  nameserver:
    - 192.0.2.3#Group 20
    - 192.0.2.4#Group 20
  nameserver-policy:
    rule-set:set-1: [https://h2.example.com/dns-query, https://h3.example.com/dns-query]
    rule-set:set-4: [https://h2.example.com/dns-query, https://h3.example.com/dns-query]
    rule-set:set-46: [https://h2.example.com/dns-query, https://h3.example.com/dns-query]
  direct-nameserver-follow-policy: true
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - rule-set:set-1
    - rule-set:set-2
    - rule-set:set-4
    - rule-set:set-46
