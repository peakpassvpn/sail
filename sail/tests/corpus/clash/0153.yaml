mixed-port: 8118
allow-lan: false
find-process-mode: strict
mode: rule
geox-url:
  geosite: https://h6.example.com/p1.dat
  mmdb: https://h6.example.com/p2.metadb
geo-auto-update: true
geo-update-interval: 24
geosite-matcher: str1
geodata-mode: false
geodata-loader: memconservative
global-ua: str2
etag-support: true
log-level: warning
ipv6: true
external-controller: 127.0.0.1:9090
tcp-concurrent: true
external-ui: ./path-2
external-ui-url: https://h7.example.com/p3.zip
disable-keep-alive: false
keep-alive-idle: 90
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: true
unified-delay: true
tun:
  enable: true
  stack: mips
  dns-hijack:
    - udp://any:53
    - tcp://any:53
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  mtu: 9000
  strict-route: true
  disable-icmp-forwarding: false
  endpoint-independent-nat: false
  device: if1
  udp-timeout: 60
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: false
  override-destination: false
  sniff:
    QUIC:
      ports:
        - 443
        - 8443
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
hosts:
  d1.example:
    - 192.0.2.1
    - 192.0.2.2
    - 2001:db8::1
    - 2001:db8::2
  d2.example:
    - 192.0.2.3
    - 192.0.2.4
  d3.example:
    - 192.0.2.5
    - 192.0.2.6
dns:
  cache-algorithm: arc
  enable: true
  prefer-h3: false
  use-hosts: true
  use-system-hosts: false
  listen: 0.0.0.0:1053
  ipv6: true
  ipv6-timeout: 200
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: 3f00::/18
  fake-ip-filter:
    - geosite:private
    - geosite:category-ntp
    - geosite:category-stun
    - geosite:category-voip
  fake-ip-filter-mode: blacklist
  respect-rules: false
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.7
  proxy-server-nameserver:
    - https://h1.example.com/dns-query#DIRECT&h3=true
    - https://h2.example.com/dns-query#DIRECT
  direct-nameserver:
    - https://h1.example.com/dns-query#DIRECT&h3=true
    - https://h2.example.com/dns-query#DIRECT
  direct-nameserver-follow-policy: true
  nameserver:
    - https://h3.example.com#Group 1&h3=true&ecs=192.0.2.0/24
  nameserver-policy:
    geosite:category-ads-all: rcode://success
proxy-groups:
  - name: Group 1
    type: select
    use:
      - provider-1
    hidden: false
  - name: Group 2
    type: select
    use:
      - provider-1
    hidden: false
  - name: Group 3
    type: select
    use:
      - provider-1
    hidden: false
  - name: Group 4
    type: select
    use:
      - provider-1
    hidden: false
  - name: Group 5
    type: select
    use:
      - provider-1
    hidden: false
  - name: Group 6
    type: select
    use:
      - provider-1
    hidden: false
  - name: Group 7
    type: select
    proxies:
      - DIRECT
      - Group 1
    use:
      - provider-1
    hidden: false
  - name: Group 8
    type: select
    proxies:
      - DIRECT
      - Group 1
    use:
      - provider-1
    hidden: false
proxy-providers:
  provider-1:
    type: http
    url: https://h4.example.com
    interval: 0
    path: ./path-1.yaml
    proxy: DIRECT
    health-check:
      enable: true
      interval: 3600
      timeout: 5000
      lazy: true
      url: https://h5.example.com/
    override:
      udp: true
      tfo: true
      mptcp: true
rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,category-ads-all,REJECT
  - AND,((DST-PORT,443),(NETWORK,UDP),(GEOSITE,geolocation-!cn)),REJECT
  - GEOSITE,google,Group 2
  - GEOSITE,category-ai-!cn,Group 3
  - SUB-RULE,sub-2,Proxy 1
  - SUB-RULE,sub-3,Proxy 1
  - GEOSITE,apple,Group 7
  - GEOSITE,geolocation-!cn@cn,DIRECT
  - GEOSITE,geolocation-!cn,Group 1
  - GEOSITE,bilibili,Group 8
  - GEOSITE,cn,DIRECT
  - GEOIP,cn,DIRECT
  - AND,((DST-PORT,443),(NETWORK,UDP)),REJECT
  - MATCH,Group 1
sub-rules:
  sub-1:
    - GEOIP,nl,Group 5
    - GEOIP,us,Group 6
    - MATCH,Group 4
