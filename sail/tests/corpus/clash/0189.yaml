port: 7890
socks-port: 7891
mixed-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
experimental:
  ignore-resolve-fail: true
cfw-latency-timeout: 3000
cfw-latency-url: http://h5.example.com/generate_204
cfw-conn-break-strategy: true
clash-for-android:
  ui-subtitle-pattern: 'str1'
url-rewrite:
  - str2
  - str3
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  enhanced-mode: redir-host
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.d1.example'
    - d2.example
  nameserver:
    - 192.0.2.1
    - 192.0.2.2
    - https://h1.example.com/dns-query
    - https://h2.example.com/dns-query
  fallback:
    - 192.0.2.3
    - 192.0.2.4
    - tls://192.0.2.5:853
    - tls://h3.example.com:853
    - https://h4.example.com/dns-query
    - https://h3.example.com/dns-query
  fallback-filter:
    geoip: true
    ipcidr:
      - 240.0.0.0/4
rules:
  - RULE-SET,set-1,Proxy 1
  - RULE-SET,set-2,Proxy 1
  - RULE-SET,set-3,Proxy 1
  - RULE-SET,set-4,Proxy 1
  - RULE-SET,set-5,Proxy 1
  - RULE-SET,set-6,Proxy 1
  - RULE-SET,set-7,Proxy 1
