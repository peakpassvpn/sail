mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
hosts:
  d1.example: 192.0.2.1
  d2.example: 192.0.2.2
  d3.example: 192.0.2.2
profile:
  store-selected: false
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  use-hosts: true
  default-nameserver:
    - 192.0.2.3
    - 192.0.2.4
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.d4.example'
    - d5.example
    - '+.d6.example'
    - '+.d7.example'
    - '+.d8.example'
    - '+.d9.example'
    - '+.d10.example'
    - 'd8.example'
    - 'd11.*.example'
    - '*.d12.example'
    - '*.d13.example'
    - '*.d14.example'
    - '*.d15.example'
    - '*.d16.example'
    - '*.d17.example'
    - '*.d18.example'
  nameserver:
    - 'https://h1.example.com/dns-query'
    - 'https://192.0.2.3/dns-query'
  fallback:
    - 'https://h2.example.com/dns-query'
    - 'https://192.0.2.5/dns-query'
    - 'tls://192.0.2.6:853'
  fallback-filter:
    geoip: true
    geoip-code: CN
proxies:
proxy-providers:
  provider-1:
    type: http
    url: str1
    interval: 86400
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 1800
      url: http://h3.example.com/generate_204
  provider-2:
    filter: Proxy [0-9]+|Group 1
    type: file
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 600
      url: http://h3.example.com/generate_204
  provider-3:
    filter: Proxy [0-9]+|Group 2
    type: file
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 600
      url: http://h3.example.com/generate_204
  provider-4:
    filter: Proxy [0-9]+|Group 3
    type: file
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 600
      url: http://h3.example.com/generate_204
  provider-5:
    filter: Proxy [0-9]+|Group 4
    type: file
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 600
      url: http://h3.example.com/generate_204
  provider-6:
    filter: Proxy [0-9]+|Group 5
    type: file
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 600
      url: http://h3.example.com/generate_204
proxy-groups:
  - name: "Group 1"
    type: url-test
    use:
      - provider-1
    url: 'http://h3.example.com/generate_204'
    interval: 300
  - name: "Group 2"
    type: url-test
    use:
      - provider-2
    url: http://h3.example.com/generate_204
    interval: 900
  - name: "Group 3"
    type: url-test
    use:
      - provider-3
    url: http://h3.example.com/generate_204
    interval: 900
  - name: "Group 4"
    type: url-test
    use:
      - provider-5
    url: http://h3.example.com/generate_204
    interval: 900
  - name: "Group 5"
    type: url-test
    use:
      - provider-6
    url: http://h3.example.com/generate_204
    interval: 900
  - name: "Group 6"
    type: url-test
    use:
      - provider-4
    url: http://h3.example.com/generate_204
    interval: 900
  - name: "Group 7"
    type: select
    proxies:
      - Group 1
      - Group 2
      - Group 5
      - Group 12
      - Group 3
      - Group 4
  - name: "Group 8"
    type: select
    proxies:
      - Group 4
      - Group 5
      - Group 3
      - Group 2
      - Group 1
  - name: "Group 9"
    type: select
    proxies:
      - Group 12
      - Group 1
      - Group 2
      - Group 5
  - name: "Group 10"
    type: select
    proxies:
      - Group 1
      - Group 2
      - Group 5
      - Group 12
  - name: "Group 11"
    type: select
    proxies:
      - Group 12
      - Group 1
      - Group 3
      - Group 2
  - name: Group 12
    type: select
    proxies:
      - DIRECT
  - name: Group 13
    type: select
    proxies:
      - REJECT
      - DIRECT
