tun:
  enable: false
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
  mtu: 9000
  strict_route: true
  inet4_route_address:
    - 0.0.0.0/1
    - 128.0.0.0/1
  inet6_route_address:
    - '::/1'
    - '8000::/1'
  endpoint_independent_nat: true
proxy-providers:
  provider-1:
    type: http
    path: ./path-1.yaml
    url: https://h28.example.com/p1?target=clash&url=v1
    interval: 3600
    health-check:
      enable: true
      url: http://h29.example.com/generate_204
      interval: 600
  provider-2:
    type: http
    path: ./path-2.yaml
    url: https://h28.example.com/p1?target=clash&url=v2&insert=false&config=v3&list=true&new_name=true&upload=false&udp=true
    interval: 3600
    health-check:
      enable: true
      url: http://h29.example.com/generate_204
      interval: 600
proxy-groups:
  - name: Group 1
    type: select
    use:
      - provider-1
      - provider-2
    proxies:
      - Group 2
      - DIRECT
  - name: Group 2
    type: fallback
    use:
      - provider-1
      - provider-2
    url: http://h29.example.com/generate_204
    interval: 600
  - name: Group 3
    type: select
    use:
      - provider-1
      - provider-2
    proxies:
      - DIRECT
      - Group 1
      - Group 2
rule-providers:
  set-1:
    type: http
    behavior: classical
    path: ./path-3.list
    url: https://h30.example.com/p2.list
    interval: 3600
  set-2:
    type: http
    behavior: classical
    path: ./path-4.list
    url: https://h30.example.com/p3.list
    interval: 3600
  set-3:
    type: http
    behavior: classical
    path: ./path-5.list
    url: https://h30.example.com/p4.list
    interval: 3600
rules:
  - RULE-SET,set-1,DIRECT
  - RULE-SET,set-3,DIRECT
  - RULE-SET,set-2,Group 1
  - GEOSITE,geolocation-!cn,Group 1
  - GEOIP,CN,Group 3
  - MATCH,Group 1
