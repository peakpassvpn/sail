proxy-providers:
  provider-1:
    url: "str1"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://h1.example.com/generate_204
      interval: 300
    proxy: Proxy 1
proxies:
  - {name: Proxy 1, type: direct}
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: off
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "str2"
    - "+.d1.example"
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://192.0.2.1/dns-query
  proxy-server-nameserver:
    - https://h2.example.com/dns-query
    - https://h3.example.com/dns-query
  direct-nameserver:
    - https://h2.example.com/dns-query
    - https://h3.example.com/dns-query
  nameserver:
    - https://192.0.2.2/dns-query#Proxy 2&ecs=192.0.2.0/24
  fake-ip-filter:
    - "rule-set:set-1"
proxy-groups:
  - {name: Group 1, type: select, proxies: [Group 17, Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, Group 24, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 2, type: select, proxies: [Group 20, Group 17, Group 18, Group 19, Group 24, Group 21, Group 22, Group 23, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 3, type: select, proxies: [Group 17, Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, Group 24, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 4, type: select, proxies: [Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, Group 24, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 5, type: select, proxies: [Group 17, Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, Group 24, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 6, type: select, proxies: [Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, Group 24, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 7, type: select, proxies: [Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, Group 24, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 8, type: select, proxies: [Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, Group 24, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 9, type: select, proxies: [Group 17, Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, Group 24, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 10, type: select, proxies: [Group 19, Group 17, Group 18, Group 20, Group 21, Group 22, Group 23, Group 24, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 11, type: select, proxies: [Group 18, Group 17, Group 19, Group 20, Group 21, Group 22, Group 23, Group 24, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 12, type: select, proxies: [Group 1, Group 17, Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, Group 24, Group 25, Group 13, Group 14, Group 15, Group 16, Group 26, Proxy 1]}
  - {name: Group 13, type: select, include-all: true, filter: "Proxy [0-9]+|Group 1"}
  - {name: Group 14, type: select, include-all: true, filter: "Proxy [0-9]+|Group 2"}
  - {name: Group 15, type: select, include-all: true, filter: "Proxy [0-9]+|Group 3"}
  - {name: Group 16, type: select, include-all: true, filter: "Proxy [0-9]+|Group 4"}
  - {name: Group 17, type: fallback, include-all: true, interval: 300, filter: "Proxy [0-9]+|Group 1"}
  - {name: Group 18, type: fallback, include-all: true, interval: 300, filter: "Proxy [0-9]+|Group 2"}
  - {name: Group 19, type: fallback, include-all: true, interval: 300, filter: "Proxy [0-9]+|Group 3"}
  - {name: Group 20, type: fallback, include-all: true, interval: 300, filter: "Proxy [0-9]+|Group 4"}
  - {name: Group 21, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "Proxy [0-9]+|Group 1"}
  - {name: Group 22, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "Proxy [0-9]+|Group 2"}
  - {name: Group 23, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "Proxy [0-9]+|Group 5"}
  - {name: Group 24, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "Proxy [0-9]+|Group 6"}
  - {name: Group 25, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "Proxy [0-9]+|Group 7"}
  - {name: Group 26, type: select, include-all: true}
rules:
  - RULE-SET,set-18,Proxy 1,no-resolve
  - RULE-SET,set-2,Proxy 1
  - DOMAIN-SUFFIX,d2.example,Group 1
  - RULE-SET,set-3,Group 1
  - RULE-SET,set-4,Group 4
  - RULE-SET,set-7,Group 5
  - RULE-SET,set-5,Group 2
  - RULE-SET,set-6,Group 3
  - RULE-SET,set-11,Group 6
  - RULE-SET,set-12,Group 7
  - RULE-SET,set-13,Proxy 1
  - RULE-SET,set-15,Group 8
  - RULE-SET,set-8,Group 9
  - RULE-SET,set-9,Group 10
  - RULE-SET,set-10,Group 11
  - RULE-SET,set-23,Proxy 1
  - RULE-SET,set-20,Group 3
  - RULE-SET,set-22,Group 10
  - RULE-SET,set-21,Group 9
  - RULE-SET,set-16,Group 1
  - RULE-SET,set-17,Proxy 1
  - RULE-SET,set-19,Proxy 1
  - MATCH,Group 12
anchor-1:
  ip: &a3 {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &a1 {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &a2 {type: http, interval: 86400, behavior: classical, format: text}
rule-providers:
  set-1: {<<: *a1, url: "https://h4.example.com/p1.mrs"}
