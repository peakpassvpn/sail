port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
proxies:
  - name: Proxy 1
    server: 192.0.2.1
    port: 443
    udp: true
    type: vless
    uuid: 00005a11-0000-4000-8000-000000000001
    tls: true
    servername: sni1.example.org
    skip-cert-verify: false
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /p1
      headers:
        Host: sni1.example.org
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Group 2
      - Proxy 1
  - name: Group 2
    type: url-test
    url: https://h1.example.com/generate_204
    interval: 300
    proxies:
      - Proxy 1
rules:
  - MATCH,Group 1
