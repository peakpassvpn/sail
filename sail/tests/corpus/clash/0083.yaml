mixed-port: 7897
socks-port: 7898
port: 7899
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false
find-process-mode: always
geox-url:
  geoip: https://h2.example.com/p16.dat
  geosite: https://h2.example.com/p17.dat
  mmdb: https://h2.example.com/p18.mmdb
geo-auto-update: true
geo-update-interval: 24
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:8888
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - geosite:private
    - +.d1.example
    - +.d2.example
    - +.d3.example
    - +.d4.example
    - d5.example
    - +.d6.example
    - +.d7.example
    - +.d8.example
    - d9.*.example
    - +.d10.example
    - +.d11.example
    - +.d12.example
    - +.d13.example
    - +.d14.example
    - +.d15.example
    - +.d16.example
    - +.d17.example
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
  nameserver-policy:
    "geosite:private":
      - https://192.0.2.1/dns-query
      - https://192.0.2.3/dns-query
    "geosite:cn":
      - https://192.0.2.1/dns-query
      - https://192.0.2.3/dns-query
    "geosite:gfw":
      - https://192.0.2.4/dns-query
      - https://192.0.2.5/dns-query
  nameserver:
    - https://192.0.2.1/dns-query
    - https://192.0.2.3/dns-query
  fallback:
    - https://192.0.2.4/dns-query
    - https://192.0.2.5/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  proxy-server-nameserver:
    - https://192.0.2.1/dns-query
    - https://192.0.2.3/dns-query
anchor-1: &a1 {type: http, interval: 86400, health-check: {enable: true, url: https://h1.example.com/generate_204, interval: 300}}
anchor-2: &a2 {type: select, use: [provider-1]}
anchor-3: &a4 {type: select, proxies: [Group 1, Group 2, Group 3, Group 14, Group 15, Group 16, Group 17, Group 18, Group 19, Group 20, DIRECT]}
anchor-4: &a3 {type: url-test, lazy: true, url: https://h1.example.com/generate_204, interval: 300, tolerance: 100, use: [provider-1]}
anchor-5: &a6 {type: http, behavior: domain, interval: 86400}
anchor-6: &a5 {type: http, behavior: classical, interval: 86400}
proxy-providers:
  provider-1:
    <<: *a1
    url: "str1"
    path: ./path-1.yaml
proxies: []
proxy-groups:
  - {name: Group 1, type: select, proxies: [Group 2, Group 3, Group 14, Group 15, Group 16, Group 17, Group 18, Group 19, Group 20, DIRECT]}
  - {name: Group 2, <<: *a2}
  - {name: Group 3, <<: *a3}
  - {name: Group 4, type: select, proxies: [REJECT, DIRECT]}
  - {name: Group 5, type: select, proxies: [Group 16, Group 17, Group 18, Group 19, Group 20]}
  - {name: Group 6, type: select, proxies: [DIRECT, Group 14, Group 15]}
  - {name: Group 7, <<: *a4}
  - {name: Group 8, <<: *a4}
  - {name: Group 9, <<: *a4}
  - {name: Group 10, <<: *a4}
  - {name: Group 11, <<: *a4}
  - {name: Group 12, <<: *a4}
  - {name: Group 13, <<: *a4}
  - {name: Group 14, <<: *a3, filter: "Proxy [0-9]+|Group 1", exclude-filter: "Proxy [0-9]+|Group 2"}
  - {name: Group 15, <<: *a3, filter: "Proxy [0-9]+|Group 3", exclude-filter: "Proxy [0-9]+|Group 4"}
  - {name: Group 16, <<: *a3, filter: "Proxy [0-9]+|Group 5", exclude-filter: "Proxy [0-9]+|Group 6"}
  - {name: Group 17, <<: *a3, filter: "Proxy [0-9]+|Group 7", exclude-filter: "Proxy [0-9]+|Group 8"}
  - {name: Group 18, <<: *a3, filter: "Proxy [0-9]+|Group 9", exclude-filter: "Proxy [0-9]+|Group 10"}
  - {name: Group 19, <<: *a3, filter: "Proxy [0-9]+|Group 11", exclude-filter: "Proxy [0-9]+|Group 12"}
  - {name: Group 20, <<: *a3, filter: "Proxy [0-9]+|Group 13", exclude-filter: "Proxy [0-9]+|Group 14"}
rule-providers:
  set-1: {<<: *a5, url: https://h2.example.com/p1.yaml, path: ./path-2.yaml}
  set-2: {<<: *a5, url: https://h2.example.com/p2.yaml, path: ./path-3.yaml}
  set-3: {<<: *a6, url: https://h2.example.com/p3.yaml, path: ./path-4.yaml}
  set-4: {<<: *a5, url: https://h2.example.com/p4.yaml, path: ./path-5.yaml}
  set-5: {<<: *a5, url: https://h2.example.com/p5.yaml, path: ./path-6.yaml}
  set-6: {<<: *a5, url: https://h2.example.com/p6.yaml, path: ./path-7.yaml}
  set-7: {<<: *a5, url: https://h2.example.com/p7.yaml, path: ./path-8.yaml}
  set-8: {<<: *a5, url: https://h2.example.com/p8.yaml, path: ./path-9.yaml}
  set-9: {<<: *a5, url: https://h2.example.com/p9.yaml, path: ./path-10.yaml}
  set-10: {<<: *a5, url: https://h2.example.com/p10.yaml, path: ./path-11.yaml}
  set-11: {<<: *a5, url: https://h2.example.com/p11.yaml, path: ./path-12.yaml}
  set-12: {<<: *a5, url: https://h2.example.com/p12.yaml, path: ./path-13.yaml}
  set-13: {<<: *a5, url: https://h2.example.com/p13.yaml, path: ./path-14.yaml}
  set-14: {<<: *a5, url: https://h2.example.com/p14.yaml, path: ./path-15.yaml}
  set-15: {<<: *a5, url: https://h2.example.com/p15.yaml, path: ./path-16.yaml}
rules:
  - PROCESS-NAME,app1.exe,DIRECT
  - PROCESS-NAME,app2.exe,DIRECT
  - PROCESS-NAME,app3.exe,DIRECT
  - PROCESS-NAME,app4.exe,DIRECT
  - DOMAIN-SUFFIX,d14.example,DIRECT
  - DOMAIN-SUFFIX,d15.example,DIRECT
  - DOMAIN-SUFFIX,d16.example,DIRECT
  - DOMAIN-SUFFIX,d17.example,DIRECT
  - RULE-SET,set-1,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  - RULE-SET,set-2,DIRECT
  - RULE-SET,set-3,Group 4
  - RULE-SET,set-4,Group 5
  - RULE-SET,set-9,Group 12
  - RULE-SET,set-10,Group 12
  - RULE-SET,set-5,Group 6
  - RULE-SET,set-6,Group 6
  - RULE-SET,set-7,Group 7
  - RULE-SET,set-8,Group 8
  - RULE-SET,set-11,Group 9
  - RULE-SET,set-12,Group 10
  - RULE-SET,set-13,Group 12
  - RULE-SET,set-14,Group 11
  - RULE-SET,set-15,Group 12
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Group 13
