  listen: 0.0.0.0:53
  ipv6: false
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://h1.example.com/dns-query
    - https://h2.example.com/dns-query
  fallback:
    - 192.0.2.1
    - 192.0.2.2
