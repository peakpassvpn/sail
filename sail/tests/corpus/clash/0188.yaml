proxies:
  - {name: Proxy 1, type: direct}
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.d1.example"
  skip-domain:
    - "+.d2.example"
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:set-1,set-35"
    - "+.d3.example"
    - "+.d4.example"
    - "d5.*.example"
    - "+.d6.example"
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
  proxy-server-nameserver:
    - https://h1.example.com/dns-query
    - https://h2.example.com/dns-query
  nameserver:
    - 192.0.2.3
    - 192.0.2.4
anchor-1:
  ip: &a3 {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &a1 {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &a2 {type: http, interval: 86400, behavior: classical, format: text}
