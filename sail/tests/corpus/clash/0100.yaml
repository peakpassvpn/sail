anchor-1: &a1 {type: http, interval: 604800, health-check: {enable: true, url: "https://h1.example.com/generate_204", interval: 0}, proxy: Proxy 1}
anchor-2: &a3 {type: select, proxies: [Group 1, Group 15, Group 16, Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, Group 17, Proxy 1, Proxy 2]}
anchor-3: &a2 {type: select, proxies: [Proxy 2, Proxy 1, Group 1]}
anchor-4: &a4 {type: select, proxies: [Proxy 1, Group 1]}
anchor-5: &a5 {type: url-test, include-all: true, tolerance: 50, interval: 300, lazy: true, empty-fallback: "str5", url: "https://h1.example.com/generate_204"}
proxy-providers:
  provider-1:
    <<: *a1
    url: "str1"
    override:
      additional-prefix: 'str2'
  provider-2:
    <<: *a1
    url: "str1"
    override:
      additional-prefix: 'str3'
proxies:
  - {name: Proxy 1, type: direct, udp: true}
  - {name: Proxy 2, type: reject, udp: true}
mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: true
allow-lan: true
bind-address: '*'
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600
experimental:
  quic-go-disable-gso: true
external-controller: 0.0.0.0:9090
external-ui: ./path-1
external-ui-name: str6
external-ui-url: https://h5.example.com/p36.zip
secret: "password1"
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "str4"
    - "+.d1.example"
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
    - 192.0.2.3
  nameserver:
    - https://h2.example.com/dns-query
    - https://h3.example.com/dns-query
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:set-18
    - +.d2.example
    - +.d3.example
    - +.d4.example
    - +.d1.example
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
proxy-groups:
  - {name: Group 1, type: select, proxies: [Group 15, Group 16, Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, Group 17, Proxy 1, Proxy 2], icon: https://h4.example.com/p1.png}
  - {name: Group 2, <<: *a2, icon: https://h4.example.com/p2.png}
  - {name: Group 3, <<: *a3, icon: https://h4.example.com/p3.png}
  - {name: Group 4, <<: *a3, icon: https://h4.example.com/p4.png}
  - {name: Group 5, <<: *a3, icon: https://h4.example.com/p5.png}
  - {name: Group 6, <<: *a3, icon: https://h4.example.com/p6.png}
  - {name: Group 7, <<: *a3, icon: https://h4.example.com/p7.png}
  - {name: Group 8, <<: *a3, icon: https://h4.example.com/p8.png}
  - {name: Group 9, <<: *a3, icon: https://h4.example.com/p9.png}
  - {name: Group 10, <<: *a3, icon: https://h4.example.com/p10.png}
  - {name: Group 11, <<: *a3, icon: https://h4.example.com/p11.png}
  - {name: Group 12, <<: *a3, icon: https://h4.example.com/p12.png}
  - {name: Group 13, <<: *a3, icon: https://h4.example.com/p13.png}
  - {name: Group 14, <<: *a4, icon: https://h4.example.com/p14.png}
  - {name: Group 15, type: select, include-all: true, filter: "Proxy [0-9]+|Group 1", icon: https://h4.example.com/p15.png}
  - {name: Group 16, <<: *a5, filter: "Proxy [0-9]+|Group 2", icon: https://h4.example.com/p16.png}
  - {name: Group 17, type: select, include-all: true, filter: "Proxy [0-9]+|Group 2", icon: https://h4.example.com/p17.png}
  - {name: Group 18, <<: *a5, filter: "Proxy [0-9]+|Group 3"}
  - {name: Group 19, <<: *a5, filter: "Proxy [0-9]+|Group 4"}
  - {name: Group 20, <<: *a5, filter: "Proxy [0-9]+|Group 5"}
  - {name: Group 21, <<: *a5, filter: "Proxy [0-9]+|Group 6"}
  - {name: Group 22, <<: *a5, filter: "Proxy [0-9]+|Group 7"}
  - {name: Group 23, <<: *a5, filter: "Proxy [0-9]+|Group 8"}
rules:
  - RULE-SET,set-1,Group 2
  - RULE-SET,set-3,Group 4
  - RULE-SET,set-4,Group 5
  - RULE-SET,set-5,Group 6
  - RULE-SET,set-6,Group 7
  - RULE-SET,set-7,Group 8
  - RULE-SET,set-8,Group 9
  - RULE-SET,set-9,Group 10
  - RULE-SET,set-10,Group 11
  - RULE-SET,set-11,Group 11
  - RULE-SET,set-15,Group 6,no-resolve
  - RULE-SET,set-16,Group 7,no-resolve
  - RULE-SET,set-17,Group 9,no-resolve
  - RULE-SET,set-2,Group 3
  - RULE-SET,set-14,Group 12
  - RULE-SET,set-12,Group 13
  - RULE-SET,set-13,Group 13
  - MATCH,Group 14
anchor-6:
  ip: &a8 {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &a6 {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &a7 {type: http, interval: 86400, behavior: classical, format: text}
