port: 7890
socks-port: 7891
redir-port: 7892
tproxy-port: 7893
bind-address: '*'
mode: rule
allow-lan: true
log-level: silent
external-controller: 0.0.0.0:2222
external-ui: ./path-1
ipv6: true
secret: ""
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 240.0.0.1/10
  use-hosts: true
  nameserver:
    - https://h1.example.com/dns-query
    - tls://h2.example.com
  fallback:
    - https://h3.example.com/dns-query
proxies:
  - name: Proxy 1
    server: 192.0.2.1
    port: 80
    type: vmess
    uuid: 00005a11-0000-4000-8000-000000000001
    alterId: 0
    cipher: auto
    tls: false
    skip-cert-verify: true
    network: ws
    ws-opts:
      path: /p1
      headers:
        Host: sni1.example.org
    udp: false
  - name: Proxy 2
    server: 192.0.2.2
    port: 443
    type: vmess
    uuid: 00005a11-0000-4000-8000-000000000002
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: true
    network: ws
    ws-opts:
      path: /p1
      headers:
        Host: sni2.example.org
    udp: false
  - name: Proxy 3
    server: 192.0.2.3
    port: 443
    type: trojan
    password: password1
    sni: sni3.example.org
    skip-cert-verify: true
    udp: false
proxy-groups:
  - name: Group 1
    type: load-balance
    url: 'http://h4.example.com/'
    interval: 60
    lazy: false
    disable-udp: false
    strategy: consistent-hashing
    proxies:
      - Proxy 1
      - Proxy 2
      - Proxy 3
rules:
  - MATCH,Group 1
