  - RULE-SET,set-43,REJECT-DROP
  - RULE-SET,set-44,Group 3
  - RULE-SET,set-45,Group 3
  - RULE-SET,set-46,Group 3
  - RULE-SET,set-47,DIRECT
  - RULE-SET,set-48,DIRECT
  - RULE-SET,set-49,Group 3,no-resolve
  - RULE-SET,set-50,Group 1,no-resolve
  - RULE-SET,set-52,Group 3,no-resolve
