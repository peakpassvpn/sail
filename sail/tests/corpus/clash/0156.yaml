anchor-1: &a1 {type: http, interval: 7200, proxy: DIRECT, health-check: {enable: true, url: "https://h1.example.com/generate_204", interval: 120}, header: {User-Agent: ["Agent1", "Agent2"]}, override: {client-fingerprint: chrome}}
proxy-providers:
  provider-1:
    url: "https://h2.example.com/p1?app=v1#f1"
    <<: *a1
  provider-2:
    url: "https://h3.example.com/p2?app=v1#f1"
    <<: *a1
  provider-3:
    url: "https://h4.example.com/p3?target=clash"
    <<: *a1
  provider-4:
    url: "https://h5.example.com/p4?token=v2"
    <<: *a1
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 60
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ./path-1
external-ui-name: str2
external-ui-url: "https://h11.example.com/p60.zip"
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "str1"
    - "+.d1.example"
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: 2001:db8::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.d2.example"
    - "+.d3.example"
    - "+.d4.example"
    - "+.d5.example"
    - rule-set:set-4
    - rule-set:set-9
    - rule-set:set-11
    - rule-set:set-13
    - rule-set:set-47
    - rule-set:set-48
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
  nameserver:
    - https://h6.example.com/dns-query
    - https://h7.example.com/dns-query
  proxy-server-nameserver:
    - https://h6.example.com/dns-query
    - https://h7.example.com/dns-query
  nameserver-policy:
    rule-set:set-2: rcode://success
    rule-set:set-5,set-4,set-6,set-7:
      - https://h8.example.com/dns-query
      - https://h9.example.com/dns-query
    rule-set:set-22,set-9,set-13,set-14,set-44,set-42,set-45,set-46:
      - https://h9.example.com/dns-query
      - https://h8.example.com/dns-query
    rule-set:set-17:
      - 192.0.2.3
      - 192.0.2.4
    rule-set:set-37:
      - https://h7.example.com/dns-query
      - https://h6.example.com/dns-query
    rule-set:set-39:
      - 192.0.2.5
      - https://h6.example.com/dns-query
    rule-set:set-8,set-28,set-47,set-48:
      - https://h6.example.com/dns-query
      - https://h7.example.com/dns-query
anchor-2: &a2 {type: url-test, url: "https://h1.example.com/generate_204", interval: 120, tolerance: 10}
proxy-groups:
  - name: "Group 1"
    use:
      - provider-1
    <<: *a2
  - name: "Group 2"
    use:
      - provider-2
    <<: *a2
  - name: "Group 3"
    use:
      - provider-3
    filter: "Proxy [0-9]+|Group 1"
    <<: *a2
  - name: "Group 4"
    use:
      - provider-4
    filter: 'Proxy [0-9]+|Group 2'
    <<: *a2
  - name: "Group 5"
    type: load-balance
    use:
      - provider-2
      - provider-3
    url: "https://h1.example.com/generate_204"
    interval: 120
    strategy: "round-robin"
rules:
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((RULE-SET,set-47)))),REJECT-DROP
  - DOMAIN-SUFFIX,d6.example,Group 5
  - DOMAIN-SUFFIX,d7.example,Group 4
  - DOMAIN-SUFFIX,d8.example,Group 4
  - DOMAIN-SUFFIX,d9.example,DIRECT
  - DOMAIN-SUFFIX,d10.example,DIRECT
