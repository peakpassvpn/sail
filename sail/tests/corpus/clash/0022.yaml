global-client-fingerprint: chrome
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
tcp-concurrent: true
enable-process: true
find-process-mode: strict
ipv6: true
log-level: debug
geo-auto-update: true
geo-update-interval: 168
secret: ""
bind-address: "*"
unified-delay: false
disable-keep-alive: false
keep-alive-idle: 30
keep-alive-interval: 30
profile:
  name: str1
  version: 1
  author: str2
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: true
  respect-rules: false
  prefer-h3: true
  cache-algorithm: arc
  use-system-hosts: true
  use-host: true
  enhanced-mode: fake-ip
  fake-ip-filter-mode: blacklist
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.d1.example"
    - "*.d2.example"
    - "*.d3.example"
    - "*.localhost"
    - "*.d4.example"
    - "*.d5.example"
    - "*.d6.example"
    - d7.*.example
    - d8.*.example
    - "*.d9.example"
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
  nameserver:
    - 192.0.2.3
    - 192.0.2.4
  direct-nameserver:
    - 192.0.2.3
    - 192.0.2.1
  proxy-server-nameserver:
    - 192.0.2.3
    - 192.0.2.1
    - https://h1.example.com/dns-query
    - tls://h2.example.com
    - d10.example
    - https://h3.example.com/dns-query
    - tls://h3.example.com
    - d11.example
    - 2001:db8::1
    - 2001:db8::2
    - 2001:db8::3
    - 2001:db8::4
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080, 8880, 2052, 2082, 2086, 2095]
    TLS:
      ports: [443, 8443, 2053, 2083, 2087, 2096]
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  auto-redir: true
  dns-hijack:
    - any:53
    - tcp://any:53
