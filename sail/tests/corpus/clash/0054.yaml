mixed-port: 7897
allow-lan: false
mode: rule
log-level: info
ipv6: false
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://192.0.2.1/dns-query
    - https://192.0.2.2/dns-query
proxies:
  - name: Proxy 1
    type: socks5
    server: 192.0.2.3
    port: 10808
    udp: true
  - name: Proxy 2
    type: socks5
    server: 192.0.2.4
    port: 49547
    udp: true
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
  - name: Group 2
    type: fallback
    proxies:
      - Proxy 1
      - Proxy 2
    url: https://h1.example.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
rules:
  - MATCH,Group 2
