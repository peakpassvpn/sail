mixed-port: 7890
allow-lan: false
ipv6: true
mode: rule
log-level: warning
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - "*"
    - "+.d1.example"
    - "+.d2.example"
    - "+.d3.example"
  default-nameserver:
    - tls://192.0.2.1
    - tls://192.0.2.2
  nameserver:
    - https://h1.example.com/dns-query
    - https://h2.example.com/dns-query
proxies:
proxy-groups:
rules:
