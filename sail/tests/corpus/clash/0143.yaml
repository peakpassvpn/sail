proxy-providers:
  provider-1:
    url: "str1"
    type: http
    interval: 1800
    health-check: {enable: true, url: "https://h1.example.com/generate_204", interval: 300}
    override:
      additional-prefix: "str2"
  provider-2:
    url: "str3"
    type: http
    interval: 1800
    health-check: {enable: true, url: "https://h1.example.com/generate_204", interval: 300}
    override:
      additional-prefix: "str4"
proxies:
  - name: "Proxy 1"
    type: direct
    udp: true
mixed-port: 7890
ipv6: true
allow-lan: true
unified-delay: false
tcp-concurrent: true
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ./path-1
external-ui-url: "https://h5.example.com/p22.zip"
find-process-mode: off
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "str5"
    - "+.d1.example"
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
dns:
  enable: true
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*"
    - "+.d2.example"
    - "+.d3.example"
    - "rule-set:set-2"
    - "rule-set:set-1"
    - "+.d4.example"
    - "+.d5.example"
    - "+.d6.example"
  nameserver:
    - https://192.0.2.1/dns-query
    - https://192.0.2.2/dns-query
  proxy-server-nameserver:
    - https://192.0.2.1/dns-query
    - https://192.0.2.2/dns-query
  nameserver-policy:
    rule-set:set-2,set-1:
      - https://192.0.2.1/dns-query
      - https://192.0.2.2/dns-query
    rule-set:set-15:
      - "https://h2.example.com/dns-query"
      - "https://h3.example.com/dns-query"
proxy-groups:
  - name: Group 1
    type: select
    proxies: [Group 20, Proxy 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19]
  - name: Group 2
    type: select
    proxies: [Group 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Proxy 1]
  - name: Group 3
    type: select
    proxies: [Group 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Proxy 1]
  - name: Group 4
    type: select
    proxies: [Group 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Proxy 1]
  - name: Group 5
    type: select
    proxies: [Group 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Proxy 1]
  - name: Group 6
    type: select
    proxies: [Group 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Proxy 1]
  - name: Group 7
    type: select
    proxies: [Group 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Proxy 1]
  - name: Group 8
    type: select
    proxies: [Group 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Proxy 1]
  - name: Group 9
    type: select
    proxies: [Group 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Proxy 1]
  - name: Group 10
    type: select
    proxies: [Group 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Proxy 1]
  - name: Group 11
    type: select
    proxies: [Proxy 1, Group 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20]
  - name: Group 12
    type: select
    proxies: [Group 1, Group 13, Group 14, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Proxy 1]
  - name: Group 13
    type: select
    include-all: true
    exclude-type: direct
    filter: "Proxy [0-9]+|Group 1"
  - name: Group 14
    type: select
    include-all: true
    exclude-type: direct
    filter: "Proxy [0-9]+|Group 2"
  - name: Group 15
    type: select
    include-all: true
    exclude-type: direct
    filter: "Proxy [0-9]+|Group 3"
  - name: Group 16
    type: select
    include-all: true
    exclude-type: direct
    filter: "Proxy [0-9]+|Group 4"
  - name: Group 17
    type: select
    include-all: true
    exclude-type: direct
    filter: "Proxy [0-9]+|Group 5"
  - name: Group 18
    type: select
    include-all: true
    exclude-type: direct
    filter: "Proxy [0-9]+|Group 6"
  - name: Group 19
    type: select
    include-all: true
    exclude-type: direct
  - name: Group 20
    type: url-test
    include-all: true
    exclude-type: direct
    tolerance: 10
rules:
  - RULE-SET,set-16,Proxy 1,no-resolve
  - RULE-SET,set-5,Group 10
  - RULE-SET,set-6,Group 4
  - RULE-SET,set-7,Group 7
  - RULE-SET,set-8,Group 2
  - RULE-SET,set-9,Group 3
  - RULE-SET,set-10,Group 8
  - RULE-SET,set-11,Group 5
  - RULE-SET,set-12,Group 6
  - RULE-SET,set-13,Group 9
  - RULE-SET,set-2,Group 11
  - RULE-SET,set-15,Group 12
  - RULE-SET,set-18,Group 2
  - RULE-SET,set-19,Group 8
  - RULE-SET,set-21,Group 3
  - RULE-SET,set-20,Group 4
  - RULE-SET,set-17,Group 11
  - MATCH,Group 12
anchor-1:
  ip: &a2 {type: http, interval: 1800, behavior: ipcidr, format: mrs}
  domain: &a1 {type: http, interval: 1800, behavior: domain, format: mrs}
