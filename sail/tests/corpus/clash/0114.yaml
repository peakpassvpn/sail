port: 1080
socks-port: 1081
redir-port: 1082
mixed-port: 1083
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.d1.example"
    - d2.example
    - +.d3.example
    - +.d4.example
    - +.d5.example
    - +.d6.example
    - +.d7.example
    - d5.example
    - d8.*.example
    - "*.d9.example"
    - "*.d10.example"
    - "*.d11.example"
    - "*.d12.example"
  nameserver:
    - 192.0.2.1
    - 192.0.2.2
  fallback:
    - https://h1.example.com/dns-query
    - https://h2.example.com/dns-query
    - https://h3.example.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
anchor-1: &a3 {use: [provider-1]}
anchor-2: &a4 {type: select, proxies: [Group 17, Group 1, Group 14, Group 15, Group 18, Group 19, Group 21, Group 20, Group 22, Group 23, Group 25, Group 24, Group 26, Group 27, DIRECT]}
anchor-3: &a1 {type: http, health-check: {enable: true, url: http://h4.example.com/generate_204, interval: 90}}
anchor-4: &a7 {type: url-test, lazy: true, url: http://h4.example.com/generate_204, interval: 90, <<: *a3}
anchor-5: &a2 {type: select, <<: *a3}
anchor-6: &a9 {type: http, behavior: classical, format: yaml, interval: 86400}
anchor-7: &a8 {type: http, behavior: domain, format: text, interval: 86400}
anchor-8: &a10 {type: http, behavior: ipcidr, format: yaml, interval: 86400}
anchor-9: &a5 {type: load-balance, interval: 300, timeout: 3000, max-failed-times: 2, lazy: true, <<: *a3}
anchor-10: &a6 {type: fallback, interval: 300, timeout: 3000, max-failed-times: 2, lazy: true, <<: *a3}
proxy-providers:
  provider-1:
    <<: *a1
    interval: 86400
    path: ./path-1.yaml
    url: https://192.0.2.3/p1
proxies:
proxy-groups:
  - {name: Group 1, <<: *a2}
  - {name: Group 2, <<: *a4}
  - {name: Group 3, type: select, proxies: [DIRECT, Group 1, Group 14, Group 15, Group 17]}
  - {name: Group 4, type: select, proxies: [Group 21, Group 1]}
  - {name: Group 5, <<: *a4}
  - {name: Group 6, <<: *a4}
  - {name: Group 7, <<: *a4}
  - {name: Group 8, type: select, proxies: [Group 19, Group 1]}
  - {name: Group 9, <<: *a4}
  - {name: Group 10, type: select, proxies: [DIRECT, Group 18, Group 20, Group 1]}
  - {name: Group 11, <<: *a4}
  - {name: Group 12, <<: *a4}
  - {name: Group 13, type: select, proxies: [REJECT]}
  - {name: Group 14, <<: *a5}
  - {name: Group 15, <<: *a6}
  - {name: Group 16, <<: *a4}
  - {name: Group 17, <<: *a7}
  - {name: Group 18, <<: *a7, filter: "Proxy [0-9]+|Group 1"}
  - {name: Group 19, <<: *a7, filter: "Proxy [0-9]+|Group 2"}
  - {name: Group 20, <<: *a7, filter: "Proxy [0-9]+|Group 3"}
  - {name: Group 21, <<: *a7, filter: "Proxy [0-9]+|Group 4"}
  - {name: Group 22, <<: *a7, filter: "Proxy [0-9]+|Group 5"}
  - {name: Group 23, <<: *a7, filter: "Proxy [0-9]+|Group 6"}
  - {name: Group 24, <<: *a7, filter: "Proxy [0-9]+|Group 7"}
  - {name: Group 25, <<: *a7, filter: "Proxy [0-9]+|Group 8"}
  - {name: Group 26, <<: *a7, filter: "Proxy [0-9]+|Group 9"}
  - {name: Group 27, <<: *a7, filter: "Proxy [0-9]+|Group 10"}
rule-providers:
  set-1: {<<: *a8, url: https://h5.example.com/p2.txt, path: ./path-2.yaml}
  set-2: {<<: *a9, url: https://h6.example.com/p3.yaml, path: ./path-3.yaml}
  set-3: {<<: *a9, url: https://h7.example.com/p4.yaml, path: ./path-4.yaml}
  set-4: {<<: *a9, url: https://h7.example.com/p5.yaml, path: ./path-5.yaml}
  set-5: {<<: *a9, url: https://h7.example.com/p6.yaml, path: ./path-6.yaml}
  set-6: {<<: *a9, url: https://h7.example.com/p7.yaml, path: ./path-7.yaml}
  set-7: {<<: *a9, url: https://h7.example.com/p8.yaml, path: ./path-8.yaml}
  set-8: {<<: *a9, url: https://h7.example.com/p9.yaml, path: ./path-9.yaml}
  set-9: {<<: *a9, url: https://h7.example.com/p10.yaml, path: ./path-10.yaml}
  set-10: {<<: *a9, url: https://h7.example.com/p11.yaml, path: ./path-11.yaml}
  set-11: {<<: *a9, url: https://h7.example.com/p12.yaml, path: ./path-12.yaml}
  set-12: {<<: *a9, url: https://h7.example.com/p13.yaml, path: ./path-13.yaml}
  set-13: {<<: *a9, url: https://h7.example.com/p14.yaml, path: ./path-14.yaml}
  set-14: {<<: *a9, url: http://h8.example.com/p15.yaml, path: ./path-15.yaml}
  set-15: {<<: *a9, url: http://h8.example.com/p16.yaml, path: ./path-16.yaml}
  set-16: {<<: *a9, url: https://h7.example.com/p17.yaml, path: ./path-17.yaml}
  set-17: {<<: *a9, url: https://h7.example.com/p18.yaml, path: ./path-18.yaml}
  set-18: {<<: *a9, url: https://h7.example.com/p19.yaml, path: ./path-19.yaml}
  set-19: {<<: *a10, url: https://h7.example.com/p20.yml, path: ./path-20.yaml}
rules:
  - RULE-SET,set-14,Group 3
  - RULE-SET,set-15,Group 8
  - RULE-SET,set-1,Group 13
  - RULE-SET,set-2,Group 4
  - RULE-SET,set-3,Group 10
  - RULE-SET,set-4,Group 10
  - RULE-SET,set-5,Group 5
  - RULE-SET,set-6,Group 9
  - RULE-SET,set-7,Group 2
  - RULE-SET,set-8, Group 2
  - RULE-SET,set-9,Group 7
  - RULE-SET,set-10,Group 6
  - RULE-SET,set-11,Group 2
  - RULE-SET,set-12,Group 12
  - RULE-SET,set-13,Group 2
  - RULE-SET,set-16,DIRECT
  - RULE-SET,set-17,DIRECT
  - RULE-SET,set-18,DIRECT
  - RULE-SET,set-19,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Group 16
