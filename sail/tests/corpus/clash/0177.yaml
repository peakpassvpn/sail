mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9000
proxies:
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - Group 1
      - Group 2
    use:
      - provider-1
  - name: Group 1
    type: load-balance
    strategy: consistent-hashing
    use:
      - provider-1
    url: http://h1.example.com/generate_204
    interval: 1200
  - name: Group 2
    type: url-test
    use:
      - provider-1
    url: http://h2.example.com/generate_204
    interval: 1200
    tolerance: 100
proxy-providers:
  provider-1:
    type: http
    url: https://h3.example.com/p1.yml
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 1200
      url: http://h2.example.com/generate_204
rule-providers:
  set-1:
    type: http
    behavior: domain
    url: "https://h4.example.com/p2.txt"
    path: ./path-2.yaml
  set-2:
    type: http
    behavior: domain
    url: "https://h4.example.com/p3.txt"
    path: ./path-3.yaml
  set-3:
    type: http
    behavior: domain
    url: "https://h4.example.com/p4.txt"
    path: ./path-4.yaml
  set-4:
    type: http
    behavior: domain
    url: "https://h4.example.com/p5.txt"
    path: ./path-5.yaml
  set-5:
    type: http
    behavior: domain
    url: "https://h4.example.com/p6.txt"
    path: ./path-6.yaml
  set-6:
    type: http
    behavior: ipcidr
    url: "https://h4.example.com/p7.txt"
    path: ./path-7.yaml
  set-7:
    type: http
    behavior: classical
    url: "https://h4.example.com/p8.txt"
    path: ./path-8.yaml
rules:
  - RULE-SET,set-7,DIRECT
  - DOMAIN,d1.example,DIRECT
  - DOMAIN,d2.example,DIRECT
  - RULE-SET,set-2,DIRECT
  - RULE-SET,set-1,REJECT
  - RULE-SET,set-5,PROXY
  - RULE-SET,set-3,PROXY
  - RULE-SET,set-4,PROXY
  - RULE-SET,set-6,PROXY,no-resolve
  - MATCH,DIRECT
