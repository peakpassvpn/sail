proxies:
anchor-1: &a2 {type: http, interval: 3600, health-check: {enable: true, url: 'http://h1.example.com/generate_204', interval: 600}}
anchor-2: &a7 {type: http, behavior: classical, interval: 86400}
anchor-3: &a3 {type: select}
anchor-4: &a8 {type: fallback, url: 'http://h1.example.com/generate_204', interval: 300}
anchor-5: &a6 {type: url-test, url: 'http://h1.example.com/generate_204', interval: 300}
anchor-6: &a5
  proxies:
    - Group 1
    - Group 2
    - Group 14
    - Group 15
anchor-7: &a4
  proxies:
    - Group 14
    - Group 2
    - Group 15
proxy-providers:
  provider-1: &a1 {<<: *a2, path: ./path-1.yaml, url: "http://127.0.0.1:25500/p1?name=v1&token=v2&list=true"}
proxy-groups:
  - {name: 'Group 1', <<: [*a3, *a4]}
  - {name: 'Group 2', <<: *a3, use: [provider-1]}
  - {name: 'Group 3', <<: [*a3, *a5]}
  - {name: 'Group 4', <<: [*a3, *a5]}
  - {name: 'Group 5', <<: [*a3, *a5]}
  - {name: 'Group 6', <<: [*a3, *a5]}
  - {name: 'Group 7', <<: [*a3, *a5]}
  - {name: 'Group 8', <<: [*a3, *a5]}
  - {name: 'Group 9', <<: [*a3, *a5]}
  - {name: 'Group 10', <<: [*a3, *a5]}
  - {name: 'Group 11', <<: [*a3, *a5]}
  - {name: 'Group 12', <<: [*a3, *a5]}
  - {name: 'Group 13', <<: [*a3, *a5]}
  - {name: 'Group 14', <<: *a6, use: [provider-1]}
  - {name: 'Group 15', <<: *a3, proxies: [DIRECT]}
rule-providers:
  set-1: {<<: *a7, path: ./path-2.yaml, url: https://h2.example.com/p2.yaml}
  set-2: {<<: *a7, path: ./path-3.yaml, url: https://h2.example.com/p3.yaml}
  set-3: {<<: *a7, path: ./path-4.yaml, url: https://h2.example.com/p4.yaml}
  set-4: {<<: *a7, path: ./path-5.yaml, url: https://h2.example.com/p5.yaml}
  set-5: {<<: *a7, path: ./path-6.yaml, url: https://h2.example.com/p6.yaml}
  set-6: {<<: *a7, path: ./path-7.yaml, url: https://h2.example.com/p7.yaml}
  set-7: {<<: *a7, path: ./path-8.yaml, url: https://h2.example.com/p8.yaml}
  set-8: {<<: *a7, path: ./path-9.yaml, url: https://h2.example.com/p9.yaml}
  set-9: {<<: *a7, path: ./path-10.yaml, url: https://h2.example.com/p10.yaml}
  set-10: {<<: *a7, path: ./path-11.yaml, url: https://h2.example.com/p11.yaml}
  set-11: {<<: *a7, path: ./path-12.yaml, url: https://h2.example.com/p12.yaml}
  PROXY: {<<: *a7, path: ./path-13.yaml, url: https://h2.example.com/p13.yaml}
  set-12: {<<: *a7, path: ./path-14.yaml, url: https://h2.example.com/p14.yaml}
  set-13: {<<: *a7, path: ./path-15.yaml, url: https://h2.example.com/p15.yaml}
  set-14: {<<: *a7, path: ./path-16.yaml, url: https://h2.example.com/p16.yaml}
  set-15: {<<: *a7, path: ./path-17.yaml, url: https://h2.example.com/p17.yaml}
rules:
  - RULE-SET,set-1,Group 15
  - RULE-SET,set-5,Group 15
  - RULE-SET,set-2,Group 15
  - RULE-SET,set-3,Group 15
  - RULE-SET,set-10,Group 3
  - RULE-SET,set-12,Group 4
  - RULE-SET,set-13,Group 5
  - RULE-SET,set-15,Group 6
  - RULE-SET,set-14,Group 7
  - RULE-SET,set-6,Group 8
  - RULE-SET,set-9,Group 9
  - RULE-SET,set-7,Group 10
  - RULE-SET,set-8,Group 11
  - RULE-SET,set-11,Group 12
  - RULE-SET,PROXY,Group 1
  - RULE-SET,set-4,Group 15
  - GEOIP,CN,Group 15
  - MATCH,Group 13
