mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: Rule
log-level: info
external-controller: '127.0.0.1:9090'
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  ipv6: false
  default-nameserver: [192.0.2.1, 192.0.2.2, 192.0.2.3]
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  proxy-server-nameserver: [192.0.2.1, 192.0.2.2, 192.0.2.3]
  nameserver: [192.0.2.1, 192.0.2.2, 192.0.2.3]
  fallback: [192.0.2.4, 192.0.2.5]
  fallback-filter: {geoip: true, geoip-code: CN, geosite: [str1], ipcidr: [240.0.0.0/4], domain: [+.d1.example, +.d2.example, +.d3.example]}
proxies: {{proxies: null}: null}
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Group 3
      - Group 2
      - DIRECT
  - name: Group 2
    type: select
    proxies: {{group: null}: null}
  - name: Group 3
    type: url-test
    url: http://h1.example.com/generate_204
    interval: 300
    tolerance: 50
    proxies: {{group: null}: null}
  - name: Group 4
    type: select
    proxies: [Group 1, Group 3, Group 2, DIRECT]
  - name: Group 5
    type: select
    proxies: [Group 1, Group 3, Group 2, DIRECT]
  - name: Group 6
    type: select
    proxies: [Group 1, Group 3, Group 2, DIRECT]
  - name: Group 7
    type: select
    proxies: [Group 1, Group 3, Group 2, DIRECT]
  - name: Group 8
    type: select
    proxies: [Group 1, Group 3, Group 2, DIRECT]
  - name: Group 9
    type: select
    proxies: [DIRECT, Group 1, Group 3, Group 2]
  - name: Group 10
    type: select
    proxies: [Group 1, Group 3, Group 2, DIRECT]
  - name: Group 11
    type: select
    proxies: [Group 1, Group 3, Group 2, DIRECT]
  - name: Group 12
    type: select
    proxies: [DIRECT, Group 1, Group 3, Group 2]
  - name: Group 13
    type: select
    proxies: [Group 1, Group 3, Group 2, DIRECT]
  - name: Group 14
    type: select
    proxies: [Group 1, Group 3, Group 2, DIRECT]
  - name: Group 15
    type: select
    proxies: [DIRECT, Group 1, Group 3]
  - name: Group 16
    type: select
    proxies: [DIRECT, Group 1, Group 3]
  - name: Group 17
    type: select
    proxies: [DIRECT, Group 1, Group 3]
  - name: Group 18
    type: select
    proxies: [DIRECT, Group 1, Group 3]
  - name: Group 19
    type: select
    proxies: [DIRECT, Group 1, Group 3]
  - name: Group 20
    type: select
    proxies: [DIRECT, Group 1, Group 3]
  - name: Group 21
    type: select
    proxies: [DIRECT, Group 1, Group 3]
  - name: Group 22
    type: select
    proxies: [DIRECT, Group 1, Group 3]
  - name: Group 23
    type: select
    proxies: [DIRECT, Group 1, Group 3]
  - name: Group 24
    type: select
    proxies: [DIRECT, Group 1, Group 3]
  - name: Group 25
    type: select
    proxies: [DIRECT]
  - name: Group 26
    type: select
    proxies: [REJECT, DIRECT]
  - name: Group 27
    type: select
    proxies: [REJECT, DIRECT]
  - name: Group 28
    type: select
    proxies: [REJECT, DIRECT]
  - name: Group 29
    type: select
    proxies: [Group 1, DIRECT]
rules:
  - 'IP-CIDR,127.0.0.0/8,DIRECT'
  - 'IP-CIDR,172.16.0.0/12,DIRECT'
  - 'IP-CIDR,192.168.0.0/16,DIRECT'
  - 'IP-CIDR,10.0.0.0/8,DIRECT'
  - 'IP-CIDR,198.18.0.0/16,DIRECT,no-resolve'
  - RULE-SET,set-1,Group 25
  - RULE-SET,set-2,Group 25
  - RULE-SET,set-3,Group 26
  - RULE-SET,set-4,Group 27
  - RULE-SET,set-5,Group 28
  - RULE-SET,set-6,Group 12
  - RULE-SET,set-7,Group 25
  - RULE-SET,set-8,Group 13
  - RULE-SET,set-9,Group 14
