  - RULE-SET,set-17,Group 4
  - RULE-SET,set-18,Group 23
  - RULE-SET,set-19,Group 24
  - RULE-SET,set-20,Group 22
  - RULE-SET,set-21,Group 22
  - RULE-SET,set-22,Group 22
  - RULE-SET,set-23,Group 5
  - RULE-SET,set-24,Group 6
  - RULE-SET,set-25,Group 7
  - RULE-SET,set-26,Group 8
  - RULE-SET,set-27,Group 9
  - RULE-SET,set-28,Group 9
  - RULE-SET,set-29,Group 11
  - RULE-SET,set-30,Group 10
  - RULE-SET,set-31,Group 1
  - RULE-SET,set-32,Group 25
  - RULE-SET,set-33,Group 25
  - RULE-SET,set-34,Group 25
  - GEOIP,CN,Group 25
  - MATCH,Group 29
