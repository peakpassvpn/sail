port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome
ipv6: true
dns:
  enable: true
  listen: :53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
  nameserver:
    - https://h1.example.com/dns-query
    - https://h2.example.com/dns-query
  fallback:
    - https://192.0.2.3/dns-query
    - tls://h3.example.com
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
proxy-providers:
  provider-1:
    type: http
    url: "https://h4.example.com/p1.yaml"
    interval: 3600
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 600
      url: https://h5.example.com/generate_204
proxies:
  - name: Proxy 1
    type: wireguard
    server: s1.example.net
    port: 2408
    ip: 192.0.2.4
    ipv6: 2001:db8::1
    private-key: wywOQgzCr2vr85JpoMxzCakHIIvgUtsG6/Qp987NJa4=
    public-key: WulOoXrJ4xaeREDpCXJqPLE7mK1qDJwNSfPto1FYe4I=
    udp: true
    reserved: [0, 0, 0]
    remote-dns-resolve: true
    dns: [192.0.2.5, 192.0.2.2]
    dialer-proxy: "Group 2"
  - name: Proxy 2
    type: vless
    server: 192.0.2.6
    port: 443
    uuid: 00005a11-0000-4000-8000-000000000001
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: sni2.example.org
    client-fingerprint: chrome
    reality-opts:
      public-key: uLBP4fDmzzQr6AI9
      short-id: str1
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
      - DIRECT
      - Group 3
      - Group 4
      - Group 5
  - name: Group 2
    type: select
    proxies:
      - Group 3
      - Group 4
      - Group 5
  - name: Group 3
    type: load-balance
    use:
      - provider-1
    url: 'http://h5.example.com/generate_204'
    interval: 300
    strategy: round-robin
  - name: Group 4
    type: url-test
    use:
      - provider-1
    url: "http://h5.example.com/generate_204"
    interval: 300
    tolerance: 50
  - name: Group 5
    type: select
    use:
      - provider-1
rule-providers:
  set-1:
    type: http
    behavior: domain
    url: "https://h6.example.com/p2.txt"
    path: ./path-2.yaml
    interval: 86400
  set-2:
    type: http
    behavior: domain
    url: "https://h6.example.com/p3.txt"
    path: ./path-3.yaml
    interval: 86400
  set-3:
    type: http
    behavior: domain
    url: "https://h6.example.com/p4.txt"
    path: ./path-4.yaml
    interval: 86400
  set-4:
    type: http
    behavior: domain
    url: "https://h6.example.com/p5.txt"
    path: ./path-5.yaml
    interval: 86400
  set-5:
    type: http
    behavior: domain
    url: "https://h6.example.com/p6.txt"
    path: ./path-6.yaml
    interval: 86400
  set-6:
    type: http
    behavior: domain
    url: "https://h6.example.com/p7.txt"
    path: ./path-7.yaml
    interval: 86400
  set-7:
    type: http
    behavior: domain
    url: "https://h6.example.com/p8.txt"
    path: ./path-8.yaml
    interval: 86400
  set-8:
    type: http
    behavior: domain
    url: "https://h6.example.com/p9.txt"
    path: ./path-9.yaml
    interval: 86400
  set-9:
    type: http
    behavior: domain
    url: "https://h6.example.com/p10.txt"
    path: ./path-10.yaml
    interval: 86400
  set-10:
    type: http
    behavior: ipcidr
    url: "https://h6.example.com/p11.txt"
    path: ./path-11.yaml
    interval: 86400
  set-11:
    type: http
    behavior: ipcidr
    url: "https://h6.example.com/p12.txt"
    path: ./path-12.yaml
    interval: 86400
  set-12:
    type: http
    behavior: ipcidr
    url: "https://h6.example.com/p13.txt"
    path: ./path-13.yaml
    interval: 86400
  set-13:
    type: http
    behavior: classical
    url: "https://h6.example.com/p14.txt"
    path: ./path-14.yaml
    interval: 86400
rules:
  - RULE-SET,set-13,DIRECT
  - DOMAIN,d3.example,DIRECT
  - DOMAIN,d4.example,DIRECT
  - RULE-SET,set-7,DIRECT
  - RULE-SET,set-1,REJECT
  - RULE-SET,set-2,DIRECT
  - RULE-SET,set-3,DIRECT
  - RULE-SET,set-4,Group 1
  - RULE-SET,set-5,Group 1
  - RULE-SET,set-6,DIRECT
  - RULE-SET,set-12,DIRECT
  - RULE-SET,set-11,DIRECT
  - RULE-SET,set-10,Group 1
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Group 1
