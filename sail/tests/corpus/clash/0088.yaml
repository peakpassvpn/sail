mixed-port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: :9090
proxies:
  - name: Proxy 1
    type: http
    server: s1.example.net
    port: 19090
  - name: Proxy 2
    type: http
    server: s2.example.net
    port: 19090
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
rules:
  - DOMAIN-KEYWORD,kw1,Group 1
  - MATCH,DIRECT
