    - '+.d94.example'
    - '+.d95.example'
    - '+.d96.example'
    - '+.d97.example'
proxies:
anchor-1: &a2
  type: http
  interval: 3600
  health-check:
    enable: true
    url: https://h2.example.com/p1.list
    interval: 300
anchor-2: &a4
  type: http
  behavior: classical
  interval: 86400
proxy-providers:
  provider-1: &a1
    <<: *a2
    url: "https://h3.example.com/p2?target=clash&url=v1&emoji=false&list=true&udp=true&tfo=false&scv=false&fdn=false&sort=true"
    path: ./path-1.yaml
  provider-2: &a3
    <<: *a2
    url: "https://h3.example.com/p2?target=clash&url=v1&exclude=v2&emoji=false&list=true&udp=true&tfo=false&scv=false&fdn=false&sort=true"
    path: ./path-2.yaml
  provider-3:
    <<: *a3
    filter: "Proxy [0-9]+|Group 1"
  provider-4:
    <<: *a3
    filter: "Proxy [0-9]+|Group 2"
  provider-5:
    <<: *a1
    filter: "Proxy [0-9]+|Group 3"
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Group 3
      - Group 4
      - Group 5
  - name: Group 2
    type: select
    use:
      - provider-5
    proxies:
      - Group 1
  - name: Group 3
    type: select
    use:
      - provider-3
    proxies:
      - Group 6
  - name: Group 4
    type: select
    use:
      - provider-4
    proxies:
      - Group 7
  - name: Group 5
    type: select
    use:
      - provider-1
  - name: Group 6
    type: url-test
    url: 'https://h2.example.com/p1.list'
    nterval: 600
    tolerance: 30
    use:
      - provider-3
  - name: Group 7
    type: url-test
    url: 'https://h2.example.com/p1.list'
    nterval: 600
    tolerance: 30
    use:
      - provider-4
