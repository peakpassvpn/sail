interface-name: if1
ipv6: false
tun:
  enable: true
  stack: system
  auto-detect-interface: true
port: 7891
socks-port: 7890
redir-port: 7893
allow-lan: true
profile:
  tracing: true
mode: Rule
external-ui: ./path-2
secret: 'password1'
external-controller: 0.0.0.0:9013
log-level: silent
proxy-providers:
  provider-1:
    type: file
    path: ./path-1.yaml
    filter: ''
    health-check:
      enable: true
      url: http://h1.example.com/generate_204
      interval: 300
proxy-groups:
  - name: PROXY
    type: select
    url: http://h1.example.com/generate_204
    interval: 3600
    use:
      - provider-1
    proxies:
      - DIRECT
rules:
  - MATCH,PROXY
