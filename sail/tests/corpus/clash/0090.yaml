mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: ''
dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  nameserver:
    - https://h1.example.com/dns-query
    - https://h2.example.com/dns-query
  fallback:
    - https://h3.example.com/dns-query
    - https://h4.example.com/dns-query
    - https://h5.example.com/dns-query
    - tls://192.0.2.3:853
  fallback-filter:
    geoip: true
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
