proxy-providers:
  provider-1:
    type: http
    url: "str1"
    path: ./path-1.yaml
    interval: 7200
mixed-port: 7890
allow-lan: false
mode: rule
log-level: debug
ipv6: false
external-controller: 0.0.0.0:9090
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  default-nameserver:
    - 192.0.2.1
  nameserver:
    - tls://192.0.2.2:853
    - 192.0.2.1
    - 192.0.2.3
    - 192.0.2.4
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.d1.example'
    - '*.d2.example'
    - '*.d3.example'
    - '*.d4.example'
    - '*.localhost'
    - '*.d5.example'
    - '*.d6.example'
    - '*.d7.example'
    - d8.example
    - d9.example
    - d10.example
    - '+.d11.example'
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - 192.0.2.1
    - 192.0.2.4
    - 192.0.2.3
    - 192.0.2.2
    - 192.0.2.5
    - 192.0.2.6
    - 192.0.2.7
    - 192.0.2.8
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - Group 1
      - DIRECT
  - name: Group 1
    type: select
    use:
      - provider-1
rule-providers:
  set-1:
    type: http
    behavior: domain
    url: "https://h1.example.com/p1.txt"
    path: ./path-2.yaml
    interval: 36000
  set-2:
    type: http
    behavior: domain
    url: "https://h1.example.com/p2.txt"
    path: ./path-3.yaml
    interval: 36000
  set-3:
    type: http
    behavior: domain
    url: "https://h1.example.com/p3.txt"
    path: ./path-4.yaml
    interval: 36000
  set-4:
    type: http
    behavior: domain
    url: "https://h1.example.com/p4.txt"
    path: ./path-5.yaml
    interval: 36000
  set-5:
    type: http
    behavior: domain
    url: "https://h1.example.com/p5.txt"
    path: ./path-6.yaml
    interval: 36000
  set-6:
    type: http
    behavior: domain
    url: "https://h1.example.com/p6.txt"
    path: ./path-7.yaml
    interval: 36000
  set-7:
    type: http
    behavior: domain
    url: "https://h1.example.com/p7.txt"
    path: ./path-8.yaml
    interval: 36000
  set-8:
    type: http
    behavior: ipcidr
    url: "https://h1.example.com/p8.txt"
    path: ./path-9.yaml
    interval: 36000
  set-9:
    type: http
    behavior: ipcidr
    url: "https://h1.example.com/p9.txt"
    path: ./path-10.yaml
    interval: 36000
  set-10:
    type: http
    behavior: ipcidr
    url: "https://h1.example.com/p10.txt"
    path: ./path-11.yaml
    interval: 36000
  set-11:
    type: http
    behavior: classical
    url: "https://h1.example.com/p11.txt"
    path: ./path-12.yaml
    interval: 36000
rules:
  - RULE-SET,set-11,DIRECT
  - DOMAIN,d12.example,DIRECT
  - DOMAIN,d13.example,DIRECT
  - RULE-SET,set-7,DIRECT
  - RULE-SET,set-1,REJECT
  - DOMAIN,d14.example,PROXY
  - DOMAIN-SUFFIX,d15.example,PROXY
  - RULE-SET,set-2,DIRECT
  - RULE-SET,set-3,PROXY
  - RULE-SET,set-4,PROXY
  - RULE-SET,set-5,PROXY
  - RULE-SET,set-6,DIRECT
  - RULE-SET,set-10,DIRECT
  - RULE-SET,set-9,DIRECT
  - RULE-SET,set-8,PROXY
  - MATCH,PROXY
