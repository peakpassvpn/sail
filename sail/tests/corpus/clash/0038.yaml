port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Group 6
      - Group 2
      - Group 3
      - Group 4
      - Group 5
      - Group 7
      - Group 8
      - DIRECT
  - name: Group 2
    type: select
    proxies:
  - name: Group 3
    type: select
    proxies:
  - name: Group 4
    type: select
    proxies:
  - name: Group 5
    type: select
    proxies:
  - name: Group 6
    type: url-test
    url: 'http://h1.example.com/generate_204'
    interval: 300
    tolerance: 50
    proxies:
  - name: Group 7
    type: load-balance
    strategy: consistent-hashing
    url: http://h1.example.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
  - name: Group 8
    type: fallback
    url: http://h1.example.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
  - name: Group 9
    type: select
    proxies:
      - Group 1
      - Group 2
      - Group 3
      - Group 4
      - DIRECT
rule-providers:
  set-1:
    type: http
    behavior: domain
    url: https://h2.example.com/p1.txt
    path: ./path-1.yaml
    interval: 86400
rules:
  - RULE-SET,set-1,Group 9
  - MATCH,Group 1
