mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
    - 192.0.2.3
    - 192.0.2.4
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://h1.example.com/dns-query
    - https://192.0.2.3/dns-query
    - https://h2.example.com/dns-query
    - https://h3.example.com/dns-query
  fallback:
    - https://192.0.2.5/dns-query
    - https://192.0.2.6/dns-query
    - 192.0.2.7
    - 192.0.2.8
    - tls://192.0.2.6:853
    - tls://h4.example.com:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - 'str1'
anchor-1: &a1
  type: select
  use:
    - provider-1
    - provider-2
    - provider-3
    - provider-4
