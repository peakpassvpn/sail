mixed-port: 7890
unified-delay: false
geodata-mode: true
tcp-concurrent: false
find-process-mode: strict
global-client-fingerprint: chrome
allow-lan: true
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090
geox-url:
  geoip: "https://h4.example.com/p23.dat"
  geosite: "https://h4.example.com/p24.dat"
  mmdb: "https://h4.example.com/p25.mmdb"
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: false
  sniff:
    TLS:
      ports: [443]
    HTTP:
      ports: [80]
      override-destination: true
tun:
  enable: true
  stack: system
  dns-hijack:
    - 'any:53'
  auto-route: true
  auto-detect-interface: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - '*'
    - '+.d1.example'
  default-nameserver:
    - 192.0.2.1
  nameserver:
    - 'tls://192.0.2.2#Group 8'
    - 'tls://192.0.2.3#Group 8'
  proxy-server-nameserver:
    - https://h1.example.com/dns-query#h3=true
  nameserver-policy:
    "geosite:cn,private":
      - 192.0.2.1
      - 192.0.2.4
      - https://h1.example.com/dns-query#h3=true
proxy-providers:
  provider-1:
    type: http
    path: ./path-1.yaml
    url: https://h2.example.com/p1
    interval: 3600
    health-check:
      enable: true
      url: http://h3.example.com/generate_204
      interval: 60
proxy-groups:
  - name: Group 1
    type: select
    use:
      - provider-1
    proxies:
      - Group 3
      - Group 4
      - Group 5
      - Group 6
      - DIRECT
  - name: Group 2
    type: select
    use:
      - provider-1
    proxies:
      - Group 3
      - Group 4
      - Group 5
      - Group 6
      - DIRECT
  - name: Group 3
    type: select
    use:
      - provider-1
    proxies:
  - name: Group 4
    type: url-test
    url: http://h3.example.com/generate_204
    interval: 36000
    tolerance: 50
    use:
      - provider-1
    proxies:
  - name: Group 5
    type: fallback
    url: http://h3.example.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - provider-1
    proxies:
      - Group 4
  - name: Group 6
    type: load-balance
    url: http://h3.example.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - provider-1
    proxies:
  - name: Group 7
    type: select
    use:
      - provider-1
    proxies:
      - Group 3
      - Group 4
  - name: Group 8
    type: select
    use:
      - provider-1
    proxies:
      - Group 4
      - Group 1
      - DIRECT
  - name: Group 9
    type: select
    use:
      - provider-1
    proxies:
      - Group 3
      - Group 4
  - name: Group 10
