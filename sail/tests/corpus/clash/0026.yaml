  - {name: Group 14, type: select, proxies: [Group 15, Group 16, Group 17, Group 18, Group 19, Group 20, Group 21, Group 22, Group 23, DIRECT]}
  - {name: Group 15, type: select, proxies: [Group 24, Group 33, Group 42]}
  - {name: Group 16, type: select, proxies: [Group 25, Group 34, Group 43]}
  - {name: Group 17, type: select, proxies: [Group 26, Group 35, Group 44]}
