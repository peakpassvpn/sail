port: 7890
socks-port: 7891
mixed-port: 7892
redir-port: 7893
tproxy-port: 7894
unified-delay: true
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome
allow-lan: true
mode: rule
log-level: info
ipv6: true
udp: true
external-controller: 0.0.0.0:9090
geox-url:
  mmdb: 'https://h2.example.com/p23.mmdb'
  asn: 'https://h2.example.com/p24.mmdb'
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.d1.example
  skip-domain:
    - str1
tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - "*"
    - +.d2.example
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.2
  nameserver:
    - https://192.0.2.1/dns-query#h3=true
    - https://192.0.2.2/dns-query#h3=true
anchor-1: &a1 {type: http, interval: 3600, health-check: {enable: true, url: 'http://h1.example.com', interval: 6}}
proxy-providers:
  provider-1:
    url: 'str2'
    <<: *a1
    path: './path-1.yaml'
    override:
      additional-prefix: "str3"
  provider-2:
    url: 'str4'
    <<: *a1
    path: './path-2.yaml'
    override:
      additional-prefix: "str5"
anchor-2: &a5 'Proxy [0-9]+|Group 3'
anchor-3: &a6 'Proxy [0-9]+|Group 4'
anchor-4: &a7 'Proxy [0-9]+|Group 5'
anchor-5: &a8 'Proxy [0-9]+|Group 6'
anchor-6: &a9 'Proxy [0-9]+|Group 7'
anchor-7: &a10 'Proxy [0-9]+|Group 8'
anchor-8: &a11 'Proxy [0-9]+|Group 9'
anchor-9: &a12 'Proxy [0-9]+|Group 10'
anchor-10: &a13 'Proxy [0-9]+|Group 11'
anchor-11: &a2 'Proxy [0-9]+|Group 1'
anchor-12: &a3 'Proxy [0-9]+|Group 2'
anchor-13: &a4 {type: url-test, interval: 6, tolerance: 20, lazy: true, url: 'http://h1.example.com', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: true, include-all-providers: true}
anchor-14: &a14 {type: fallback, interval: 6, lazy: true, url: 'http://h1.example.com', disable-udp: false, timeout: 2000, max-failed-times: 3, hidden: true, include-all-providers: true}
anchor-15: &a15 {type: load-balance, interval: 6, lazy: true, url: 'http://h1.example.com', disable-udp: false, strategy: consistent-hashing, timeout: 2000, max-failed-times: 3, hidden: true, include-all-providers: true}
anchor-16: &a16 {type: http, behavior: classical, interval: 3600, format: yaml, proxy: DIRECT}
proxy-groups:
  - {name: Group 1, type: select, include-all-providers: true, filter: *a2, proxies: [DIRECT, Group 2]}
  - {name: Group 2, type: select, include-all-providers: true, filter: *a3}
  - {name: Group 3, type: select, include-all-providers: true, filter: *a3, proxies: [DIRECT]}
  - {name: Group 4, type: select, include-all-providers: true, filter: *a3}
  - {name: Group 5, type: select, include-all-providers: true, filter: *a3}
  - {name: Group 6, type: select, proxies: [Group 15, Group 16, Group 17, Group 18, Group 19, Group 20, Group 21, Group 22, Group 23]}
  - {name: Group 7, type: select, proxies: [DIRECT, Group 15, Group 16, Group 17, Group 18, Group 19, Group 20, Group 21, Group 22, Group 23]}
  - {name: Group 8, type: select, proxies: [DIRECT, Group 15, Group 16, Group 17, Group 18, Group 19, Group 20, Group 21, Group 22, Group 23]}
