port: 7890
socks-port: 7891
redir-port: 7892
allow-lan: false
mode: Rule
log-level: info
external-controller: '0.0.0.0:9090'
secret: ''
proxies:
  - name: Proxy 1
    type: vmess
    server: s1.example.net
    port: 443
    uuid: 00005a11-0000-4000-8000-000000000001
    alterId: 0
    cipher: auto
    tls: true
    network: ws
    ws-opts:
      path: /p1
  - name: Proxy 2
    type: vmess
    server: s2.example.net
    port: 443
    uuid: 00005a11-0000-4000-8000-000000000002
    alterId: 0
    cipher: auto
    tls: true
    network: ws
    ws-opts:
      path: /p2
  - name: Proxy 3
    type: vmess
    server: s3.example.net
    port: 443
    uuid: 00005a11-0000-4000-8000-000000000003
    alterId: 0
    cipher: auto
    tls: true
    network: ws
    ws-opts:
      path: /p3
  - name: Proxy 4
    type: ss
    server: 192.0.2.1
    port: 1499
    cipher: chacha20-ietf-poly1305
    password: password1
  - name: Proxy 5
    type: ss
    server: 192.0.2.2
    port: 35030
    cipher: chacha20-ietf-poly1305
    password: password2
  - name: Proxy 6
    type: ss
    server: 192.0.2.3
    port: 47695
    cipher: chacha20-ietf-poly1305
    password: password3
  - name: Proxy 7
    type: ss
    server: 192.0.2.4
    port: 26578
    cipher: chacha20-ietf-poly1305
    password: password4
  - name: Proxy 8
    type: ss
    server: 192.0.2.5
    port: 5307
    cipher: chacha20-ietf-poly1305
    password: password5
  - name: Proxy 9
    type: ss
    server: 192.0.2.6
    port: 50011
    cipher: aes-256-cfb
    password: password6
    protocol: auth_sha1_v4
    obfs: http_simple
  - name: Proxy 10
    type: ss
    server: 192.0.2.7
    port: 50011
    cipher: aes-256-cfb
    password: password6
    protocol: auth_sha1_v4
    obfs: http_simple
  - name: Proxy 11
    type: ss
    server: 192.0.2.8
    port: 50011
    cipher: aes-256-cfb
    password: password6
    protocol: auth_sha1_v4
    obfs: http_simple
  - name: Proxy 12
    type: ss
    server: 192.0.2.9
    port: 50011
    cipher: aes-256-cfb
    password: password6
    protocol: auth_sha1_v4
    obfs: http_simple
  - name: Proxy 13
    type: ss
    server: 192.0.2.10
    port: 50011
    cipher: aes-256-cfb
    password: password7
    protocol: auth_sha1_v4
    obfs: http_simple
  - name: Proxy 14
    type: ss
    server: 192.0.2.11
    port: 50011
    cipher: aes-256-cfb
    password: password7
    protocol: auth_sha1_v4
    obfs: http_simple
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
      - Proxy 3
      - Proxy 5
      - Proxy 6
      - Proxy 7
      - Proxy 4
      - Proxy 8
