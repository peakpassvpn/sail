  - IP-CIDR,192.0.2.2/32,Group 1
  - IP-CIDR,192.0.2.3/32,Group 1
  - IP-CIDR,192.0.2.4/32,Group 1
  - IP-CIDR,192.0.2.5/32,Group 1
  - IP-CIDR,192.0.2.6/32,Group 1
  - IP-CIDR,192.0.2.7/32,Group 1
  - IP-CIDR,192.0.2.8/32,Group 1
  - IP-CIDR,192.0.2.9/32,Group 1
  - IP-CIDR,192.0.2.10/32,Group 1
  - IP-CIDR,192.0.2.11/32,Group 1
  - IP-CIDR,192.0.2.12/32,Group 1
