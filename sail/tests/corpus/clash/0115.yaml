mixed-port: 7890
allow-lan: true
mode: Rule
log-level: info
external-controller: '127.0.0.1:9090'
proxies:
  - name: Proxy 1
    type: http
    server: 127.0.0.1
    port: "11685"
    skip-cert-verify: true
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Proxy 1
      - DIRECT
rules:
  - DOMAIN,d1.example,Group 1
  - DOMAIN,d2.example,Group 1
  - DOMAIN,d3.example,Group 1
  - DOMAIN,d4.example,Group 1
  - DOMAIN,d5.example,Group 1
  - DOMAIN,d6.example,Group 1
