proxy-providers:
  provider-1:
    type: http
    url: "https://192.0.2.1:9000/p1?token=v1"
    path: ./path-1.yaml
    interval: 86400
    filter: "Proxy [0-9]+|Group 1"
    exclude-filter: "Proxy [0-9]+|Group 2"
    health-check:
      enable: true
      url: https://h1.example.com/generate_204
      interval: 600
    override:
      additional-prefix: "str1"
      additional-suffix: "str2"
  provider-2:
    type: http
    url: "https://h2.example.com/p2?token=v2"
    path: ./path-2.yaml
    interval: 86400
    filter: "Proxy [0-9]+|Group 1"
    exclude-filter: "Proxy [0-9]+|Group 2"
    health-check:
      enable: true
      url: https://h1.example.com/generate_204
      interval: 600
    override:
      additional-prefix: "str3"
      additional-suffix: "str4"
proxy-groups:
  - {name: Group 1, type: select, proxies: [Group 22, Group 23, Group 24, Group 25, Group 26]}
  - {name: Group 2, type: select, proxies: [Group 21, Group 1, Group 22, Group 23, Group 24, Group 25, Group 26]}
  - {name: Group 3, type: select, proxies: [Group 1, Group 22, Group 23, Group 24, Group 25, Group 26]}
  - {name: Group 4, type: select, proxies: [Group 21, Group 1]}
  - {name: Group 5, type: select, proxies: [Group 21, Group 1]}
  - {name: Group 6, type: select, proxies: [Group 21, Group 1]}
  - {name: Group 7, type: select, proxies: [Group 21, Group 1]}
  - {name: Group 8, type: select, proxies: [Group 21, Group 1]}
  - {name: Group 9, type: select, proxies: [Group 1, Group 22, Group 23, Group 24, Group 25, Group 26]}
  - {name: Group 10, type: select, proxies: [Group 1, Group 22, Group 23, Group 24, Group 25, Group 26]}
  - {name: Group 11, type: select, proxies: [Group 21, Group 1]}
  - {name: Group 12, type: select, proxies: [Group 21, Group 1]}
  - {name: Group 13, type: select, proxies: [Group 1, Group 21]}
  - {name: Group 14, type: select, proxies: [Group 1, Group 22, Group 23, Group 24, Group 25, Group 26]}
  - {name: Group 15, type: select, proxies: [Group 21], hidden: true}
  - {name: Group 16, type: select, proxies: [Group 21], hidden: true}
  - {name: Group 17, type: select, proxies: [Group 1, Group 22, Group 23, Group 24, Group 25, Group 26, Group 21]}
  - {name: Group 18, type: select, proxies: [Group 19, Group 20]}
  - {name: Group 19, type: select, proxies: [REJECT], hidden: true}
  - {name: Group 20, type: select, proxies: [PASS], hidden: true}
  - {name: Group 21, type: select, proxies: [DIRECT], hidden: true}
  - {name: Group 22, type: url-test, tolerance: 50, use: [provider-1, provider-2], filter: "Proxy [0-9]+|Group 3"}
  - {name: Group 23, type: load-balance, strategy: consistent-hashing, use: [provider-1, provider-2], filter: "Proxy [0-9]+|Group 4"}
  - {name: Group 24, type: url-test, tolerance: 50, include-all-providers: true, filter: "Proxy [0-9]+|Group 5"}
  - {name: Group 25, type: url-test, tolerance: 50, use: [provider-1, provider-2], filter: "Proxy [0-9]+|Group 6"}
  - {name: Group 26, type: url-test, tolerance: 100, use: [provider-1, provider-2], filter: "Proxy [0-9]+|Group 7"}
