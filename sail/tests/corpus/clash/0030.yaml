mixed-port: 7890
external-controller: 127.0.0.1:9090
allow-lan: false
mode: rule
log-level: debug
ipv6: true
dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  nameserver:
    - 192.0.2.1
    - 192.0.2.2
    - 192.0.2.3
proxies:
  - name: Proxy 1
    type: vless
    server: str1
    port: 443
    uuid: 00005a11-0000-4000-8000-000000000001
    network: tcp
    tls: true
    udp: true
    xudp: true
    flow: xtls-rprx-vision
    servername: sni1.example.org
    reality-opts:
      public-key: "password1"
      short-id: "str2"
    client-fingerprint: chrome
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Proxy 1
rules:
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Group 1
