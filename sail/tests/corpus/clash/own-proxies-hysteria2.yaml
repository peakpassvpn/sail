mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
proxies:
  - { name: hy2, type: hysteria2, server: s1.example.net, port: 443, password: a synthetic password, up: 50, down: 200, obfs: salamander, obfs-password: a synthetic obfs password, sni: server.example.com, alpn: [h3] }
proxy-groups:
  - name: PROXY
    type: select
    proxies: [hy2, DIRECT]
rules:
  - MATCH,PROXY
