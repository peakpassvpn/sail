port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: :9090
proxy-groups:
  - name: Group 1
    type: url-test
    url: http://h1.example.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - provider-1
  - name: Group 2
    type: url-test
    url: http://h1.example.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - provider-2
      - provider-3
      - provider-4
      - provider-5
proxy-providers:
  provider-1:
    type: http
    url: "https://h2.example.com/p1.yaml"
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 600
      url: http://h1.example.com/generate_204
  provider-2:
    type: http
    url: "https://h2.example.com/p2.yaml"
    path: ./path-2.yaml
    health-check:
      enable: true
      interval: 600
      url: http://h1.example.com/generate_204
  provider-3:
