    url: "https://h2.example.com/p3.yaml"
    path: ./path-3.yaml
    health-check:
      enable: true
      interval: 600
      url: http://h1.example.com/generate_204
  provider-4:
    type: http
    url: "https://h2.example.com/p4.yaml"
    path: ./path-4.yaml
    health-check:
      enable: true
      interval: 600
      url: http://h1.example.com/generate_204
  provider-5:
    type: http
    url: "https://h2.example.com/p5.yaml"
    path: ./path-5.yaml
    health-check:
      enable: true
      interval: 600
      url: http://h1.example.com/generate_204
