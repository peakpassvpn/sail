mode: rule
log-level: warning
ipv6: true
find-process-mode: always
unified-delay: true
tcp-concurrent: true
external-controller: localhost:9090
external-ui: ./path-2
external-ui-url: "https://h3.example.com/p18.zip"
profile:
  store-selected: true
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
dns:
  enable: true
  ipv6: true
  cache-algorithm: arc
  listen: :53
  enhanced-mode: redir-host
proxies:
  - name: Proxy 1
    type: direct
    udp: true
proxy-providers:
  provider-1:
    type: file
    path: ./path-1.yaml
    health-check:
      enable: true
      url: https://h1.example.com/generate_204
      interval: 86400
anchor-1:
  all-proxies: &a1
    type: select
    include-all-providers: true
  default-proxies: &a2
    type: select
    include-all-providers: true
    proxies: [Group 1, Group 3, Group 4, Group 5, Group 6, Group 7, Proxy 1]
proxy-groups:
  - name: Group 1
    icon: https://h2.example.com/p1.png
    type: select
    proxies: [Group 2, Group 3, Group 4, Group 5, Group 6, Group 7, Proxy 1]
  - name: Group 2
    icon: https://h2.example.com/p2.png
    type: url-test
    include-all-providers: true
  - name: Group 3
    icon: https://h2.example.com/p3.png
    <<: *a1
    filter: "Proxy [0-9]+|Group 1"
  - name: Group 4
    icon: https://h2.example.com/p4.png
    <<: *a1
    filter: "Proxy [0-9]+|Group 2"
  - name: Group 5
    icon: http://h2.example.com/p5.png
    <<: *a1
    filter: "Proxy [0-9]+|Group 3"
  - name: Group 6
    icon: https://h2.example.com/p6.png
    <<: *a1
    filter: "Proxy [0-9]+|Group 4"
  - name: Group 7
    icon: https://h2.example.com/p7.png
    <<: *a1
    filter: "Proxy [0-9]+|Group 5"
  - name: Group 8
    icon: https://h2.example.com/p8.png
    <<: *a2
  - name: Group 9
    icon: https://h2.example.com/p9.png
    <<: *a1
    proxies: [Proxy 1, Group 1, Group 3, Group 4, Group 5, Group 6, Group 7]
  - name: Group 10
    icon: https://h2.example.com/p10.png
    <<: *a1
    proxies: [Group 5, Group 1, Group 3, Group 4, Group 6, Group 7, Proxy 1]
  - name: GLOBAL
    icon: https://h2.example.com/p11.png
    type: select
    include-all-providers: true
    proxies: [Group 1, Group 2, Group 3, Group 4, Group 5, Group 6, Group 7, Proxy 1]
anchor-2:
  domain: &a3 {type: http, interval: 86400, behavior: domain, format: mrs}
  cidr: &a4 {type: http, interval: 86400, behavior: ipcidr, format: mrs}
rule-providers:
  set-1:
    <<: *a3
    url: "https://h2.example.com/p12.mrs"
  set-2:
    <<: *a3
    url: "https://h2.example.com/p13.mrs"
  set-3:
    <<: *a3
    url: "https://h2.example.com/p14.mrs"
  set-4:
    <<: *a3
    url: "https://h2.example.com/p15.mrs"
  set-5:
    <<: *a4
    url: "https://h2.example.com/p16.mrs"
  set-6:
    <<: *a4
    url: "https://h2.example.com/p17.mrs"
rules:
  - PROCESS-NAME,app1.exe,DIRECT
  - PROCESS-NAME,app2.exe,DIRECT
  - PROCESS-NAME,app3.exe,DIRECT
  - PROCESS-NAME,app4.exe,Group 10
  - PROCESS-NAME,app5.exe,Group 10
  - PROCESS-NAME,app6.exe,Group 10
  - RULE-SET,set-2,Group 8
  - RULE-SET,set-3,DIRECT
  - RULE-SET,set-6,DIRECT,no-resolve
  - RULE-SET,set-1,DIRECT
  - RULE-SET,set-5,DIRECT,no-resolve
  - RULE-SET,set-4,Group 9
  - MATCH,Group 1
