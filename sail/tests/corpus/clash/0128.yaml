port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Group 2
      - DIRECT
      - Group 3
      - Group 4
      - Group 5
  - name: Group 2
    type: url-test
    url: http://h1.example.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - Group 3
      - Group 4
      - Group 5
  - name: Group 3
    type: url-test
    url: http://h1.example.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - provider-1
  - name: Group 4
    type: url-test
    url: http://h1.example.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - provider-3
  - name: Group 5
    type: url-test
    url: http://h1.example.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - provider-5
  - name: Group 6
    type: select
    proxies:
      - DIRECT
      - Group 1
  - name: Group 7
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: Group 8
    type: select
    proxies:
      - Group 1
      - Group 6
      - Group 3
      - Proxy 1
      - Group 4
      - Proxy 2
      - Group 5
  - name: Group 9
    type: select
    proxies:
      - Group 1
      - Group 3
      - Proxy 1
      - Group 4
      - Proxy 2
      - Group 5
      - Proxy 3
    use:
      - provider-8
  - name: Group 10
    type: select
    proxies:
      - Group 1
      - Group 3
      - Proxy 1
      - Group 4
      - Proxy 2
      - Group 5
      - Proxy 3
    use:
      - provider-9
  - name: Group 11
    type: select
    proxies:
      - Group 1
      - Group 3
      - Proxy 1
      - Group 4
      - Proxy 2
      - Group 5
      - Proxy 3
    use:
      - provider-7
proxy-providers:
  provider-1:
    type: http
    url: https://h2.example.com/p1.txt
    interval: 3600
    path: ./path-1.yaml
    health-check:
      enable: true
      interval: 600
      url: http://h1.example.com/generate_204
