port: 7890
socks-port: 7891
redir-port: 7892
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  enhanced-mode: fake-ip
  listen: 127.0.0.1:53
  nameserver:
    - 192.0.2.1
    - 192.0.2.2
    - 192.0.2.3
    - tls://h1.example.com:853
  fallback:
    - tls://h1.example.com:853
    - tls://192.0.2.4:853
    - tls://h2.example.com:853
    - tls://h1.example.com:853
cfw-conn-break-strategy:
  proxy: Proxy 2
  profile: true
  mode: true
cfw-latency-timeout: 5000
cfw-bypass:
  - d1.example
  - d2.example
  - '*.d3.example'
proxies:
  - name: Proxy 1
    type: socks5
    server: 127.0.0.1
    port: 1080
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Proxy 1
rules:
  - 'MATCH,DIRECT'
