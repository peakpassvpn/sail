mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
proxies:
  - { name: vmess, type: vmess, server: s1.example.net, port: 443, uuid: 1b0e0a3e-1c2d-4e5f-8a9b-0c1d2e3f4a5b, alterId: 0, cipher: auto, udp: true, tls: true, servername: server.example.com, network: ws, ws-opts: { path: /ws, headers: { Host: server.example.com } } }
proxy-groups:
  - name: PROXY
    type: select
    proxies: [vmess, DIRECT]
rules:
  - MATCH,PROXY
