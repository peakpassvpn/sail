mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'
dns:
  enable: true
  ipv6: false
  default-nameserver: [192.0.2.1, 192.0.2.2]
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  nameserver: ['https://h1.example.com/dns-query', 'https://h2.example.com/dns-query']
  fallback: ['https://h3.example.com/dns-query', 'https://h4.example.com/dns-query', 'https://h5.example.com/dns-query', 'tls://192.0.2.3:853']
  fallback-filter: {geoip: true, ipcidr: [240.0.0.0/4, 0.0.0.0/32]}
proxies:
  - {name: 'Proxy 1', type: trojan, server: str1, port: str2, password: password1, udp: true, sni: str1, skip-cert-verify: true}
  - {name: 'Proxy 2', type: vmess, server: str1, port: str2, uuid: 00005a11-0000-4000-8000-000000000001, alterId: 0, cipher: auto, udp: true, tls: true, network: tcp, sni: str1, skip-cert-verify: true}
proxy-groups:
  - {name: Group 1, type: select, proxies: [Group 2, Group 3, 'Proxy 1', 'Proxy 2']}
  - {name: Group 2, type: url-test, proxies: ['Proxy 1', 'Proxy 2'], url: 'http://h6.example.com/generate_204', interval: 86400}
  - {name: Group 3, type: fallback, proxies: ['Proxy 1', 'Proxy 2'], url: 'http://h6.example.com/generate_204', interval: 7200}
