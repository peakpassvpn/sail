    proxies:
      - Group 10
      - Group 11
      - Group 9
      - Proxy 1
      - Proxy 2
      - Proxy 3
      - Proxy 4
      - Proxy 5
      - Proxy 6
      - Proxy 7
      - DIRECT
      - REJECT
    url: 'http://h3.example.com/generate_204'
    interval: 300
  - name: "Group 6"
    type: select
    strategy: round-robin
    disable-udp: false
    proxies:
      - Group 10
      - Group 11
      - Group 9
      - REJECT
    url: 'http://h3.example.com/generate_204'
    interval: 300
  - name: "Group 7"
    type: select
    proxies:
      - Group 10
      - Group 11
      - Group 9
      - REJECT
    url: 'http://h3.example.com/generate_204'
    interval: 300
  - name: "Group 8"
    type: select
    proxies:
      - Group 10
      - Group 11
      - Group 9
      - REJECT
    url: 'http://h3.example.com/generate_204'
    interval: 300
  - name: "Group 9"
    type: fallback
    strategy: round-robin
    disable-udp: false
    proxies:
      - Proxy 1
      - Proxy 2
      - Proxy 3
      - Proxy 4
      - Proxy 5
      - Proxy 6
      - Proxy 7
    url: 'http://h3.example.com/generate_204'
    interval: 300
  - name: "Group 10"
    type: url-test
    strategy: round-robin
    disable-udp: false
    proxies:
      - Proxy 1
      - Proxy 2
      - Proxy 3
      - Proxy 4
      - Proxy 5
      - Proxy 6
      - Proxy 7
    url: 'http://h3.example.com/generate_204'
    interval: 300
  - name: "Group 11"
    type: load-balance
    strategy: round-robin
    disable-udp: false
    proxies:
      - Proxy 1
      - Proxy 2
      - Proxy 3
      - Proxy 4
      - Proxy 5
      - Proxy 6
      - Proxy 7
    url: 'http://h3.example.com/generate_204'
    interval: 300
  - name: "Group 12"
    type: url-test
    proxies:
      - Group 1
      - Group 2
      - Group 3
      - Group 4
      - Group 5
      - Group 6
      - Group 7
      - Group 8
      - Group 10
      - Group 11
      - Group 9
    url: 'http://h3.example.com/generate_204'
    interval: 300
