port: 7890
socks-port: 7891
allow-lan: true
dns:
  enable: true
  ipv6: false
  use-host: true
  enhanced-mode: fake-ip
  listen: 0.0.0.0:7874
  nameserver:
    - 192.0.2.1
    - 192.0.2.2
    - https://h1.example.com/dns-query
  fallback:
    - 192.0.2.3
    - 192.0.2.4
    - https://h2.example.com/dns-query
    - 192.0.2.5
  default-nameserver:
    - 192.0.2.1
    - 192.0.2.3
    - 192.0.2.5
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
experimental:
  ignore-resolve-fail: true
hosts:
  d1.example: 192.0.2.6
proxies:
  - name: Proxy 1
    server: 192.0.2.7
    port: 443
    type: vmess
    uuid: 00005a11-0000-4000-8000-000000000001
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: sni2.example.org
    network: ws
    ws-opts:
      path: /p1
      headers:
        Host: sni2.example.org
    udp: true
  - name: Proxy 2
    server: s3.example.net
    port: 80
    type: vmess
    uuid: 00005a11-0000-4000-8000-000000000002
    alterId: 0
    cipher: auto
    tls: false
    skip-cert-verify: true
    servername: sni4.example.org
    network: ws
    ws-opts:
      path: /p1
      headers:
        Host: sni4.example.org
    udp: true
  - name: Proxy 3
    server: 192.0.2.7
    port: 443
    type: vmess
    uuid: 00005a11-0000-4000-8000-000000000001
    alterId: 0
    cipher: auto
    network: grpc
    tls: true
    servername: sni2.example.org
    skip-cert-verify: true
    grpc-opts:
      grpc-service-name: str1
  - name: Proxy 4
    server: 192.0.2.7
    port: 443
    type: vless
    uuid: 00005a11-0000-4000-8000-000000000003
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: sni5.example.org
    network: ws
    ws-opts:
      path: /p2
      headers:
        Host: sni5.example.org
    udp: true
  - name: Proxy 5
    server: 192.0.2.7
    port: 443
    type: vless
    uuid: 00005a11-0000-4000-8000-000000000003
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: sni6.example.org
    network: ws
    ws-opts:
      path: /p2
      headers:
        Host: sni6.example.org
    udp: true
  - name: Proxy 6
    server: 192.0.2.7
    port: 443
    type: vless
    uuid: 00005a11-0000-4000-8000-000000000004
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: sni7.example.org
    network: ws
    ws-opts:
      path: /p2
      headers:
        Host: sni7.example.org
    udp: true
  - name: Proxy 7
    server: 192.0.2.7
    port: 443
    type: vless
    uuid: 00005a11-0000-4000-8000-000000000005
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: sni8.example.org
    network: ws
    ws-opts:
      path: /p3
      headers:
        Host: sni8.example.org
    udp: true
proxy-groups:
  - name: "Group 1"
    type: select
    strategy: round-robin
    disable-udp: false
    proxies:
      - Proxy 1
      - Proxy 2
      - Proxy 3
      - Proxy 4
      - Proxy 5
      - Proxy 6
      - Proxy 7
      - DIRECT
  - name: "Group 2"
    type: select
    strategy: round-robin
    disable-udp: false
    proxies:
      - Group 10
      - Group 11
      - Group 9
      - Proxy 1
      - Proxy 2
      - Proxy 3
      - Proxy 4
      - Proxy 5
      - Proxy 6
      - Proxy 7
      - DIRECT
    url: 'http://h3.example.com/generate_204'
    interval: 300
  - name: "Group 3"
    type: select
    strategy: round-robin
    disable-udp: false
    proxies:
      - Group 10
      - Group 11
      - Group 9
      - Proxy 1
      - Proxy 2
      - Proxy 3
      - Proxy 4
      - Proxy 5
      - Proxy 6
      - Proxy 7
      - DIRECT
      - REJECT
    url: 'http://h3.example.com/generate_204'
    interval: 300
  - name: "Group 4"
    type: select
    strategy: round-robin
    disable-udp: false
    proxies:
      - Group 10
      - Group 11
      - Group 9
      - Proxy 1
      - Proxy 2
      - Proxy 3
      - Proxy 4
      - Proxy 5
      - Proxy 6
      - Proxy 7
      - DIRECT
      - REJECT
    url: 'http://h3.example.com/generate_204'
    interval: 300
  - name: "Group 5"
