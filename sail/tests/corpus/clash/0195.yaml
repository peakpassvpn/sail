port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
experimental:
  ignore-resolve-fail: true
hosts:
  d1.example: 192.0.2.1
proxies:
  - name: Proxy 1
    type: socks5
    server: s2.example.net
    port: 4900
    username: user1
    password: password1
  - name: Proxy 2
    type: socks5
    server: s3.example.net
    port: 4900
    username: user2
    password: password1
proxy-groups:
  - name: Group 1
    type: select
    proxies:
      - Proxy 1
      - Proxy 2
      - DIRECT
rules:
  - DOMAIN-KEYWORD,kw1,DIRECT
  - DOMAIN-SUFFIX,d4.example,DIRECT
  - DOMAIN-SUFFIX,d5.example,DIRECT
  - DOMAIN-SUFFIX,d6.example,DIRECT
