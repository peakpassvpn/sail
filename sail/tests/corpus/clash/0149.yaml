    url: https://h1.example.com/generate_204
  - name: Group 2
    proxies:
      - Group 1
      - Proxy 1
      - Proxy 2
      - Proxy 3
      - Proxy 4
      - Proxy 5
      - Proxy 6
      - Proxy 7
      - Proxy 8
