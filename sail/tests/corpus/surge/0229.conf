[General]
loglevel = notify
dns-server = 192.0.2.1, 192.0.2.2, 192.0.2.3, 192.0.2.4
skip-proxy = localhost, *.d1.example, d2.example, d3.example, 0.0.0.0/8
exclude-simple-hostnames = true
show-error-page-for-reject = true
ipv6 = true
internet-test-url = http://h1.example.com/generate_204
proxy-test-url = http://h2.example.com/generate_204
test-timeout = 3
tls-provider = default
http-api = password1@0.0.0.0:6171
http-api-web-dashboard = true
external-controller-access = password2@0.0.0.0:6165
http-listen = 0.0.0.0
socks5-listen = 0.0.0.0
[Proxy]
#!include ./path-1.dconf
[Proxy Group]
Group 1 = select, Group 8, Proxy 1, Group 7, Group 9, Group 10
Group 2 = select, DIRECT, Group 1, Group 7, Proxy 1, Group 9, Group 8
Group 3 = select, Group 1, Group 7, Group 8, Proxy 1, Group 9, Group 10
Group 4 = select, Group 1, DIRECT, Group 7, Group 8, Proxy 1, Group 9, Group 10
Group 5 = select, Group 7, DIRECT, Group 8, Proxy 1, Group 1, Group 9, Group 10
Group 6 = select, , Group 7, Group 8, Proxy 1, Group 9, Group 10
Group 7 = url-test, 
Group 8 = url-test, 
Group 9 = url-test, 
Group 10 = select, 
[Rule]
DOMAIN-SUFFIX,d4.example,DIRECT
RULE-SET,https://h3.example.com/p1.list,REJECT
RULE-SET,https://h3.example.com/p2.list,REJECT
RULE-SET,https://h3.example.com/p3.list,Group 1
RULE-SET,https://h3.example.com/p4.list,Group 7
RULE-SET,https://h3.example.com/p5.list,Group 6
DOMAIN,d5.example,DIRECT
RULE-SET,https://h3.example.com/p6.list,Group 7
RULE-SET,https://h3.example.com/p7.list,DIRECT
RULE-SET,https://h3.example.com/p8.list,Group 5
GEOIP,CN,DIRECT
RULE-SET,https://h3.example.com/p9.list,DIRECT
RULE-SET,LAN,DIRECT
RULE-SET,https://h3.example.com/p10.list,Group 1
RULE-SET,https://h3.example.com/p11.list,Group 1
RULE-SET,https://h3.example.com/p12.list,DIRECT
RULE-SET,https://h3.example.com/p13.list,Group 1
RULE-SET,https://h3.example.com/p14.list,Group 3
RULE-SET,https://h3.example.com/p15.list,Group 3
RULE-SET,https://h3.example.com/p16.list,Group 4
RULE-SET,https://h3.example.com/p17.list,Group 4
RULE-SET,https://h3.example.com/p18.list,Group 4
RULE-SET,https://h3.example.com/p19.list,Group 4
DOMAIN-SUFFIX,d6.example,Group 7
DOMAIN-SUFFIX,d7.example,Group 1
DOMAIN-SUFFIX,d8.example,Group 7
RULE-SET,https://h3.example.com/p20.list,Proxy 2
RULE-SET,https://h3.example.com/p21.list,Group 1
DOMAIN-SUFFIX,d9.example,Group 1
DOMAIN,d10.example,Group 1
DOMAIN-SUFFIX,d11.example,Group 1
DOMAIN-SUFFIX,d4.example,DIRECT
DOMAIN-SUFFIX,d12.example,Group 1
RULE-SET,https://h3.example.com/p22.list,Group 1
DOMAIN-SUFFIX,d13.example,DIRECT
RULE-SET,https://h3.example.com/p23.list,DIRECT
RULE-SET,https://h3.example.com/p24.list,DIRECT
RULE-SET,https://h3.example.com/p25.list,DIRECT
FINAL,Group 2,dns-failed
[URL Rewrite]
^https?://r1\.example\.com/ https://h4.example.com 302
[Snell Server]
interface = 0.0.0.0
port = 6160
psk = password3
obfs = off
