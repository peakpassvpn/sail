[General]
loglevel = warning
encrypted-dns-server = https://h1.example.com/dns-query, https://h2.example.com/dns-query
dns-server = 192.0.2.1, 192.0.2.2, 192.0.2.3, 192.0.2.4, system
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
internet-test-url = http://h3.example.com/generate_204
proxy-test-url = http://h4.example.com/generate_204
test-timeout = 3
allow-wifi-access = true
exclude-simple-hostnames = true
use-default-policy-if-wifi-not-primary = false
ipv6 = false
geoip-maxmind-url = https://h5.example.com/p1.mmdb
ipv6-vif = disabled
[Proxy Group]
Group 1 = select, Group 22, DIRECT, Group 15, Group 16, Group 17, Group 18, Group 19, Group 20, Group 21, update-interval=36000, no-alert=0, hidden=0, include-all-proxies=0, persistent=1, include-other-group=Group 2
Group 2 = select, policy-path=https://h6.example.com/p2?token=v1, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0
Group 3 = select, REJECT, no-alert=0, hidden=0, include-all-proxies=0
Group 4 = select, DIRECT, Group 1, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Group 21, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 5 = select, DIRECT, no-alert=0, hidden=0, include-all-proxies=0
Group 6 = select, Group 1, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Group 21, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 7 = select, DIRECT, Group 1, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Group 21, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 8 = select, Group 1, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Group 21, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 9 = select, Group 1, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Group 21, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 10 = select, Group 1, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Group 21, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 11 = select, Group 1, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Group 21, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 12 = select, Group 1, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Group 21, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 13 = select, Group 1, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Group 21, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 14 = select, Group 1, Group 15, Group 17, Group 16, Group 18, Group 19, Group 20, Group 21, no-alert=0, hidden=0, include-all-proxies=0
Group 15 = select, update-interval=0, policy-regex-filter=(str1), no-alert=0, hidden=1, include-all-proxies=0, include-other-group=Group 2
Group 16 = select, policy-regex-filter=(str2), no-alert=0, hidden=1, include-all-proxies=0, include-other-group=Group 2
Group 17 = select, policy-regex-filter=(str3), no-alert=0, hidden=1, include-all-proxies=0, include-other-group=Group 2
Group 18 = select, policy-regex-filter=(str4), no-alert=0, hidden=1, include-all-proxies=0, include-other-group=Group 2
Group 19 = select, policy-regex-filter=(str5), no-alert=0, hidden=1, include-all-proxies=0, include-other-group=Group 2
Group 20 = select, policy-regex-filter=(str6), no-alert=0, hidden=1, include-all-proxies=0, include-other-group=Group 2
Group 21 = select, DIRECT, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=Group 2, policy-regex-filter=Proxy [0-9]+|Group 1
Group 22 = url-test, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 23 = select, Group 1, Group 15, Group 16, Group 17, Group 19, Group 18, Group 20, Group 21, DIRECT, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
