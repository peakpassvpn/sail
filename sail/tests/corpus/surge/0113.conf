Group 14 = select, policy-path=https://h2.example.com/p2.list, update-interval=21600
Group 15 = ssid, default=str1, cellular=str2, Proxy 1
Group 16 = url-test, policy-path=./path-2.list, url=http://h3.example.com/generate_204, interval=60, update-interval=21600, evaluate-before-use=true
