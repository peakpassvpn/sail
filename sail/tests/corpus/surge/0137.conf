DOMAIN-SET,https://h3.example.com/p4.list,Group 3
DOMAIN-SET,https://h3.example.com/p5.txt,Group 3
RULE-SET,https://h3.example.com/p6.list,Group 3
RULE-SET,https://h3.example.com/p7.list,Group 3
