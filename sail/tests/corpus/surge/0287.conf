hostname = d13.example, d14.example, d15.example, d16.example, d17.example, str6, d18.example
hostname-disabled = d16.example, d14.example, str6, d15.example, d17.example, d13.example
ca-passphrase = password1
ca-p12 = c2FpbCBjb3JwdXMgZHVtbXkgcDEy
