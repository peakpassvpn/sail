hide-vpn-icon = true
http-api = password1@0.0.0.0:2500
http-api-web-dashboard = true
encrypted-dns-server = https://h3.example.com/dns-query
[Replica]
hide-apple-request = true
hide-crashlytics-request = true
hide-udp = false
keyword-filter-type = false
[Proxy]
[Proxy Group]
Group 1 = select, Group 11, Group 5
Group 2 = select, policy-path=./path-1
Group 3 = select, policy-path=https://sub.store/p1, update-interval=0, no-alert=0, hidden=0
