Group 5 = fallback, policy-path=https://sub.store/p2, url=http://h2.example.com/generate_204, interval=600, tolerance=50, hidden=0
Group 6 = url-test, policy-path=https://sub.store/p1, policy-regex-filter=Proxy [0-9]+|Group 1, interval=200, tolerance=50, update-interval=43200, no-alert=1, hidden=0, include-all-proxies=0
Group 7 = url-test, policy-path=https://sub.store/p1, policy-regex-filter=Proxy [0-9]+|Group 2, interval=600, tolerance=50, update-interval=43200, no-alert=1, hidden=0, include-all-proxies=0
