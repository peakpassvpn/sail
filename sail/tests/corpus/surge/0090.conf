[General]
wifi-assist = true
all-hybrid = false
udp-priority = false
internet-test-url = http://h1.example.com/generate_204
proxy-test-url = http://h2.example.com/generate_204
test-timeout = 5
geoip-maxmind-url = https://h3.example.com/p1.mmdb
allow-wifi-access = false
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
http-listen = 0.0.0.0
socks5-listen = 0.0.0.0
allow-hotspot-access = true
exclude-simple-hostnames = true
read-etc-hosts = true
use-local-host-item-for-proxy = true
encrypted-dns-follow-outbound-mode = false
include-all-networks = false
include-local-networks = false
loglevel = notify
show-error-page-for-reject = true
hijack-dns = 192.0.2.1:53, 192.0.2.2:53
use-default-policy-if-wifi-not-primary = false
udp-policy-not-supported-behaviour = REJECT
ipv6 = true
ipv6-vif = true
dns-server = 192.0.2.3, 192.0.2.4, system
[Proxy]
Proxy 1 = wireguard, section-name=wg-1
[Proxy Group]
Group 1 = select, policy-path=./path-1, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=Proxy [0-9]+|Group 1
Group 2 = select, Group 1, Proxy 1, Group 7, Group 13, Group 12, Group 9, Group 14, no-alert=0, hidden=0, include-all-proxies=0
Group 3 = select, Group 11, Group 7, Group 14, no-alert=0, hidden=0, include-all-proxies=0
Group 4 = select, Group 14, Group 9, Group 12, no-alert=0, hidden=0, include-all-proxies=0
Group 5 = select, Group 2, Group 14, no-alert=0, hidden=0, include-all-proxies=0
Group 6 = select, Group 8, Group 2, no-alert=0, hidden=0, include-all-proxies=0
Group 7 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 2, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 1
Group 8 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 3, interval=600, tolerance=50, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 1
Group 9 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 4, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 1
Group 10 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 5, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 1
Group 11 = select, DIRECT, no-alert=0, hidden=0, include-all-proxies=0
Group 12 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 6, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 1
Group 13 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 7, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 1
Group 14 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 8, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 1
[Rule]
IP-CIDR,192.0.2.5/32,Proxy 1,no-resolve
DOMAIN-SET,https://h4.example.com/p2.txt,REJECT
RULE-SET,https://h3.example.com/p3.list,DIRECT
DOMAIN-SUFFIX,d1.example,Group 4
RULE-SET,https://h5.example.com/p4.conf,Group 4
RULE-SET,https://h3.example.com/p5.list,Group 3
RULE-SET,https://h3.example.com/p6.list,Group 4
RULE-SET,https://h3.example.com/p7.list,Group 2
RULE-SET,https://h3.example.com/p8.list,DIRECT
RULE-SET,LAN,DIRECT
RULE-SET,https://h3.example.com/p9.list,Group 5
RULE-SET,https://h3.example.com/p10.list,Group 6
RULE-SET,https://h3.example.com/p11.list,REJECT
FINAL,Group 2,dns-failed
[Host]
*.d2.example = server:192.0.2.6
*.d3.example = server:192.0.2.2
d4.example = 192.0.2.7
d5.example = server:192.0.2.8
d6.example = server:192.0.2.8
d7.example = server:192.0.2.8
[URL Rewrite]
^https?://r1\.example\.com/ https://h2.example.com 302
^https?://r2\.example\.com/ https://h6.example.com 302
[MITM]
skip-server-cert-verify = true
tcp-connection = true
h2 = true
