[General]
loglevel = notify
dns-server = 192.0.2.53, system
proxy-test-url = http://www.example.com/generate_204
test-timeout = 5
http-listen = 127.0.0.1:6152

[Proxy]
A = trojan, s1.example.net, 443, password=p1, sni=server.example.com

[Proxy Group]
Proxy = select, A, DIRECT

[Rule]
DOMAIN,exact.example,DIRECT
DOMAIN-SUFFIX,suffix.example,Proxy
DOMAIN-KEYWORD,keyword,Proxy
DOMAIN-WILDCARD,*.wild.example,Proxy
IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
IP-CIDR6,2001:db8::/32,DIRECT,no-resolve
SRC-IP,198.51.100.10,DIRECT
DEST-PORT,22,DIRECT
SRC-PORT,10000-20000,Proxy
IN-PORT,6152,Proxy
PROTOCOL,UDP,Proxy
USER-AGENT,ExampleApp*,Proxy
URL-REGEX,^http://plain\.example/,DIRECT
HOSTNAME-TYPE,IPv4,DIRECT
AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT
OR,((DOMAIN-SUFFIX,a.example),(DOMAIN-SUFFIX,b.example)),Proxy
NOT,((DOMAIN-SUFFIX,c.example)),Proxy
RULE-SET,https://rules.example.com/list.list,Proxy
DOMAIN-SET,https://rules.example.com/domains.txt,Proxy
FINAL,Proxy
