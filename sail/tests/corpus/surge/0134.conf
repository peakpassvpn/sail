[General]
loglevel = notify
ipv6 = true
show-error-page-for-reject = true
test-timeout = 5
internet-test-url = http://h1.example.com/p1
proxy-test-url = http://h2.example.com/generate_204
geoip-maxmind-url = https://h3.example.com/p2.mmdb
dns-server = system, 192.0.2.1, 192.0.2.2, 192.0.2.3, 192.0.2.4, 192.0.2.5
doh-server = https://h4.example.com/dns-query, https://h5.example.com/dns-query
encrypted-dns-server = https://h4.example.com/dns-query, https://h5.example.com/dns-query
skip-proxy = 127.0.0.1, localhost, *.d1.example, d2.example
exclude-simple-hostnames = true
allow-wifi-access = false
http-api = password1
http-api-tls = false
udp-policy-not-supported-behaviour = REJECT
[Proxy]
Proxy 1 = trojan, s3.example.net, 443, password=password2, sni=s3.example.net, skip-cert-verify=true, udp-relay=true, tfo=true
Proxy 2 = ss, s4.example.net, 8388, encrypt-method=aes-128-gcm, password=password3, udp-relay=true, tfo=true
Proxy 3 = vmess, s5.example.net, 443, username=user1, ws=true, ws-path=/p3, tls=true, sni=s5.example.net, skip-cert-verify=true, udp-relay=true
[Proxy Group]
