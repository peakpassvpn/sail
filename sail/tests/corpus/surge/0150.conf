Group 12 = smart, include-other-group=Group 21, policy-regex-filter=Proxy [0-9]+|Group 6, no-alert=true, hidden=true
Group 13 = smart, include-other-group=Group 22, policy-regex-filter=Proxy [0-9]+|Group 1, no-alert=true, hidden=true
