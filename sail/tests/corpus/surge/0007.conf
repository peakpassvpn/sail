[General]
loglevel = notify
show-error-page-for-reject = true
internet-test-url = http://h1.example.com/generate_204
proxy-test-url = http://h2.example.com/generate_204
test-timeout = 3
geoip-maxmind-url = https://h3.example.com/p1.mmdb
ipv6 = true
ipv6-vif = auto
allow-wifi-access = true
allow-hotspot-access = true
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
http-api-web-dashboard = true
http-api = password1@0.0.0.0:6171
http-api-tls = false
skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8, 2001:db8::/96, localhost, *.d1.example, d2.example, d3.example
dns-server = system, 192.0.2.1, 192.0.2.2, 192.0.2.3, 192.0.2.4
encrypted-dns-server = https://h4.example.com/dns-query
hijack-dns = 192.0.2.5:53, 192.0.2.6:53, 192.0.2.7:53
encrypted-dns-follow-outbound-mode = true
udp-priority = true
compatibility-mode = 0
exclude-simple-hostnames = true
udp-policy-not-supported-behaviour = reject
always-real-ip = *.d4.example, *.d5.example, d6.example, *.d7.example, *.d8.example, d9.example, d10.example, d11.example, *.d12.example, *.d13.example, d14*.example, *.d15.example, d16*.example, d17.example, d18.example, d19*.example, d20*.example, *.d21.example, *.d22.example, *.d23.example, d24.example, *.d24.example, *.d25.example, d26.example, d27.example, d28.example, d29.example, *.d30.example, d31.example, d32.example, d33.example, d34.example, *.d34.example, d35.example, d36.example, d37.example, d38.example, d39.example, d40.example, *.d41.example, *.d42.example, d42.example, d43.example, *.d44.example, *.d45.example, d46.example, d47.example, d48.example, d49.example, *.d50.example, *.d51.example, *.d52.example, *.d53.example, d54.example, *.d54.example, d55*.example, d56*.example, d57*.example, d58*.example, d59*.example, d60*.example, *.d61.example, d62*.example, d63*.example, d64*.example
always-raw-tcp-hosts = d65.example, d66*.example, d67*.example, d68*.example, d69*.example, d70*.example, d71*.example, d72*.example, d73*.example, d74*.example, d75*.example, d76*.example
[Proxy]
Proxy 1 = direct
Proxy 2 = reject
[Proxy Group]
Group 1 = select, hidden=1, policy-path=https://sub.store/p2, update-interval=3600, no-alert=0, include-all-proxies=0
Group 2 = select, Group 3, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15, Group 16
Group 3 = select, include-all-proxies=true, include-other-group=Group 1, url=http://h2.example.com/generate_204, interval=60, tolerance=30, hidden=0, evaluate-before-use=true
Group 4 = select, Group 3, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15, Group 16
Group 5 = select, Group 3, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15, Group 16
Group 6 = select, Group 3, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15, Group 16
Group 7 = select, Group 3, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15, Group 16
Group 8 = select, Group 3, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15, Group 16
Group 9 = select, Proxy 1, Group 3, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15, Group 16
Group 10 = select, include-all-proxies=true, include-other-group=Group 1, url=http://h2.example.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=Proxy [0-9]+|Group 1, evaluate-before-use=true
Group 11 = select, include-all-proxies=true, include-other-group=Group 1, url=http://h2.example.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=Proxy [0-9]+|Group 2, evaluate-before-use=true
Group 12 = select, include-all-proxies=true, include-other-group=Group 1, url=http://h2.example.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=Proxy [0-9]+|Group 3, evaluate-before-use=true
Group 13 = select, include-all-proxies=true, include-other-group=Group 1, url=http://h2.example.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=Proxy [0-9]+|Group 4, evaluate-before-use=true
Group 14 = select, include-all-proxies=true, include-other-group=Group 1, url=http://h2.example.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=Proxy [0-9]+|Group 5, evaluate-before-use=true
Group 15 = select, include-all-proxies=true, include-other-group=Group 1, url=http://h2.example.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=Proxy [0-9]+|Group 6, evaluate-before-use=true
Group 16 = url-test, include-all-proxies=true, include-other-group=Group 1, url=http://h2.example.com/generate_204, interval=60, tolerance=30, hidden=0, policy-regex-filter=Proxy [0-9]+|Group 7, evaluate-before-use=true
