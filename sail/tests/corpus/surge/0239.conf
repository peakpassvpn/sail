[General]
loglevel = notify
test-timeout = 5
internet-test-url = http://h1.example.com/generate_204
proxy-test-url = http://192.0.2.1/generate_204
udp-priority = false
udp-policy-not-supported-behaviour = REJECT
dns-server = 192.0.2.2, 192.0.2.3
ipv6 = false
ipv6-vif = disabled
hijack-dns = *:53
always-real-ip = str1, *.d1.example, *.d2.example, *.d3.example, d4.example, d5.example, d6.example, d7.example, d8.example, *.d9.example, *.d10.example, *.d11.example, d12.example
show-error-page-for-reject = true
exclude-simple-hostnames = true
always-raw-tcp-hosts = d13*.example, d14*.example
geoip-maxmind-url = https://h2.example.com/p1.mmdb
[Proxy Group]
Group 1 = select, include-all-proxies=1, icon-url=https://h2.example.com/p2.png
Group 2 = select, Group 1, Group 13, Group 14, Group 15, Group 16, Group 17, icon-url=https://h2.example.com/p3.png
Group 3 = select, Group 1, Group 13, Group 14, Group 15, Group 16, Group 17, icon-url=https://h2.example.com/p4.png
Group 4 = select, Group 1, Group 13, Group 14, Group 15, Group 16, Group 17, icon-url=https://h2.example.com/p5.png
Group 5 = select, Group 1, Group 13, Group 14, Group 15, Group 16, Group 17, icon-url=https://h2.example.com/p6.png
Group 6 = select, Group 1, Group 13, Group 14, Group 15, Group 16, Group 17, icon-url=https://h2.example.com/p7.png
Group 7 = select, Group 1, Group 13, Group 14, Group 15, Group 16, Group 17, icon-url=https://h2.example.com/p8.png
Group 8 = select, Group 1, Group 13, Group 14, Group 15, Group 16, Group 17, icon-url=https://h2.example.com/p9.png
Group 9 = select, Group 1, Group 13, Group 14, Group 15, Group 16, Group 17, icon-url=https://h2.example.com/p10.png
Group 10 = select, Group 1, Group 13, Group 14, Group 15, Group 16, Group 17, DIRECT, include-other-group=Group 1, icon-url=https://h2.example.com/p11.png
Group 11 = select, Group 1, Group 13, Group 14, Group 15, Group 16, Group 17, icon-url=https://h2.example.com/p12.png
Group 12 = select, Group 1, Group 13, Group 14, Group 15, Group 16, Group 17, DIRECT, icon-url=https://h2.example.com/p13.png
Group 13 = smart, policy-regex-filter=(str2), include-other-group=Group 1, icon-url=https://h2.example.com/p14.png
Group 14 = smart, policy-regex-filter=(str3), include-other-group=Group 1, icon-url=https://h2.example.com/p15.png
Group 15 = smart, policy-regex-filter=(str4), include-other-group=Group 1, icon-url=https://h2.example.com/p16.png
Group 16 = smart, policy-regex-filter=(str5), include-other-group=Group 1, icon-url=https://h2.example.com/p17.png
Group 17 = smart, policy-regex-filter=(str6), include-other-group=Group 1, icon-url=https://h2.example.com/p18.png
