Proxy 2 = ss, s2.example.net, 8388, encrypt-method=aes-256-gcm, password=password1
Proxy 3 = socks5, 192.0.2.1, 1080, password2, password3
Proxy 4 = socks5, 192.0.2.1, 1080, password2, password3, underlying-proxy=Proxy 1
[Proxy Group]
Group 1 = select, Group 3, Group 4, DIRECT
Group 2 = select, Group 1, DIRECT
Group 3 = select, Proxy 1
Group 4 = url-test, Proxy 4, url=http://h2.example.com/generate_204, interval=300, tolerance=100
[Rule]
RULE-SET,https://h3.example.com/p2.list,Group 1
RULE-SET,https://h3.example.com/p2.list,Group 1
GEOIP,CN,Group 2
FINAL,Group 2
