[General]
loglevel = notify
doh-server = https://h1.example.com/dns-query
dns-server = 192.0.2.1, 192.0.2.2
skip-proxy = localhost, *.d1.example, d2.example, d3.example, d4.example, d5.example, 0.0.0.0/8, 10.0.0.0/8, 240.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
wifi-assist = true
allow-wifi-access = true
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
http-listen = 0.0.0.0:6152
socks5-listen = 0.0.0.0:6153
allow-hotspot-access = true
external-controller-access = password1@0.0.0.0:6170
replica = false
tls-provider = openssl
network-framework = false
exclude-simple-hostnames = true
ipv6 = true
test-timeout = 4
proxy-test-url = http://h2.example.com/generate_204
geoip-maxmind-url = https://h3.example.com/p1.mmdb
[Replica]
hide-apple-request = true
hide-crashlytics-request = true
use-keyword-filter = false
hide-udp = false
[Proxy]
DIRECT = direct
[Proxy Group]
Group 1 = select, Group 2, Group 3
Group 2 = select, policy-path=./path-1.conf
Group 3 = select, policy-path=./path-2.conf
Group 4 = select, Group 7, Group 8, Group 9, Group 3, Group 2
Group 5 = select, Group 3, Group 2
Group 6 = select, DIRECT
Group 7 = url-test, include-other-group=Group 2, policy-regex-filter=Proxy [0-9]+|Group 1, interval=600, tolerance=100, evaluate-before-use=true, hidden=true
Group 8 = url-test, include-other-group=Group 2, policy-regex-filter=Proxy [0-9]+|Group 2, interval=600, tolerance=100, evaluate-before-use=true, hidden=true
Group 9 = url-test, include-other-group=Group 2, policy-regex-filter=Proxy [0-9]+|Group 3, interval=600, tolerance=100, evaluate-before-use=true, hidden=true
[Rule]
DOMAIN,d6.example,DIRECT
DOMAIN,d7.example,DIRECT
DOMAIN-SUFFIX,d8.example,DIRECT
DOMAIN-SUFFIX,d9.example,DIRECT
RULE-SET,./path-3.list,Group 1
RULE-SET,./path-4.list,DIRECT
RULE-SET,./path-5.list,Group 4
RULE-SET,./path-6.list,DIRECT
RULE-SET,./path-7.list,Group 5
RULE-SET,./path-8.list,REJECT
RULE-SET,./path-9.list,Group 1
DOMAIN-KEYWORD,kw1,Group 1
DOMAIN-KEYWORD,kw2,Group 1
DOMAIN-KEYWORD,kw3,Group 1
DOMAIN-KEYWORD,kw4,Group 1
DOMAIN-KEYWORD,kw5,Group 1
DOMAIN-KEYWORD,kw6,Group 1
DOMAIN-SUFFIX,d10.example,Group 1
DOMAIN-SUFFIX,d11.example,Group 1
DOMAIN-KEYWORD,kw7,Group 1
DOMAIN-KEYWORD,kw8,Group 1
DOMAIN-KEYWORD,kw9,Group 1
DOMAIN-SUFFIX,d12.example,Group 1
DOMAIN-KEYWORD,kw10,Group 1
DOMAIN-SUFFIX,d13.example,Group 1
IP-CIDR,198.18.0.0/22,Group 1,no-resolve
IP-CIDR,198.18.0.0/21,Group 1,no-resolve
IP-CIDR,198.18.4.0/22,Group 1,no-resolve
IP-CIDR,198.18.8.0/22,Group 1,no-resolve
IP-CIDR,198.18.0.0/20,Group 1,no-resolve
IP-CIDR6,2001:db8::/48,Group 1,no-resolve
IP-CIDR6,2001:db8:1::/48,Group 1,no-resolve
IP-CIDR6,2001:db8:2::/48,Group 1,no-resolve
DOMAIN-SUFFIX,d14.example,Group 1
DOMAIN-SUFFIX,d15.example,Group 1
IP-CIDR,192.0.2.3/32,Group 1,no-resolve
IP-CIDR,192.0.2.4/32,Group 1,no-resolve
IP-CIDR,192.0.2.5/32,Group 1,no-resolve
IP-CIDR,192.0.2.6/32,Group 1,no-resolve
IP-CIDR,192.0.2.7/32,Group 1,no-resolve
IP-CIDR,192.0.2.8/32,Group 1,no-resolve
IP-CIDR,192.0.2.9/32,Group 1,no-resolve
IP-CIDR,192.0.2.10/32,Group 1,no-resolve
IP-CIDR,192.0.2.11/32,Group 1,no-resolve
IP-CIDR,192.0.2.12/32,Group 1,no-resolve
IP-CIDR,198.51.100.0/24,Group 1,no-resolve
IP-CIDR,203.0.113.0/24,Group 1,no-resolve
IP-CIDR,192.0.2.0/24,Group 1,no-resolve
IP-CIDR,198.51.100.0/24,Group 1,no-resolve
IP-CIDR,203.0.113.0/24,Group 1,no-resolve
IP-CIDR,192.0.2.13/32,Group 1,no-resolve
IP-CIDR,192.0.2.14/32,Group 1,no-resolve
IP-CIDR,192.0.2.15/32,Group 1,no-resolve
RULE-SET,LAN,DIRECT
GEOIP,CN,DIRECT
FINAL,Group 1,dns-failed
[URL Rewrite]
^https?://r1\.example\.com/ https://h4.example.com 302
^https?://r2\.example\.com/ https://h5.example.com 302
