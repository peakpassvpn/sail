#!MANAGED-CONFIG https://h1.example.com/p1.conf
[General]
wifi-assist = true
udp-priority = false
loglevel = notify
show-error-page-for-reject = true
allow-wifi-access = true
allow-hotspot-access = true
all-hybrid = false
ipv6 = false
test-timeout = 5
internet-test-url = http://h2.example.com/generate_204
proxy-test-url = http://192.0.2.1/generate_204
test-timeout = 5
geoip-maxmind-url = https://h1.example.com/p2.mmdb
exclude-simple-hostnames = true
dns-server = 192.0.2.2, 192.0.2.3, system
encrypted-dns-server = quic://h3.example.com
hijack-dns = 192.0.2.4:53, 192.0.2.5:53
read-etc-hosts = true
http-api-web-dashboard = true
use-default-policy-if-wifi-not-primary = false
skip-proxy = localhost, *.d1.example, d2.example, d3.example, d4.example, d5.example, 0.0.0.0/8, 10.0.0.0/8, 240.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
exclude-simple-hostnames = true
always-real-ip = d6.example, *.d7.example, *.d8.example, *.d9.example, *.d10.example, d11*.example, *.d12.example, *.d13.example, *.d14.example, str1
disable-geoip-db-auto-update = true
[Replica]
hide-apple-request = false
hide-crash-reporter-request = true
hide-udp = false
keyword-filter-type = false
[Proxy]
Proxy 1 = direct
[Proxy Group]
Group 1 = select, Group 13, Group 15, Group 17, Group 16, Group 14, Group 20
Group 2 = select, Group 1, Group 13, Group 15, Group 17, Group 16, Group 14
Group 3 = select, Group 13, Group 15, Group 17, Group 16, Group 14
Group 4 = select, Group 13, Group 15, Group 17, Group 16, Group 14
Group 5 = select, Group 13, Group 15, Group 17, Group 16, Group 14
Group 6 = select, Proxy 1, Group 13, Group 16
Group 7 = select, Group 1, Group 13, Group 15, Group 17, Group 16, Group 14
Group 8 = select, Proxy 1, Group 13, Group 15, Group 17, Group 16, Group 14
Group 9 = select, Proxy 1, Group 1, Group 13, Group 15, Group 17, Group 16, Group 14
Group 10 = select, Proxy 1, Group 1, Group 13, Group 15, Group 17, Group 16, Group 14
Group 11 = select, Proxy 1, Group 1, Group 13, Group 15, Group 17, Group 16, Group 14
Group 12 = select, Proxy 1, Group 1, Group 13, Group 15, Group 17, Group 16, Group 14
Group 13 = smart, include-other-group=Group 20, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=Proxy [0-9]+|Group 1
Group 14 = smart, include-other-group=Group 20, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=Proxy [0-9]+|Group 2
Group 15 = smart, include-other-group=Group 20, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=Proxy [0-9]+|Group 3
Group 16 = smart, include-other-group=Group 20, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=Proxy [0-9]+|Group 4
Group 17 = smart, include-other-group=Group 20, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=(str2)
Group 18 = smart, include-other-group=Group 20, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=Proxy [0-9]+|Group 5
Group 19 = smart, include-other-group=Group 20, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=Proxy [0-9]+|Group 6
Group 20 = select, policy-path=https://sub.store/p3, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0
[Rule]
IP-CIDR,0.0.0.0/32,REJECT,no-resolve
RULE-SET,https://h1.example.com/p4.list,Group 11
RULE-SET,https://h1.example.com/p5.list,Group 9
RULE-SET,https://h1.example.com/p6.list,Group 10
RULE-SET,https://h1.example.com/p7.list,Group 2
RULE-SET,https://h1.example.com/p8.list,Group 12
RULE-SET,https://h1.example.com/p9.list,Group 12
RULE-SET,https://h1.example.com/p10.list,Group 12
RULE-SET,https://h1.example.com/p11.list,Group 12
RULE-SET,https://h1.example.com/p12.list,Group 5
RULE-SET,https://h1.example.com/p13.list,Group 3
RULE-SET,https://h1.example.com/p14.list,Group 4
RULE-SET,https://h1.example.com/p15.list,Group 6
RULE-SET,https://h1.example.com/p16.list,Group 8
RULE-SET,https://h1.example.com/p17.list,Group 7
RULE-SET,https://h1.example.com/p18.list,Group 1
RULE-SET,https://h1.example.com/p19.list,Proxy 1
RULE-SET,https://h1.example.com/p20.list,Proxy 1
FINAL,Group 1,dns-failed
