[General]
test-timeout = 10
udp-priority = false
internet-test-url = http://h1.example.com
proxy-test-url = http://h2.example.com/generate_204
geoip-maxmind-url = https://h3.example.com/p1.mmdb
ipv6 = false
dns-server = 192.0.2.1, 192.0.2.2, 192.0.2.3, 192.0.2.4, system
encrypted-dns-server = https://h4.example.com/dns-query, https://h5.example.com/dns-query
show-error-page-for-reject = true
allow-wifi-access = false
wifi-access-http-port = 6528
wifi-access-socks5-port = 6582
allow-hotspot-access = true
wifi-assist = true
http-api = password1@127.0.0.1:5208
http-api-tls = false
http-api-web-dashboard = true
use-default-policy-if-wifi-not-primary = false
all-hybrid = false
exclude-simple-hostnames = true
read-etc-hosts = true
loglevel = notify
always-real-ip = *.d1.example, *.d2.example, *.d3.example, *.d4.example, d5*.example, *.d6.example, *.d7.example, *.d8.example, d9.example
disable-geoip-db-auto-update = true
udp-policy-not-supported-behaviour = reject
[Proxy]
[Proxy Group]
Group 1 = select, no-alert=0, hidden=0, include-all-proxies=1, update-interval=0, policy-path=./path-1
Group 2 = smart, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 1, include-other-group=Group 1
Group 3 = select, Group 1, Group 2, DIRECT, REJECT, Group 10, Group 11, Group 12, Group 14, Group 13, Group 15, Group 16, no-alert=0, hidden=0, include-all-proxies=0
Group 4 = select, Group 10, Group 11, DIRECT, REJECT, no-alert=0, hidden=0, include-all-proxies=0
Group 5 = select, DIRECT, REJECT, Group 10, Group 11, no-alert=0, hidden=0, include-all-proxies=0
Group 6 = select, Group 1, Group 2, Group 10, DIRECT, REJECT, Group 11, Group 12, Group 14, Group 13, Group 15, Group 16, no-alert=0, hidden=0, include-all-proxies=0
Group 7 = select, Group 1, Group 2, DIRECT, REJECT, Group 10, Group 11, Group 12, Group 14, Group 13, Group 15, Group 16, no-alert=0, hidden=0, include-all-proxies=0
Group 8 = select, Group 1, Group 2, DIRECT, REJECT, Group 10, Group 11, Group 12, Group 14, Group 13, Group 15, Group 16, no-alert=0, hidden=0, include-all-proxies=0
Group 9 = smart, policy-path=https://h6.example.com/p2, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0
Group 10 = smart, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 2, include-other-group=Group 2
Group 11 = smart, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=(str1), include-other-group=Group 2
Group 12 = smart, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=(str2), include-other-group=Group 2
Group 13 = smart, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=(str3), include-other-group=Group 2
Group 14 = smart, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=(str4), include-other-group=Group 2
Group 15 = smart, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=(str5), include-other-group=Group 2
Group 16 = smart, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=(str6), include-other-group=Group 2
[Rule]
RULE-SET,https://h7.example.com/p3.list,Group 1
DOMAIN-SUFFIX,d10.example,DIRECT
DOMAIN-SUFFIX,d11.example,DIRECT
DOMAIN-SUFFIX,d12.example,DIRECT
DOMAIN-SUFFIX,d13.example,DIRECT
DOMAIN-SUFFIX,d14.example,DIRECT
DOMAIN-SUFFIX,d15.example,DIRECT
DOMAIN-SUFFIX,d16.example,DIRECT
DOMAIN-SUFFIX,d17.example,DIRECT
DOMAIN-SUFFIX,d18.example,DIRECT
DOMAIN-SUFFIX,d19.example,DIRECT
AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT-NO-DROP
RULE-SET,https://h3.example.com/p4.list,DIRECT
IP-CIDR,0.0.0.0/32,REJECT,no-resolve
RULE-SET,https://h7.example.com/p5.list,DIRECT
RULE-SET,https://h7.example.com/p6.list,REJECT,update-interval=2592000
RULE-SET,https://h7.example.com/p7.list,DIRECT,update-interval=2592000
RULE-SET,https://h7.example.com/p8.list,Group 1,update-interval=2592000
RULE-SET,https://h7.example.com/p9.list,DIRECT
RULE-SET,https://h7.example.com/p10.list,REJECT
RULE-SET,https://h7.example.com/p11.list,Group 6
RULE-SET,https://h7.example.com/p12.list,Group 4
RULE-SET,https://h7.example.com/p13.list,Group 5
RULE-SET,https://h7.example.com/p14.list,Group 7
RULE-SET,https://h7.example.com/p15.list,Group 3
RULE-SET,https://h7.example.com/p16.list,Group 1
GEOIP,CN,DIRECT
FINAL,Group 8,dns-failed
[Host]
*.d20.example = 192.0.2.3
d21.example = 192.0.2.5
d22*.example = server:192.0.2.6
[URL Rewrite]
^https?://r1\.example\.com/ https://h8.example.com 302
^https?://r2\.example\.com/ https://h8.example.com 302
[MITM]
skip-server-cert-verify = true
tcp-connection = true
h2 = true
hostname = *, str7, d23*.example, d24*.example, s25.example.net:443, s26.example.net:443, str8, d27.example
hostname-disabled = *
