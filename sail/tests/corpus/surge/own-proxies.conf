[General]
loglevel = notify
dns-server = 192.0.2.53, system
proxy-test-url = http://www.example.com/generate_204
test-timeout = 5

[Proxy]
SS = ss, s1.example.net, 8388, encrypt-method=2022-blake3-aes-256-gcm, password=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=, udp-relay=true
SS-OBFS = ss, s2.example.net, 8388, encrypt-method=chacha20-ietf-poly1305, password=a synthetic password, obfs=http, obfs-host=www.example.com
VMess = vmess, s1.example.net, 443, username=1b0e0a3e-1c2d-4e5f-8a9b-0c1d2e3f4a5b, ws=true, ws-path=/ws, ws-headers=Host:server.example.com, tls=true, sni=server.example.com, vmess-aead=true
Trojan = trojan, s1.example.net, 443, password=a synthetic password, sni=server.example.com, skip-cert-verify=false
Trojan-WS = trojan, s2.example.net, 443, password=a synthetic password, ws=true, ws-path=/ws, sni=server.example.com
HTTP = http, s1.example.net, 3128, username=user1, password=a synthetic password
HTTPS = https, s1.example.net, 443, username=user1, password=a synthetic password, sni=server.example.com
SOCKS5 = socks5, s1.example.net, 1080, username=user1, password=a synthetic password, udp-relay=true
Hysteria2 = hysteria2, s1.example.net, 443, password=a synthetic password, download-bandwidth=200, sni=server.example.com
TUIC = tuic-v5, s1.example.net, 443, password=a synthetic password, uuid=1b0e0a3e-1c2d-4e5f-8a9b-0c1d2e3f4a5b, alpn=h3, sni=server.example.com
AnyTLS = anytls, s1.example.net, 443, password=a synthetic password, sni=server.example.com
Shadow-TLS = ss, s3.example.net, 443, encrypt-method=2022-blake3-aes-128-gcm, password=AAECAwQFBgcICQoLDA0ODw==, shadow-tls-password=a synthetic password, shadow-tls-sni=www.example.com, shadow-tls-version=3
Direct-Alias = direct
Block = reject

[Proxy Group]
Proxy = select, SS, SS-OBFS, VMess, Trojan, Trojan-WS, HTTP, HTTPS, SOCKS5, Hysteria2, TUIC, AnyTLS, Shadow-TLS, Direct-Alias

[Rule]
DOMAIN-SUFFIX,ads.example,Block
FINAL,Proxy
