[General]
loglevel = notify
ipv6 = false
ipv6-vif = auto
dns-server = 192.0.2.1, 192.0.2.2, 192.0.2.3, 192.0.2.4, 192.0.2.5, 192.0.2.6, 192.0.2.7:995, system
skip-proxy = localhost, *.d1.example, 0.0.0.0/8, 10.0.0.0/8, 240.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16
exclude-simple-hostnames = true
external-controller-access = password1@0.0.0.0:6166
http-api-web-dashboard = false
show-error-page-for-reject = true
internet-test-url = http://h1.example.com/generate_204
proxy-test-url = http://192.0.2.4/generate_204
test-timeout = 5
always-real-ip = *.d2.example
hijack-dns = *:53
encrypted-dns-follow-outbound-mode = true
encrypted-dns-server = https://192.0.2.8/dns-query
encrypted-dns-skip-cert-verification = false
use-local-host-item-for-proxy = false
geoip-maxmind-url = https://h2.example.com/p1.mmdb
disable-geoip-db-auto-update = false
allow-dns-svcb = false
udp-policy-not-supported-behaviour = REJECT
udp-priority = false
always-raw-tcp-hosts = *.d3.example
allow-wifi-access = false
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
wifi-access-http-auth = user1:password1
wifi-assist = true
hide-vpn-icon = false
all-hybrid = false
allow-hotspot-access = false
include-all-networks = false
include-local-networks = false
include-apns = false
include-cellular-services = false
compatibility-mode = 1
[Proxy]
Proxy 1 = snell, 192.0.2.9, 49012, psk=password2, version=4, reuse=true, tfo=true
Proxy 2 = snell, 192.0.2.9, 43475, psk=password2, version=4, reuse=true, tfo=true, shadow-tls-password=password3, shadow-tls-sni=d4.example, shadow-tls-version=3
Proxy 3 = ss, 192.0.2.9, 50707, encrypt-method=2022-blake3-aes-128-gcm, password=wywOQgzCr2vr85JpoMxzCQ==, shadow-tls-password=password3, shadow-tls-sni=d4.example, shadow-tls-version=3, udp-relay=true
Proxy 4 = vmess, s5.example.net, 80, username=00005a11-0000-4000-8000-000000000001, ws=true, ws-path=/p2, ws-headers=Host:"sni6.example.org", vmess-aead=true
[Proxy Group]
Group 1 = select, policy-path=https://h3.example.com/p3, update-interval=36000, no-alert=0, hidden=0, include-all-proxies=0, persistent=1
Group 2 = select, "Group 3", "Group 4", "Group 1", "Group 13", "Group 14", "Group 15", "Group 16", "Group 17", "Group 18", "Group 19", "Group 21", "Group 20"
Group 3 = smart, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 1, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 4 = select, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 1
Group 5 = select, "Group 2", "Group 13", "Group 14", "Group 15", "Group 16", "Group 18", no-alert=0, hidden=0, include-all-proxies=0
Group 6 = select, "Group 2", "Group 13", "Group 14", "Group 15", "Group 16", "Group 18", no-alert=0, hidden=0, include-all-proxies=0
Group 7 = select, "Group 2", "Group 13", "Group 14", "Group 15", "Group 16", "Group 18", no-alert=0, hidden=0, include-all-proxies=0
Group 8 = select, "Group 4", "Group 1", "Group 2", "Group 3", no-alert=0, hidden=0, include-all-proxies=0
Group 9 = select, DIRECT, "Group 16", no-alert=0, hidden=0, include-all-proxies=0
Group 10 = select, "Group 4", "Group 2", no-alert=0, hidden=0, include-all-proxies=0
Group 11 = select, DIRECT, "Group 3", "Group 4", no-alert=0, hidden=0, include-all-proxies=0
Group 12 = select, "Group 2", "Group 1", "Group 3", no-alert=0, hidden=0, include-all-proxies=0
Group 13 = smart, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 2, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 14 = smart, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 3, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 15 = smart, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 4, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 16 = smart, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 5, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 17 = smart, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 6, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 18 = smart, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 7, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 19 = smart, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 8, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 20 = select, REJECT
Group 21 = select, DIRECT
[Rule]
RULE-SET,https://h4.example.com/p4.list,"Group 21",str1
RULE-SET,https://h4.example.com/p5.list,"Group 21",str1
RULE-SET,https://h4.example.com/p6.list,"Group 21",str1
RULE-SET,https://h4.example.com/p7.list,"Group 21",str1
RULE-SET,https://h4.example.com/p8.list,Group 11,str1
RULE-SET,https://h4.example.com/p9.list,"Group 20",str1,no-resolve
RULE-SET,https://h4.example.com/p10.list,"Group 20",str1
RULE-SET,https://h4.example.com/p11.list,"Group 20",str1
RULE-SET,https://h4.example.com/p12.list,"Group 20",str1
RULE-SET,https://h4.example.com/p13.list,"Group 21",str1
RULE-SET,https://h4.example.com/p14.list,"Group 21",str1
RULE-SET,https://h4.example.com/p15.list,"Group 21",str1
RULE-SET,https://h4.example.com/p16.list,"Group 21",str1
RULE-SET,https://h4.example.com/p17.list,"Group 2"
RULE-SET,https://h4.example.com/p18.list,"Group 2",str1
RULE-SET,https://h4.example.com/p19.list,"Group 2",str1
RULE-SET,https://h4.example.com/p20.list,"Group 2",str1
RULE-SET,https://h4.example.com/p21.list,"Group 2",str1
RULE-SET,https://h4.example.com/p22.list,"Group 2",str1
RULE-SET,https://h4.example.com/p23.list,Group 12,str1
RULE-SET,https://h4.example.com/p24.list,"Group 2",str1
RULE-SET,https://h4.example.com/p25.list,Group 10,str1
RULE-SET,https://h4.example.com/p26.list,"Group 2",str1
RULE-SET,https://h4.example.com/p27.list,"Group 2",str1
RULE-SET,https://h4.example.com/p28.list,Group 8,str1
RULE-SET,https://h4.example.com/p29.list,Group 8,str1
RULE-SET,https://h4.example.com/p30.list,Group 5,str1
RULE-SET,https://h4.example.com/p31.list,Group 7,str1
RULE-SET,https://h4.example.com/p32.list,"Group 2",str1
RULE-SET,https://h4.example.com/p33.list,Group 6,str1
RULE-SET,https://h4.example.com/p34.list,Group 9,str1
RULE-SET,https://h4.example.com/p35.list,"Group 2",str1
RULE-SET,https://h4.example.com/p36.list,"Group 2",str1
RULE-SET,https://h4.example.com/p37.list,"Group 21",str1
RULE-SET,https://h4.example.com/p38.list,"Group 21",str1
GEOIP,CN,"Group 21"
FINAL,Group 2
[URL Rewrite]
^https?://r1\.example\.com/ https://h5.example.com 302
^https?://r2\.example\.com/ https://h5.example.com 302
[MITM]
