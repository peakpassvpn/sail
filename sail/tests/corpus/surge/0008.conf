[General]
test-timeout = 3
udp-priority = false
internet-test-url = http://h1.example.com
proxy-test-url = http://h2.example.com/generate_204
geoip-maxmind-url = https://h3.example.com/p1.mmdb
ipv6 = true
dns-server = system
encrypted-dns-server = https://h4.example.com/dns-query, https://h5.example.com/dns-query
show-error-page-for-reject = true
allow-wifi-access = false
wifi-access-http-port = 6528
wifi-access-socks5-port = 6582
allow-hotspot-access = true
wifi-assist = true
http-api = password1@127.0.0.1:5208
http-api-tls = false
http-api-web-dashboard = true
use-default-policy-if-wifi-not-primary = false
all-hybrid = false
exclude-simple-hostnames = true
read-etc-hosts = true
loglevel = notify
always-real-ip = *.d1.example, *.d2.example, *.d3.example, *.d4.example, d5*.example, *.d6.example, *.d7.example, *.d8.example, d9.example
ipv6-vif = auto
disable-geoip-db-auto-update = false
udp-policy-not-supported-behaviour = reject
[Proxy]
Proxy 1 = direct
[Proxy Group]
Group 1 = select, Group 3, Group 4, Group 5
Group 2 = select, Group 4, Group 1
Group 3 = url-test, include-other-group=Group 5, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(str1)
Group 4 = url-test, include-other-group=Group 5, update-interval=0, no-alert=0, hidden=1, include-all-proxies=0, policy-regex-filter=(str2)
Group 5 = url-test, policy-path=./path-1, update-interval=86400, no-alert=0, hidden=0, include-all-proxies=0
[Rule]
RULE-SET,https://h6.example.com/p2.list,Group 2
RULE-SET,https://h6.example.com/p3.list,Proxy 1
RULE-SET,https://h6.example.com/p4.list,Proxy 1
RULE-SET,https://h6.example.com/p5.list,Proxy 1
RULE-SET,https://h6.example.com/p6.list,Proxy 1
RULE-SET,https://h6.example.com/p7.list,Group 1
RULE-SET,LAN, Proxy 1
GEOIP,CN,Proxy 1
FINAL,Group 1,dns-failed
