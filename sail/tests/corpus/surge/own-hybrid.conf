[General]
loglevel = notify
dns-server = system
all-hybrid = true

[Proxy]
Fast = trojan, s1.example.net, 443, password=p1, sni=server.example.com, hybrid=on
Steady = trojan, s2.example.net, 443, password=p2, sni=server.example.com, hybrid=off
Usual = trojan, s3.example.net, 443, password=p3, sni=server.example.com

[Proxy Group]
Proxy = select, Fast, Steady, Usual

[Rule]
FINAL,Proxy
