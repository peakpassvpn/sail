[General]
test-timeout = 5
loglevel = notify
use-default-policy-if-wifi-not-primary = false
internet-test-url = http://h1.example.com/generate_204
proxy-test-url = http://h2.example.com/p1
always-real-ip = str1, *.d1.example, *.d2.example, d3*.example, *.d4.example, *.d5.example, *.d6.example, d7.example, d8*.example, d9*.example, d10*.example, *.d9*.example, d11*.example, d12*.example, d13*.example, *.d12*.example, d14*.example
geoip-maxmind-url = https://h3.example.com/p2.mmdb
[Proxy]
[Proxy Group]
Group 1 = select, Group 2, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15
Group 2 = select, Group 9
Group 3 = select, DIRECT, Group 1, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15, REJECT
Group 4 = select, Group 10, Group 1, Group 11, Group 12, Group 13, Group 14, Group 15, DIRECT, REJECT
Group 5 = select, Group 11, Group 1, Group 10, Group 12, Group 13, Group 14, Group 15, DIRECT, REJECT
Group 6 = select, Group 1, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15, DIRECT, REJECT
Group 7 = select, Group 1, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15, DIRECT, REJECT
Group 8 = select, Group 1, Group 10, Group 11, Group 12, Group 13, Group 14, Group 15, DIRECT, REJECT
Group 9 = select, policy-path=./path-1, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 1
Group 10 = smart, include-other-group=Group 9, policy-regex-filter=Proxy [0-9]+|Group 2
Group 11 = smart, include-other-group=Group 9, policy-regex-filter=Proxy [0-9]+|Group 3
Group 12 = smart, include-other-group=Group 9, policy-regex-filter=Proxy [0-9]+|Group 4
Group 13 = smart, include-other-group=Group 9, policy-regex-filter=Proxy [0-9]+|Group 5
Group 14 = smart, include-other-group=Group 9, policy-regex-filter=Proxy [0-9]+|Group 6
Group 15 = smart, include-other-group=Group 9, policy-regex-filter=Proxy [0-9]+|Group 7
[Rule]
RULE-SET,SYSTEM,DIRECT
RULE-SET,https://h4.example.com/p3.txt,REJECT
RULE-SET,https://h4.example.com/p4.txt,DIRECT
RULE-SET,https://h4.example.com/p5.txt,Group 7
RULE-SET,https://h5.example.com/p6.conf,REJECT
RULE-SET,https://h4.example.com/p7.list,Group 3
RULE-SET,https://h4.example.com/p8.list,Group 4
RULE-SET,https://h4.example.com/p9.list,Group 5
RULE-SET,https://h5.example.com/p10.conf,Group 6
RULE-SET,https://h5.example.com/p11.conf,Group 6,extended-matching
RULE-SET,LAN,DIRECT
GEOIP,CN,DIRECT
FINAL,Group 8,dns-failed
