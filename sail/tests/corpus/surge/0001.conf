[General]
ipv6 = 0
all-hybrid = 0
wifi-assist = 0
loglevel = notify
allow-wifi-access = 1
network-framework = 1
exclude-simple-hostnames = 1
show-error-page-for-reject = 1
disable-geoip-db-auto-update = 1
test-timeout = 3
internet-test-url = http://h1.example.com
proxy-test-url = http://h2.example.com/generate_204
use-default-policy-if-wifi-not-primary = 0
http-listen = 0.0.0.0:6152
socks5-listen = 0.0.0.0:6153
http-api = password1@0.0.0.0:6170
external-controller-access = password2@0.0.0.0:6171
hijack-dns = 192.0.2.1:53, 192.0.2.2:53
dns-server = 192.0.2.3, 192.0.2.4, 192.0.2.5, 2001:db8::1
skip-proxy = d1.example, d2.example, d3.example
always-real-ip = *.d4.example, *.d5.example, *.d6.example, *.d7.example, d8*.example, *.d9.example, *.d10.example, *.d11.example, d12.example
[Replica]
hide-udp = 0
use-keyword-filter = Proxy [0-9]+|Group 1
hide-apple-request = 1
hide-crashlytics-request = 1
hide-crash-reporter-request = 1
keyword-filter-type = none
[Proxy Group]
Group 1 = select, Group 5, Group 6, Group 10, Group 7, Group 9
Group 2 = select, Group 1, hidden=1
Group 3 = select, Group 1, hidden=1
Group 4 = select, REJECT-TINYGIF, REJECT-DROP, REJECT, DIRECT, hidden=0
Group 5 = select, policy-path=./path-1
Group 6 = select, policy-path=./path-1
Group 7 = select, policy-path=./path-1
Group 8 = url-test, policy-path=./path-1, url=http://h2.example.com/generate_204, hidden=1
Group 9 = select, policy-path=./path-1, hidden=0
Group 10 = select, policy-path=./path-1, hidden=0
[Rule]
AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT-NO-DROP
RULE-SET,https://h3.example.com/p1.list?raw=1,Group 7
RULE-SET,https://h3.example.com/p2.list?raw=1,Proxy 1
RULE-SET,https://h3.example.com/p3.list?raw=1,Proxy 1
RULE-SET,https://h3.example.com/p4.list?raw=1,Proxy 1
RULE-SET,https://h3.example.com/p5.list?raw=1,Proxy 2
RULE-SET,https://h3.example.com/p6.list?raw=1,Proxy 3
RULE-SET,https://h3.example.com/p7.list?raw=1,Group 7
RULE-SET,https://h3.example.com/p8.list?raw=1,Group 7
RULE-SET,https://h3.example.com/p9.list?raw=1,Group 1
RULE-SET,https://h3.example.com/p10.list?raw=1,Group 1
RULE-SET,https://h3.example.com/p11.list?raw=1,Group 3
RULE-SET,https://h3.example.com/p12.list?raw=1,DIRECT
RULE-SET,https://h3.example.com/p13.list?raw=1,Group 4
DOMAIN-SET,https://h3.example.com/p14.list?raw=1,Group 4
RULE-SET,https://h3.example.com/p15.list?raw=1,Group 4
RULE-SET,https://h3.example.com/p16.list?raw=1,Group 2
RULE-SET,https://h3.example.com/p17.list?raw=1,Group 2
RULE-SET,https://h3.example.com/p18.list?raw=1,Group 2
RULE-SET,https://h3.example.com/p19.list?raw=1,Group 1
RULE-SET,https://h3.example.com/p20.list?raw=1,Group 9
RULE-SET,https://h3.example.com/p21.list?raw=1,Group 1
DOMAIN-SET,https://h3.example.com/p22.list?raw=1,Group 1
RULE-SET,https://h3.example.com/p23.list?raw=1,DIRECT
RULE-SET,https://h3.example.com/p24.list?raw=1,DIRECT
RULE-SET,https://h3.example.com/p25.list?raw=1,DIRECT
RULE-SET,https://h3.example.com/p26.list?raw=1,DIRECT
RULE-SET,SYSTEM,Group 7
RULE-SET,LAN,DIRECT
FINAL,Group 1,dns-failed
[MITM]
skip-server-cert-verify = true
tcp-connection = true
h2 = true
[SSID Setting]
"ssid-1" suspend=true
