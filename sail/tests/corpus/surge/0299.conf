[General]
loglevel = notify
internet-test-url = http://h1.example.com
proxy-test-url = http://h2.example.com/generate_204
test-timeout = 3
[Proxy]
Proxy 1 = http, s1.example.net, 39000
[Proxy Group]
Group 1 = url-test, no-alert=0, hidden=0, policy-path=./path-1, update-interval=0
Group 2 = select, Group 1, update-interval=0, no-alert=0, hidden=0
Group 3 = select, DIRECT, update-interval=0, no-alert=0, hidden=0
Group 4 = select, Proxy 1, no-alert=0, hidden=0, update-interval=0
Group 5 = select, REJECT, update-interval=0, no-alert=0, hidden=0
Group 6 = select, Group 1, update-interval=0, no-alert=0, hidden=0
[Rule]
RULE-SET,https://h3.example.com/p1.list,Group 2,update-interval=3600
RULE-SET,https://h3.example.com/p2.list,Group 3,update-interval=3600
RULE-SET,https://h3.example.com/p3.list,Group 4,update-interval=3600
RULE-SET,https://h3.example.com/p4.list,Group 5,update-interval=3600
RULE-SET,https://h3.example.com/p5.list,Group 6,update-interval=3600
FINAL,DIRECT
[URL Rewrite]
^https?://r1\.example\.com/ ^https?://r2\.example\.com/ header
[MITM]
hostname = str1, d2*.example
ca-passphrase = password1
ca-p12 = c2FpbCBjb3JwdXMgZHVtbXkgcDEy
[Script]
script-1 = type=http-request, pattern=^https?://r3\.example\.com/, script-path=https://h4.example.com/p6.js, requires-body=true, timeout=120
script-2 = type=http-request, pattern=^https?://r4\.example\.com/, requires-body=1, max-size=0, script-path=https://h5.example.com/p7.js
script-3 = type=http-response, pattern=^https?://r5\.example\.com/, requires-body=1, max-size=-1, script-path=https://h6.example.com/p8.js
script-4 = type=http-request, pattern=^https?://r6\.example\.com/, script-path=https://h6.example.com/p9.js
script-5 = type=http-response, pattern=^https?://r7\.example\.com/, requires-body=1, max-size=0, script-path=https://h7.example.com/p10.js
script-6 = type=http-request, pattern=^https?://r8\.example\.com/, script-path=https://h7.example.com/p10.js
