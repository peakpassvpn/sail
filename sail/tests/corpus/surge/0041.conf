[General]
http-listen = 0.0.0.0:8888
socks5-listen = 0.0.0.0:8889
external-controller-access = password1@0.0.0.0:6170
internet-test-url = http://h1.example.com/generate_204
proxy-test-url = http://h2.example.com/generate_204
test-timeout = 3
ipv6 = true
ipv6-vif = auto
show-error-page-for-reject = true
loglevel = notify
exclude-simple-hostnames = true
use-default-policy-if-wifi-not-primary = false
force-http-engine-hosts = d1.example, d2.example
hijack-dns = *:53
dns-server = 192.0.2.1, 192.0.2.2, system
read-etc-hosts = true
doh-skip-cert-verification = true
encrypted-dns-server = https://h3.example.com/dns-query
encrypted-dns-follow-outbound-mode = true
allow-wifi-access = false
allow-hotspot-access = true
http-api = password1@0.0.0.0:2500
http-api-web-dashboard = true
all-hybrid = false
wifi-access-http-port = 1314
udp-priority = true
always-raw-tcp-hosts = d3.example, d4*.example, d5*.example, d6*.example, d7*.example, d8*.example, d9*.example, d10*.example, d11*.example, d12*.example, d13*.example, d14*.example
[Proxy Group]
Group 1 = select, Group 13, Group 6
Group 2 = select, policy-path=./path-1
Group 3 = select, policy-path=./path-1
Group 4 = select, policy-path=https://sub.store/p1, update-interval=0, no-alert=0, hidden=0
Group 5 = select, Group 6, Group 7, Group 8, Group 9, Group 11, Group 10, Group 12, no-alert=0, hidden=1, include-all-proxies=0
Group 6 = url-test, policy-path=https://sub.store/p1, url=http://h4.example.com/generate_204, interval=600, tolerance=50
Group 7 = fallback, policy-path=https://sub.store/p1, url=http://h4.example.com/generate_204, interval=600, tolerance=50
Group 8 = url-test, policy-path=https://sub.store/p1, policy-regex-filter=Proxy [0-9]+|Group 1, interval=600, tolerance=50, update-interval=43200, no-alert=0, hidden=0, include-all-proxies=0
Group 9 = url-test, policy-path=https://sub.store/p1, policy-regex-filter=Proxy [0-9]+|Group 2, interval=600, tolerance=50, update-interval=43200, no-alert=0, hidden=0, include-all-proxies=0
Group 10 = url-test, policy-path=https://sub.store/p1, policy-regex-filter=Proxy [0-9]+|Group 3, interval=600, tolerance=50, update-interval=43200, no-alert=0, hidden=0, include-all-proxies=0
Group 11 = url-test, policy-path=https://sub.store/p1, policy-regex-filter=Proxy [0-9]+|Group 4, interval=600, tolerance=50, update-interval=43200, no-alert=0, hidden=0, include-all-proxies=0
Group 12 = url-test, policy-path=https://sub.store/p1, policy-regex-filter=Proxy [0-9]+|Group 5, interval=600, tolerance=50, update-interval=43200, no-alert=0, hidden=0, include-all-proxies=0
Group 13 = select, DIRECT, hidden=1
