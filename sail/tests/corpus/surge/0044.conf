[General]
loglevel = warning
encrypted-dns-server = https://h1.example.com/dns-query, https://h2.example.com/dns-query
dns-server = 192.0.2.1, 192.0.2.2, 192.0.2.3, 192.0.2.4, system
http-listen = 0.0.0.0:8888
socks5-listen = 0.0.0.0:8889
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
internet-test-url = http://h3.example.com/generate_204
proxy-test-url = http://h4.example.com/generate_204
test-timeout = 3
allow-wifi-access = true
exclude-simple-hostnames = true
use-default-policy-if-wifi-not-primary = false
ipv6 = false
geoip-maxmind-url = https://h5.example.com/p1.mmdb
ipv6-vif = disabled
[Proxy Group]
Group 1 = select, Group 20, update-interval=36000, no-alert=0, hidden=0, include-all-proxies=0, persistent=1, include-other-group=Group 2
Group 2 = select, policy-path=http://192.0.2.5/p2?token=v1, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=Proxy [0-9]+|Group 1
Group 3 = select, REJECT, no-alert=0, hidden=0, include-all-proxies=0
Group 4 = select, DIRECT, Group 1, no-alert=0, hidden=0, include-all-proxies=0
Group 5 = select, DIRECT, Group 1, no-alert=0, hidden=0, include-all-proxies=0
Group 6 = select, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 7 = select, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 8 = select, DIRECT, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 9 = select, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 10 = select, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 11 = select, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 12 = select, Group 1, DIRECT, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 13 = select, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 14 = select, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 15 = select, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 16 = select, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 17 = select, DIRECT, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 18 = select, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 19 = select, Group 1, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 20 = url-test, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
Group 21 = select, Group 1, DIRECT, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=Group 2
[Rule]
DOMAIN-SET,https://h6.example.com/p3.list,Group 3
RULE-SET,https://h6.example.com/p4.list,Group 3
RULE-SET,https://h6.example.com/p5.list,Group 4
RULE-SET,https://h6.example.com/p6.list,Group 17
RULE-SET,https://h6.example.com/p7.list,Group 14
RULE-SET,https://h6.example.com/p8.list,Group 19
RULE-SET,https://h6.example.com/p9.list,Group 18
RULE-SET,https://h6.example.com/p10.list,Group 16
RULE-SET,https://h6.example.com/p11.list,Group 15
RULE-SET,https://h6.example.com/p12.list,Group 13
RULE-SET,https://h6.example.com/p13.list,Group 12
RULE-SET,https://h6.example.com/p14.list,Group 11
