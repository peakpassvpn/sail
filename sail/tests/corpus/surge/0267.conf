[General]
loglevel = notify
dns-server = 192.0.2.1, 192.0.2.2
[Proxy]
Proxy 1 = vmess, s1.example.net, 443, username=user1, ws=true, ws-path=/p1, tls=true, sni=s1.example.net, skip-cert-verify=true
Proxy 2 = vless, s2.example.net, 443, username=user2, ws=true, ws-path=/p2, tls=true, sni=s2.example.net
Proxy 3 = vless, s3.example.net, 443, username=user3, flow=xtls-rprx-vision, tls=true, sni=s3.example.net
Proxy 4 = trojan, s4.example.net, 443, password=password1
Proxy 5 = trojan, s5.example.net, 443, password=password2, ws=true, ws-path=/p3, sni=s5.example.net
Proxy 6 = hysteria2, s6.example.net, 443, password=password3, up=100, down=500, sni=s6.example.net
Proxy 7 = ss, s7.example.net, 8388, encrypt-method=aes-256-gcm, password=password4
[Proxy Group]
Group 1 = select, Proxy 1, Proxy 2, Proxy 4, Proxy 6, DIRECT
Group 2 = url-test, Proxy 1, Proxy 2, Proxy 4, url=http://h1.example.com/generate_204
Group 3 = relay, Proxy 1, Proxy 4
Group 4 = relay, Proxy 2, Proxy 3
Group 5 = smart, Group 2, Group 3, Proxy 6
[Rule]
DOMAIN,d8.example,Group 2
DOMAIN-SUFFIX,d9.example,Group 1
IP-CIDR,10.0.0.0/8,DIRECT
GEOIP,CN,DIRECT
FINAL,Group 5
