[General]
loglevel = notify
dns-server = 192.0.2.53, system
proxy-test-url = http://www.example.com/generate_204
test-timeout = 5

[Proxy]
A = trojan, s1.example.net, 443, password=p1, sni=server.example.com
B = trojan, s2.example.net, 443, password=p2, sni=server.example.com
C = trojan, s3.example.net, 443, password=p3, sni=server.example.com

[Proxy Group]
Proxy = select, Auto, Fallback, Balance, Smart, A, B, C, DIRECT
Auto = url-test, A, B, C, interval=600, tolerance=50
Fallback = fallback, A, B, interval=600, timeout=5
Balance = load-balance, A, B, C, persistent=true
Smart = smart, A, B, C
Filtered = select, include-all-proxies=true, policy-regex-filter=^[AB]$
Home = ssid, default=Proxy, cellular=Auto, "Home Wi-Fi"=DIRECT
Office = subnet, default=Proxy, 192.0.2.0/24=DIRECT

[Rule]
DOMAIN-SUFFIX,home.example,Home
DOMAIN-SUFFIX,office.example,Office
DOMAIN-SUFFIX,filtered.example,Filtered
FINAL,Proxy
