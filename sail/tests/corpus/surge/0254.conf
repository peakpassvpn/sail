[General]
loglevel = warning
skip-proxy = 192.168.0.0/16, 192.0.2.0/24, 172.16.0.0/12, localhost, *.d1.example
test-timeout = 5
external-controller-access = password1@0.0.0.0:10240
tls-provider = default
read-etc-hosts = false
dns-server = 192.0.2.1, 192.0.2.2, 192.0.2.3, 192.0.2.4
[Proxy]
Proxy 1 = direct
Proxy 2 = reject
Proxy 3 = ss, localhost, 80, encrypt-method=chacha20-ietf-poly1305, password=password2, obfs=tls, obfs-host=sni2.example.org
[Proxy Group]
Group 1 = select, Proxy 1, Proxy 2, Proxy 3
Group 2 = select, Proxy 1, Proxy 2
Group 3 = select, Proxy 1, Proxy 2, Proxy 3
[Rule]
RULE-SET,LAN,Group 3
RULE-SET,https://h1.example.com/p1.txt,Group 2
RULE-SET,https://h1.example.com/p2.txt,Group 3
PROCESS-NAME,/opt/app1/app1,Proxy 2
PROCESS-NAME,/opt/app2/app2,Group 3
PROCESS-NAME,/opt/app3/app3,Group 3
DOMAIN-SUFFIX,d3.example,Group 3
GEOIP,CN,Group 3
FINAL,Group 1
[Host]
localhost = 127.0.0.1
[URL Rewrite]
^https?://r1\.example\.com/ http://h2.example.com 302
