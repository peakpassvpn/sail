[General]
loglevel = notify
dns-server = 192.0.2.1, 192.0.2.2, 192.0.2.3
bypass-tun = 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32
skip-proxy = localhost, *.d1.example, d2.example, d3.example, d4.example, d5.example, 0.0.0.0/8, 10.0.0.0/8, 240.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
interface = 0.0.0.0
socks-interface = 0.0.0.0
port = 6152
socks-port = 6153
allow-wifi-access = true
external-controller-access = password1@0.0.0.0:6170
exclude-simple-hostnames = true
ipv6 = true
replica = false
[Replica]
hide-apple-request = true
hide-crashlytics-request = true
use-keyword-filter = false
hide-udp = false
[Proxy]
DIRECT = direct
Proxy 1 = http, 192.0.2.4, 443, password2, password3, skip-common-name-verify=false
Proxy 2 = http, 192.0.2.4, 443, password2, password3, tls=true
Proxy 3 = socks5, 192.0.2.4, 443, password2, password3
Proxy 4 = socks5, 192.0.2.4, 443, password2, password3, tls=true
Proxy 5 = custom, str1, password4, password5, password6, password7
[Proxy Group]
Group 1 = select, DIRECT, Proxy 1, Proxy 2, Proxy 3, Proxy 4, Proxy 5
