RULE-SET,https://h4.example.com/p28.list,Group 2
RULE-SET,https://h4.example.com/p29.list,Group 8
RULE-SET,https://h4.example.com/p30.list,Group 12
RULE-SET,https://h4.example.com/p31.list,Group 11
RULE-SET,https://h4.example.com/p32.list,Group 13
RULE-SET,LAN,DIRECT
GEOIP,CN,DIRECT,no-resolve
FINAL,Group 13
[Host]
d29.example = s28.example.net
[URL Rewrite]
^https?://r1\.example\.com/ https://h5.example.com 307
[MITM]
