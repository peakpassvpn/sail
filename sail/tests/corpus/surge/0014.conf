[General]
dns-server = 192.0.2.1, 192.0.2.2
doh-follow-outbound-mode = false
hijack-dns = 192.0.2.3:53, 192.0.2.4:53
internet-test-url = http://h1.example.com/generate_204
proxy-test-url = http://h2.example.com/generate_204
test-timeout = 5
ipv6 = true
geoip-maxmind-url = https://h3.example.com/p1.mmdb
loglevel = notify
tls-provider = openssl
network-framework = false
skip-proxy = localhost, *.d1.example, d2.example, d3.example, d4.example, d5.example, 0.0.0.0/8, 10.0.0.0/8, 240.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
tun-excluded-routes = 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 192.0.2.5/32, 255.255.255.255/32
always-real-ip = *.d6.example, *.d7.example, *.d8.example, *.d9.example, d10*.example, *.d11.example, *.d12.example, *.d13.example, d14.example, d15.example, d16.example, d17.example
exclude-simple-hostnames = true
show-error-page-for-reject = true
udp-policy-not-supported-behaviour = DIRECT
wifi-assist = false
allow-wifi-access = false
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
allow-hotspot-access = false
http-listen = 127.0.0.1:6152
socks5-listen = 127.0.0.1:6153
read-etc-hosts = true
external-controller-access = password1@127.0.0.1:6165
http-api = password1@127.0.0.1:6166
http-api-tls = false
http-api-web-dashboard = true
[Replica]
hide-apple-request = true
hide-crashlytics-request = true
hide-udp = false
[Proxy]
Proxy 1 = direct
[Proxy Group]
Group 1 = select, Proxy 1, Group 2, Group 3, Group 9
Group 2 = url-test, Group 9, hidden=true
Group 3 = fallback, Group 9, hidden=true
Group 4 = select, Proxy 1, Group 1
Group 5 = select, Proxy 1, Group 1
Group 6 = select, Proxy 1, Group 1
Group 7 = select, Proxy 1, Group 1, Group 9
Group 8 = select, Proxy 1, Group 1
Group 9 = select, policy-path=https://h4.example.com/
[Rule]
RULE-SET, https://h3.example.com/p2.conf, Group 5
RULE-SET, https://h3.example.com/p3.conf, Group 6
RULE-SET, https://h3.example.com/p4.conf, Group 7
RULE-SET, SYSTEM, Group 5
RULE-SET, LAN, DIRECT
GEOIP, CN, Group 4
FINAL, Group 8, dns-failed
