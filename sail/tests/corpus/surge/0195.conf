[General]
loglevel = notify
doh-server = https://h1.example.com/dns-query
dns-server = 192.0.2.1, 192.0.2.2, 192.0.2.3
tun-excluded-routes = 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32
skip-proxy = localhost, *.d1.example, d2.example, d3.example, d4.example, d5.example, 0.0.0.0/8, 10.0.0.0/8, 240.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
wifi-assist = true
allow-wifi-access = true
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
http-listen = 0.0.0.0:6152
socks5-listen = 0.0.0.0:6153
external-controller-access = password1@0.0.0.0:6170
replica = false
tls-provider = openssl
network-framework = false
exclude-simple-hostnames = true
ipv6 = true
test-timeout = 4
proxy-test-url = http://h2.example.com/generate_204
[Replica]
hide-apple-request = true
hide-crashlytics-request = true
use-keyword-filter = false
hide-udp = false
[Proxy]
DIRECT = direct
[Proxy Group]
Group 1 = select, Group 8, Group 9, Group 10, DIRECT
Group 2 = select, DIRECT, Group 1
Group 3 = select, REJECT, Group 1, Group 2
Group 4 = select, Group 2, Group 1, Group 8, Group 9, Group 10
Group 5 = select, Group 2, Group 4
Group 6 = select, Group 2, Group 1, Group 8, Group 9, Group 10
Group 7 = select, Group 1, Group 2, Group 8, Group 9, Group 10
Group 8 = select, policy-path=https://h3.example.com/p1.list
Group 9 = select, policy-path=https://h3.example.com/p2.list
Group 10 = select, policy-path=https://h3.example.com/p3.list
[Rule]
RULE-SET,https://h4.example.com/p4.list,Group 1
RULE-SET,https://h4.example.com/p5.list,DIRECT,str1
RULE-SET,https://h4.example.com/p6.list,DIRECT
RULE-SET,https://h4.example.com/p7.list,REJECT-TINYGIF
RULE-SET,https://h4.example.com/p8.list,Group 1
RULE-SET,https://h4.example.com/p9.list,Group 1
RULE-SET,LAN,DIRECT
GEOIP,CN,DIRECT
FINAL,Group 1,dns-failed
[URL Rewrite]
^https?://r1\.example\.com/ https://h5.example.com 302
^https?://r2\.example\.com/ str2 reject
^https?://r3\.example\.com/ str2 reject
^https?://r4\.example\.com/ str2 reject
[Header Rewrite]
^https?://r5\.example\.com/ header-replace User-Agent "^https?://r6\.example\.com/"
^https?://r7\.example\.com/ header-replace User-Agent "^https?://r8\.example\.com/"
^https?://r9\.example\.com/ header-replace User-Agent "^https?://r8\.example\.com/"
^https?://r10\.example\.com/ header-replace User-Agent "^https?://r8\.example\.com/"
[MITM]
skip-server-cert-verify = true
hostname = *.d6.example, d7.example, d8.example, d9.example, d10.example, d11.example, d12.example, *.d13.example, d14.example, d15.example, -*.d16.example, d17.example, d18.example, d19.example, d20.example, d21.example, d22.example, d23.example, d24.example, d25.example, *.d26.example, *.d27.example, *.d28.example, *.d29*.example, d30.example, d31.example, d32.example, d33.example, d34.example, d35.example, *.d36.example, d37.example, d38.example, d39.example, d40.example, d41.example, d42.example, *.d43.example, *.d44.example
ca-passphrase = password2
ca-p12 = c2FpbCBjb3JwdXMgZHVtbXkgcDEy
