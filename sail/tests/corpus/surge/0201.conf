Group 11 = select, DIRECT, "Group 22", "Group 23", "Group 26", "Group 25", "Group 2"
Group 12 = select, DIRECT, "Group 1", "Group 3"
Group 13 = select, DIRECT, "Group 1", "Group 24", "Group 22", "Group 23", "Group 26", "Group 25", "Group 27", "Group 2"
Group 14 = select, DIRECT, "Group 1", "Group 24", "Group 22", "Group 23", "Group 26", "Group 25", "Group 27", "Group 2"
