Group 18 = select, REJECT, DIRECT
Group 19 = select, REJECT, DIRECT
Group 20 = select, DIRECT, "Group 1", "Group 3"
Group 21 = select, "Group 1", "Group 3", DIRECT, "Group 2"
Group 22 = smart, policy-path=http://192.0.2.5:8299/p2?target=Surge&k1=false, policy-regex-filter=(str1), url=http://h4.example.com/generate_204, interval=300
