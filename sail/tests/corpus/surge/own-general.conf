[General]
loglevel = info
dns-server = 192.0.2.53, 192.0.2.54
encrypted-dns-server = https://dns.example.com/dns-query
ipv6 = true
http-listen = 127.0.0.1:6152
socks5-listen = 127.0.0.1:6153
skip-proxy = 127.0.0.1, localhost, *.local
proxy-test-url = http://www.example.com/generate_204
internet-test-url = http://www.example.com/generate_204
test-timeout = 5
udp-policy-not-supported-behaviour = REJECT
all-hybrid = false

[Proxy]
A = trojan, s1.example.net, 443, password=p1, sni=server.example.com

[Proxy Group]
Proxy = select, A, DIRECT

[Rule]
FINAL,Proxy
