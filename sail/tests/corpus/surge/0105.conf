RULE-SET,https://h1.example.com/p21.list,Group 5,extended-matching
RULE-SET,https://h1.example.com/p22.list,Group 6,extended-matching
RULE-SET,https://h1.example.com/p23.list,Group 13,extended-matching
RULE-SET,https://h1.example.com/p24.list,Group 7,extended-matching
RULE-SET,https://h1.example.com/p25.list,Group 7,no-resolve,extended-matching
RULE-SET,https://h1.example.com/p26.list,Group 1,no-resolve,extended-matching
RULE-SET,https://h1.example.com/p27.list,DIRECT,extended-matching
RULE-SET,https://h1.example.com/p28.list,DIRECT,extended-matching
