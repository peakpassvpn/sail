[General]
loglevel = notify
ipv6 = true
dns-server = system
skip-proxy = 127.0.0.1, localhost, *.d1.example
[Proxy]
[Proxy Group]
Group 1 = select, Group 2, Group 3, Group 4, Group 5, Group 9
Group 2 = select, Group 19, Group 20
Group 3 = select, Group 20, Group 22
Group 4 = url-test, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 1, url=http://h1.example.com/generate_204, interval=600, tolerance=100
Group 5 = fallback, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 2, url=http://h1.example.com/generate_204, interval=600
Group 6 = url-test, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 3, url=http://h1.example.com/generate_204, interval=600, tolerance=100, hidden=1, no-alert=1
Group 7 = fallback, include-all-proxies=1, policy-regex-filter=(str1), url=http://h1.example.com/generate_204, interval=600, hidden=1, no-alert=1
Group 8 = url-test, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 4, url=http://h1.example.com/generate_204, interval=600, tolerance=100, hidden=1, no-alert=1
Group 9 = select, Group 4, Group 5, Group 6, Group 8
Group 10 = select, Group 6, Group 5, Group 9, Group 7
Group 11 = select, Group 20, Group 3, Group 9
Group 12 = select, DIRECT, Group 19, Group 20, Group 21, Group 22, Group 4, Group 5
Group 13 = select, DIRECT, Group 1, Group 19, Group 20, Group 21, Group 22
Group 14 = select, Group 1, Group 3, Group 5, Group 4, Group 8, Group 6
Group 15 = select, Group 1, Group 3
Group 16 = select, Group 1, Group 3
Group 17 = select, Group 1, Group 3, Group 5
Group 18 = select, Group 1, Group 3, Group 4
Group 19 = fallback, include-all-proxies=1, policy-regex-filter=(str2), url=http://h1.example.com/generate_204, interval=600, hidden=1, no-alert=1
Group 20 = fallback, include-all-proxies=1, policy-regex-filter=(str3), url=http://h1.example.com/generate_204, interval=600, hidden=1, no-alert=1
Group 21 = url-test, include-all-proxies=1, policy-regex-filter=(str4), url=http://h1.example.com/generate_204, interval=600, tolerance=100, hidden=1, no-alert=1
Group 22 = url-test, include-all-proxies=1, policy-regex-filter=(str5), url=http://h1.example.com/generate_204, interval=600, tolerance=100, hidden=1, no-alert=1
[Rule]
DOMAIN-SET,https://h2.example.com/p1.conf,Group 12,extended-matching
DOMAIN-SET,https://h2.example.com/p2.conf,DIRECT
DOMAIN-SET,https://h2.example.com/p3.conf,Group 13
RULE-SET,https://h3.example.com/p4.list,Group 12
RULE-SET,https://h3.example.com/p5.list,Group 10
RULE-SET,https://h2.example.com/p6.conf,Group 11
RULE-SET,https://h2.example.com/p7.conf,Group 15
RULE-SET,https://h2.example.com/p8.conf,Group 16
RULE-SET,https://h2.example.com/p9.conf,Group 18
RULE-SET,https://h2.example.com/p10.conf,Group 14
RULE-SET,https://h2.example.com/p11.conf,Group 13
RULE-SET,https://h2.example.com/p12.conf,DIRECT
RULE-SET,https://h2.example.com/p13.conf,DIRECT
RULE-SET,https://h2.example.com/p14.conf,Group 1
RULE-SET,SYSTEM,DIRECT
RULE-SET,LAN,DIRECT
RULE-SET,https://h2.example.com/p15.conf,Group 18
RULE-SET,https://h2.example.com/p16.conf,DIRECT
GEOIP,CN,DIRECT
FINAL,Group 1
[Host]
localhost = 127.0.0.1
