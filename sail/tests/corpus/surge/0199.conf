[Host]
*.d29.example = server:192.0.2.3
d30.example = server:syslib
[SSID Setting]
SSID:OCD_AP* tfo-behaviour=str1 cellular-fallback=off
TYPE:WIFI tfo-behaviour=str1 cellular-fallback=default
TYPE:CELLULAR tfo-behaviour=str2
[MITM]
