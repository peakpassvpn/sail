PROCESS-NAME,app1,DIRECT
PROCESS-NAME,app2,DIRECT
PROCESS-NAME,app3,DIRECT
PROCESS-NAME,app4,DIRECT
PROCESS-NAME,app5,DIRECT
PROCESS-NAME,app6,DIRECT
