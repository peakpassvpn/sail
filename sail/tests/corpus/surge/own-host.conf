[General]
loglevel = notify
dns-server = 192.0.2.53, system
proxy-test-url = http://www.example.com/generate_204
test-timeout = 5

[Proxy]
A = trojan, s1.example.net, 443, password=p1, sni=server.example.com

[Proxy Group]
Proxy = select, A, DIRECT

[Host]
router.lan = 192.168.1.1
*.dev.example = 127.0.0.1
alias.example = target.example
corp.example = server:192.0.2.53

[Rule]
FINAL,Proxy
