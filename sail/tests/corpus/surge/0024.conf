[General]
http-listen = 0.0.0.0:8888
socks5-listen = 0.0.0.0:8889
internet-test-url = http://h1.example.com/generate_204
proxy-test-url = http://h2.example.com/generate_204
test-timeout = 3
ipv6 = false
ipv6-vif = disabled
show-error-page-for-reject = true
hijack-dns = *:53
dns-server = 192.0.2.1, 192.0.2.2, system
read-etc-hosts = true
doh-skip-cert-verification = true
encrypted-dns-server = https://h3.example.com/dns-query
encrypted-dns-follow-outbound-mode = true
allow-wifi-access = false
allow-hotspot-access = true
http-api = password1@0.0.0.0:2500
http-api-web-dashboard = true
all-hybrid = false
wifi-access-http-port = 1314
udp-priority = true
always-raw-tcp-hosts = d1.example, d2*.example, d3*.example, d4*.example, d5*.example, d6*.example, d7*.example, d8*.example, d9*.example, d10*.example, d11*.example, d12*.example
skip-proxy = 127.0.0.1, 192.168.0.0/16, 10.0.0.0/8, str1, 100.64.0.0/10, 224.0.0.0/4, localhost, *.d13.example, d14.example, d15.example, *.d16.example
loglevel = notify
[Proxy Group]
Group 1 = select, "Group 3", "Group 4", "Group 2", "Group 13"
Group 2 = select, policy-path=https://h4.example.com/p1?target=Surge
Group 3 = url-test, policy-path=https://h4.example.com/p1?target=Surge, policy-regex-filter=(str2), interval=600, tolerance=50, update-interval=43200, no-alert=0, hidden=1, include-all-proxies=0
Group 4 = url-test, policy-path=https://h4.example.com/p1?target=Surge, policy-regex-filter=(str3), interval=600, tolerance=50, update-interval=43200, no-alert=0, hidden=1, include-all-proxies=0
Group 5 = select, "Group 10", "Group 11", "Group 12", "Group 1", "Group 2"
Group 6 = select, "Group 1", "Group 9", "Group 10", "Group 11", "Group 12", "Group 2"
Group 7 = select, "Group 1", "Group 9", "Group 10", "Group 11", "Group 12", "Group 2"
Group 8 = select, "Group 1", "Group 9", "Group 10", "Group 11", "Group 12", "Group 2"
Group 9 = select, policy-path=https://h4.example.com/p1?target=Surge, policy-regex-filter=Proxy [0-9]+|Group 1
Group 10 = select, policy-path=https://h4.example.com/p1?target=Surge, policy-regex-filter=Proxy [0-9]+|Group 2
Group 11 = select, policy-path=https://h4.example.com/p1?target=Surge, policy-regex-filter=Proxy [0-9]+|Group 3, hidden=1
Group 12 = select, policy-path=https://h4.example.com/p1?target=Surge, policy-regex-filter=Proxy [0-9]+|Group 4, hidden=1
Group 13 = select, DIRECT, hidden=1
Group 14 = select, REJECT, hidden=1
Group 15 = select, REJECT, hidden=1
Group 16 = select, "Group 1", DIRECT, hidden=1
[Rule]
RULE-SET,https://h5.example.com/p2.list,"Group 6"
RULE-SET,https://h5.example.com/p3.list,"Group 5"
RULE-SET,https://h5.example.com/p4.list,"Group 7"
RULE-SET,https://h5.example.com/p5.list,"Group 8"
RULE-SET,https://h5.example.com/p6.list,"Group 14"
RULE-SET,https://h5.example.com/p7.list,"Group 15"
RULE-SET,https://h5.example.com/p8.list,DIRECT
RULE-SET,https://h5.example.com/p9.list,DIRECT
RULE-SET,https://h5.example.com/p10.list,DIRECT
RULE-SET,https://h5.example.com/p11.list,DIRECT
RULE-SET,LAN,DIRECT
FINAL,Group 16,dns-failed
