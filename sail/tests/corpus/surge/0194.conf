[General]
loglevel = notify
ipv6 = true
test-timeout = 6
proxy-test-url = http://h1.example.com/generate_204
dns-server = system, 192.0.2.1, 192.0.2.2
skip-proxy = localhost, *.d1.example, d2.example, d3.example, d4.example, 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32, ::1/128, fe80::/10, fc00::/7, 2001:db8::/32, ::ffff:0:0/96, ff00::/8
allow-wifi-access = true
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
external-controller-access = password1@192.0.2.3:6170
exclude-simple-hostnames = true
http-listen = 0.0.0.0
socks5-listen = 0.0.0.0
[Proxy Group]
Group 1 = select, "Group 6", "Group 7", "Group 8", "Group 19", DIRECT
Group 2 = select, policy-path=./path-1, update-interval=86400, policy-regex-filter=Proxy [0-9]+|Group 1, include-all-proxies=0, no-alert=0, hidden=0
Group 3 = select, policy-path=./path-1, update-interval=86400, policy-regex-filter=Proxy [0-9]+|Group 1, include-all-proxies=0
Group 4 = url-test, include-other-group=Group 2, interval=10800
Group 5 = url-test, include-other-group=Group 3, interval=10800
Group 6 = fallback, Group 4, Group 5, url=http://h1.example.com/generate_204, interval=300
Group 7 = select, include-other-group="Group 3, Group 2"
Group 8 = select, include-other-group=Group 3
