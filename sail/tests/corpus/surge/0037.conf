#!MANAGED-CONFIG https://h1.example.com/p1.conf
[Proxy Group]
Group 1 = fallback, include-all-proxies=true, policy-regex-filter="Proxy [0-9]+|Group 1", url=https://h2.example.com/generate_204, interval=300
Group 2 = fallback, PROXY, include-all-proxies=true, policy-regex-filter="Proxy [0-9]+|Group 2", url=https://h2.example.com/generate_204, interval=300
PROXY = select, include-all-proxies=true, policy-regex-filter="Proxy [0-9]+|Group 3"
Group 3 = select, DIRECT, Group 2
[Rule]
RULE-SET,https://h1.example.com/p2.txt,Group 1
RULE-SET,https://h1.example.com/p3.txt,Group 3
RULE-SET,https://h1.example.com/p4.txt,DIRECT
RULE-SET,https://h1.example.com/p5.txt,Group 2
RULE-SET,LAN,DIRECT
GEOIP,CN,DIRECT
FINAL,Group 2
