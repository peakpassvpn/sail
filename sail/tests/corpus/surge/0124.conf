ipv6-vif = disabled
udp-priority = false
use-local-host-item-for-proxy = true
[Proxy]
DIRECT = direct
[Proxy Group]
Group 1 = select, include-other-group="Group 5, Group 6, Group 9"
Group 2 = fallback, Group 5, Group 6, Group 11
Group 3 = fallback, Group 7, Group 8, Group 11
Group 4 = select, Group 13, Group 11, Group 12, Group 5, Group 6
