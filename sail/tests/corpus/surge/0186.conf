#!MANAGED-CONFIG str1 interval=43200 strict=true
[General]
loglevel = notify
dns-server = 192.0.2.1, 192.0.2.2
doh-server = https://h1.example.com/dns-query
hijack-dns = 192.0.2.2:53, 192.0.2.3:53
tun-excluded-routes = 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32
skip-proxy = localhost, *.d1.example, d2.example, 0.0.0.0/8, 10.0.0.0/8, 240.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
allow-wifi-access = true
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
http-listen = 0.0.0.0:6152
socks5-listen = 0.0.0.0:6153
show-error-page-for-reject = true
test-timeout = 5
network-framework = false
proxy-test-url = http://h2.example.com/generate_204
external-controller-access = password1@0.0.0.0:6170
exclude-simple-hostnames = true
ipv6 = true
replica = false
[Replica]
hide-apple-request = true
hide-crashlytics-request = true
use-keyword-filter = false
hide-udp = false
[Proxy]
str2
[Proxy Group]
Group 1 = select, Group 2, Group 3, Proxy 1
Group 2 = url-test, Proxy 1, url=http://h2.example.com/generate_204, interval=43200
Group 3 = fallback, Proxy 1, url=http://h2.example.com/generate_204, interval=43200
[Rule]
RULE-SET,https://h3.example.com/p1.list,REJECT-TINYGIF
DOMAIN-SET,https://h3.example.com/p2.list,REJECT-TINYGIF
DOMAIN-SET,https://h3.example.com/p3.list,REJECT-TINYGIF
DOMAIN-SET,https://h3.example.com/p4.list,REJECT-TINYGIF
DOMAIN-SET,https://h3.example.com/p5.list,REJECT-TINYGIF
RULE-SET,https://h3.example.com/p6.list,REJECT-TINYGIF
RULE-SET,https://h3.example.com/p7.list,REJECT-TINYGIF
RULE-SET,https://h3.example.com/p8.list,REJECT-TINYGIF
RULE-SET,https://h3.example.com/p9.list,REJECT-TINYGIF
RULE-SET,SYSTEM,Proxy 2
RULE-SET,https://h3.example.com/p10.list,Proxy 2
RULE-SET,https://h3.example.com/p11.list,Proxy 2
RULE-SET,https://h3.example.com/p12.list,DIRECT
RULE-SET,https://h3.example.com/p13.list,Proxy 2
RULE-SET,LAN,DIRECT
GEOIP,CN,DIRECT,no-resolve
FINAL,Proxy 2,dns-failed
[URL Rewrite]
^https?://r1\.example\.com/ https://h4.example.com 302
