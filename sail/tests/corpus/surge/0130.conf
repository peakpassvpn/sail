[General]
loglevel = notify
ipv6 = auto
ipv6-vif = auto
dns-server = 192.0.2.1, 192.0.2.2, 192.0.2.3, 192.0.2.4, 192.0.2.5, 192.0.2.6, 192.0.2.7:995, 2001:db8::1, 2001:db8::2, system
skip-proxy = localhost, *.d1.example, 0.0.0.0/8, 10.0.0.0/8, 240.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16
exclude-simple-hostnames = true
external-controller-access = password1@0.0.0.0:6166
http-api-web-dashboard = false
show-error-page-for-reject = true
internet-test-url = http://h1.example.com/generate_204
proxy-test-url = http://h2.example.com
test-timeout = 5
always-real-ip = *.d2.example
hijack-dns = 192.0.2.5:53, 192.0.2.6:53
encrypted-dns-follow-outbound-mode = true
encrypted-dns-server = https://192.0.2.8/dns-query
encrypted-dns-skip-cert-verification = false
use-local-host-item-for-proxy = false
geoip-maxmind-url = https://h3.example.com/p1.mmdb
disable-geoip-db-auto-update = false
allow-dns-svcb = false
udp-policy-not-supported-behaviour = REJECT
udp-priority = false
always-raw-tcp-hosts = *.d3.example
allow-wifi-access = false
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
wifi-access-http-auth = user1:password1
wifi-assist = true
hide-vpn-icon = false
all-hybrid = false
allow-hotspot-access = false
include-all-networks = false
include-local-networks = false
include-apns = false
include-cellular-services = false
compatibility-mode = 1
[Proxy]
Proxy 1 = snell, 192.0.2.9, 58912, psk=password2, version=5, reuse=true, tfo=true
Proxy 2 = snell, 192.0.2.10, 49012, psk=password3, version=5, reuse=true, tfo=true
Proxy 3 = snell, 192.0.2.11, 49021, psk=password4, version=4, reuse=true, tfo=true
Proxy 4 = snell, 192.0.2.12, 14066, psk=password5, version=5, reuse=true, tfo=true, shadow-tls-password=password6, shadow-tls-sni=d4.example, shadow-tls-version=3
Proxy 4 = ss, 192.0.2.12, 26954, encrypt-method=2022-blake3-aes-128-gcm, password=wywOQgzCr2vr85JpoMxzCQ==, shadow-tls-password=password7, shadow-tls-sni=d4.example, shadow-tls-version=3, udp-relay=true
[Proxy Group]
Group 1 = select, "Group 2", "Group 3", "Group 12", "Group 13", "Group 14", "Group 15", "Group 16", "Group 17", "Group 18", "Group 20", "Group 19"
Group 2 = smart, include-all-proxies=1, policy-path=https://h4.example.com/p2, policy-regex-filter=Proxy [0-9]+|Group 1, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 3 = select, include-all-proxies=1, policy-path=https://h4.example.com/p2, policy-regex-filter=Proxy [0-9]+|Group 1
Group 4 = select, "Group 1", "Group 12", "Group 13", "Group 14", "Group 15", "Group 17", no-alert=0, hidden=0, include-all-proxies=0
Group 5 = select, "Group 1", "Group 12", "Group 13", "Group 14", "Group 15", "Group 17", no-alert=0, hidden=0, include-all-proxies=0
Group 6 = select, "Group 1", "Group 12", "Group 13", "Group 14", "Group 15", "Group 17", no-alert=0, hidden=0, include-all-proxies=0
Group 7 = select, "Group 3", "Group 1", "Group 2", no-alert=0, hidden=0, include-all-proxies=0
Group 8 = select, DIRECT, "Group 15", no-alert=0, hidden=0, include-all-proxies=0
Group 9 = select, "Group 3", "Group 1", no-alert=0, hidden=0, include-all-proxies=0
Group 10 = select, DIRECT, "Group 2", "Group 3", no-alert=0, hidden=0, include-all-proxies=0
Group 11 = select, "Group 1", "Group 2", no-alert=0, hidden=0, include-all-proxies=0
Group 12 = smart, policy-path=https://h4.example.com/p2, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 2, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 13 = smart, policy-path=https://h4.example.com/p2, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 3, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 14 = smart, policy-path=https://h4.example.com/p2, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 4, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 15 = smart, policy-path=https://h4.example.com/p2, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 5, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 16 = smart, policy-path=https://h4.example.com/p2, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 6, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 17 = smart, policy-path=https://h4.example.com/p2, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 7, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 18 = smart, policy-path=https://h4.example.com/p2, include-all-proxies=1, policy-regex-filter=Proxy [0-9]+|Group 8, url=http://192.0.2.4/generate_204, interval=300, tolerance=50
Group 19 = select, REJECT
Group 20 = select, DIRECT
[Rule]
