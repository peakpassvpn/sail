[General]
loglevel = notify
dns-server = 192.0.2.1, 192.0.2.2, system
skip-proxy = 127.0.0.1, 192.168.0.0/16, 10.0.0.0/8, localhost, *.d1.example
exclude-simple-hostnames = true
ipv6 = false
http-listen = 0.0.0.0:8888
socks5-listen = 0.0.0.0:8889
enhanced-mode-by-rule = true
[Proxy Group]
Group 1 = select, Group 2, Group 3, Group 4, Group 5, Group 6, DIRECT
Group 2 = url-test, policy-path=./path-1, url=http://h1.example.com/generate_204, interval=300
Group 3 = url-test, policy-path=./path-1, url=http://h1.example.com/generate_204, interval=300, policy-regex-filter=Proxy [0-9]+|Group 1
Group 4 = url-test, policy-path=./path-1, url=http://h1.example.com/generate_204, interval=300, policy-regex-filter=Proxy [0-9]+|Group 2
Group 5 = url-test, policy-path=./path-1, url=http://h1.example.com/generate_204, interval=300, policy-regex-filter=Proxy [0-9]+|Group 3
Group 6 = url-test, policy-path=./path-1, url=http://h1.example.com/generate_204, interval=300, policy-regex-filter=Proxy [0-9]+|Group 4
Group 7 = select, Group 4, Group 5, Group 1
Group 8 = select, Group 4, Group 3, Group 5, Group 1
Group 9 = select, Group 5, Group 3, DIRECT, Group 1
Group 10 = select, Group 1, Group 2, DIRECT
Group 11 = select, REJECT
Group 12 = select, Group 1, DIRECT
[Rule]
RULE-SET,https://h2.example.com/p1.list,Group 11
RULE-SET,https://h2.example.com/p2.list,Group 11
RULE-SET,https://h2.example.com/p3.list,Group 1
RULE-SET,https://h2.example.com/p4.list,DIRECT
RULE-SET,https://h2.example.com/p5.list,Group 7
RULE-SET,https://h2.example.com/p6.list,Group 1
RULE-SET,https://h2.example.com/p7.list,Group 8
RULE-SET,https://h2.example.com/p8.list,Group 10
RULE-SET,https://h2.example.com/p9.list,Group 9
RULE-SET,https://h2.example.com/p10.list,Group 9
RULE-SET,https://h2.example.com/p11.list,Group 9
RULE-SET,https://h2.example.com/p12.list,DIRECT
RULE-SET,https://h2.example.com/p13.list,DIRECT
GEOIP,CN,DIRECT
FINAL,Group 12
