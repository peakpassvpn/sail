[General]
loglevel = notify
test-timeout = 3
internet-test-url = http://h1.example.com/generate_204
proxy-test-url = http://h2.example.com/p1
geoip-maxmind-url = https://h3.example.com/p2.mmdb
udp-priority = false
dns-server = 192.0.2.1, 192.0.2.2
hijack-dns = *:53
exclude-simple-hostnames = true
show-error-page-for-reject = true
udp-policy-not-supported-behaviour = REJECT
[Proxy Group]
Group 1 = select, Group 9, Group 10, Group 11, Group 12, Group 13, Group 14, no-alert=0, hidden=0, include-all-proxies=0
Group 2 = select, DIRECT, no-alert=0, hidden=0, include-all-proxies=0
Group 3 = select, Group 9, Group 10, Group 11, Group 12, Group 13, Group 14, no-alert=0, hidden=0, include-all-proxies=0
Group 4 = select, Group 9, Group 10, Group 11, Group 12, Group 13, Group 14, no-alert=0, hidden=0, include-all-proxies=0
Group 5 = select, Group 9, Group 10, Group 11, Group 12, Group 13, Group 14, no-alert=0, hidden=0, include-all-proxies=0
Group 6 = select, Group 9, Group 10, Group 11, Group 12, Group 13, Group 14, no-alert=0, hidden=0, include-all-proxies=0
Group 7 = select, Group 9, Group 10, Group 11, Group 12, Group 13, Group 14, no-alert=0, hidden=0, include-all-proxies=0
Group 8 = select, DIRECT, Group 9, Group 10, no-alert=0, hidden=0, include-all-proxies=0
Group 9 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 1, no-alert=1, hidden=1, include-all-proxies=0, policy-path=./path-1
Group 10 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 2, no-alert=1, hidden=1, include-all-proxies=0, policy-path=./path-1
Group 11 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 3, no-alert=1, hidden=1, include-all-proxies=0, policy-path=./path-1
Group 12 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 4, no-alert=1, hidden=1, include-all-proxies=0, policy-path=./path-1
Group 13 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 5, no-alert=1, hidden=1, include-all-proxies=0, policy-path=./path-1
Group 14 = smart, update-interval=0, policy-regex-filter=Proxy [0-9]+|Group 6, no-alert=1, hidden=1, include-all-proxies=0, policy-path=./path-1
[Rule]
RULE-SET,https://h3.example.com/p3.list,REJECT
RULE-SET,https://h3.example.com/p4.list,REJECT
RULE-SET,https://h3.example.com/p5.list,REJECT
RULE-SET,https://h3.example.com/p6.list,Group 8
RULE-SET,https://h3.example.com/p7.list,Group 2
RULE-SET,https://h3.example.com/p8.list,Group 5
RULE-SET,https://h3.example.com/p9.list,Group 3
RULE-SET,https://h3.example.com/p10.list,Group 7
RULE-SET,https://h3.example.com/p11.list,Group 6
RULE-SET,https://h3.example.com/p12.list,Group 1
RULE-SET,https://h3.example.com/p13.list,Group 4
RULE-SET,https://h4.example.com/p14.list,DIRECT
GEOIP,CN,DIRECT
FINAL,Group 1,dns-failed
[URL Rewrite]
^https?://r1\.example\.com/ https://h5.example.com 302
[MITM]
skip-server-cert-verify = true
h2 = true
hostname = d1.example, d2.example
