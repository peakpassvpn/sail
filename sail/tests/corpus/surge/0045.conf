#!MANAGED-CONFIG https://h1.example.com/p1.conf
[General]
loglevel = warning
geoip-maxmind-url = https://h2.example.com/p2.mmdb
disable-geoip-db-auto-update = false
compatibility-mode = 3
ipv6 = true
wifi-assist = true
test-timeout = 3
internet-test-url = http://h3.example.com/p3
proxy-test-url = http://h4.example.com/generate_204
[Proxy Group]
Group 1 = select, Group 7, Group 8, Group 10, Group 9, Group 11, Group 12
Group 2 = select, Group 7, Group 10, Group 9, Group 11, Group 8, Group 12
Group 3 = select, REJECT, REJECT-DROP, REJECT-TINYGIF
Group 4 = select, Group 7, Group 10, Group 9, Group 11, Group 8, Group 12
Group 5 = select, DIRECT, Group 7, Group 10, Group 9, Group 11, Group 8, Group 12
Group 6 = select, Group 7, Group 11, DIRECT
Group 7 = url-test, policy-path=./path-1, policy-regex-filter=Proxy [0-9]+|Group 1, no-alert=true, hidden=true, interval=300, update-interval=600
Group 8 = url-test, policy-path=./path-1, policy-regex-filter=Proxy [0-9]+|Group 2, no-alert=true, hidden=true, interval=300, update-interval=600
Group 9 = url-test, policy-path=./path-1, policy-regex-filter=Proxy [0-9]+|Group 3, no-alert=true, hidden=true, interval=300, update-interval=600
Group 10 = url-test, policy-path=./path-1, policy-regex-filter=Proxy [0-9]+|Group 4, no-alert=true, hidden=true, interval=300, update-interval=600
Group 11 = url-test, policy-path=./path-1, policy-regex-filter=Proxy [0-9]+|Group 5, no-alert=true, hidden=true, interval=300, update-interval=600
Group 12 = load-balance, Group 7, Group 8, Group 10, Group 9, Group 11, no-alert=true, hidden=true, persistent=true
[Rule]
RULE-SET,https://h2.example.com/p4.list, Group 6
RULE-SET,https://h2.example.com/p5.list,Group 7
RULE-SET,https://h2.example.com/p6.list,Group 4
RULE-SET,https://h2.example.com/p7.list,Group 2
RULE-SET,https://h2.example.com/p8.list,Group 2
RULE-SET,https://h2.example.com/p9.list, Group 5
RULE-SET,https://h2.example.com/p10.list, Group 1
RULE-SET,https://h2.example.com/p11.list, Group 9
RULE-SET,https://h2.example.com/p12.list, Group 11
OR,((RULE-SET,SYSTEM),(RULE-SET,LAN),(GEOIP,CN),(RULE-SET, https://h2.example.com/p13.list)), DIRECT, no-resolve
FINAL, Group 1
[MITM]
skip-server-cert-verify = true
tcp-connection = true
h2 = true
ca-passphrase = password1
ca-p12 = c2FpbCBjb3JwdXMgZHVtbXkgcDEy
