udp-policy-not-supported-behaviour = reject
[Replica]
hide-apple-request = 0
hide-crash-reporter-request = 1
hide-udp = 0
[Proxy]
Proxy 1 = direct
Proxy 2 = reject
Proxy 3 = ss, 192.0.2.3, 443, encrypt-method=chacha20-ietf-poly1305, password=password1
