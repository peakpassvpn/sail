Group 5 = select, Group 6, Group 7, Group 8, Group 9, Group 10, Group 11, Group 12, Group 14, no-alert=0, hidden=0, include-all-proxies=0
Group 6 = select, policy-path=./path-1, update-interval=604800, policy-regex-filter=Proxy [0-9]+|Group 1, no-alert=0, hidden=0, include-all-proxies=0
Group 7 = select, policy-path=./path-1, update-interval=604800, policy-regex-filter=Proxy [0-9]+|Group 2, no-alert=0, hidden=0, include-all-proxies=0
