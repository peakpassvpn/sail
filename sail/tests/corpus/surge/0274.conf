#!MANAGED-CONFIG str1 interval=60 strict=true
[General]
loglevel = notify
interface = 127.0.0.1
skip-proxy = localhost, *.d1.example, 0.0.0.0/8, 10.0.0.0/8, 240.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.0.2.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
ipv6 = false
dns-server = 192.0.2.1, 192.0.2.2, 192.0.2.3, 192.0.2.4, system
exclude-simple-hostnames = true
enhanced-mode-by-rule = true
[Proxy]
str2
[Proxy Group]
Group 1 = select, Group 2, Group 3, Proxy 1
Group 2 = url-test, Proxy 1, url=http://h1.example.com/generate_204, interval=600
Group 3 = fallback, Proxy 1, url=http://h1.example.com/generate_204, interval=600
[Host]
localhost = 127.0.0.1
