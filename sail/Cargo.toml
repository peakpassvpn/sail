[package]
name = "sail"
version = "0.1.2"
authors = ["eycorsican <eric.y.corsican@gmail.com>"]
edition = "2021"
build = "build.rs"

[lib]
name = "sail"
path = "src/lib.rs"

[features]
default = [
    "all-configs",
    "all-endpoints",
    "api",
    "dns-h3",
]

# Grouping all features
all-configs = [
    "config-conf",
]
all-endpoints = [
    # inbounds
    "inbound-chain",
    "inbound-amux",
    "inbound-quic",
    "inbound-ws",
    "inbound-httpupgrade",
    "inbound-tls",
    "inbound-trojan",
    "inbound-mptp",
    "inbound-http",
    "inbound-hc",
    "inbound-shadowsocks",
    "inbound-socks",
    "inbound-tun",
    "inbound-cat",
    "inbound-mixed",
    "inbound-hysteria2",
    "inbound-tuic",
    "inbound-anytls",
    "inbound-redirect",
    "inbound-tproxy",
    # outbounds
    "outbound-direct",
    "outbound-drop",
    "outbound-redirect",
    "outbound-shadowsocks",
    "outbound-obfs",
    "outbound-socks",
    "outbound-trojan",
    "outbound-tls",
    "outbound-ws",
    "outbound-httpupgrade",
    "outbound-amux",
    "outbound-vmess",
    "outbound-quic",
    "outbound-failover",
    "outbound-static",
    "outbound-tryall",
    "outbound-chain",
    "outbound-vless",
    "outbound-reality",
    "outbound-mptp",
    "outbound-http",
    "outbound-hysteria2",
    "outbound-tuic",
    "outbound-anytls",
    "outbound-select",
    "outbound-urltest",
    "outbound-load-balance",
]

# BoringSSL, through btls, is the only crypto library: TLS over TCP and
# QUIC, and the AEADs of Shadowsocks and VMess.
aead = ["btls"]
quic = ["tls", "quinn", "quinn-btls"]
tls = ["btls", "btls-sys", "brotli-decompressor", "foreign-types", "miniz_oxide", "ruzstd", "sha2", "webpki-root-certs"]

# DNS over HTTP/3 upstreams (`h3://`).
dns-h3 = ["quic", "h3", "h3-quinn", "http"]

# Config formats
config-conf = ["regex"]

# Router rules
rule-process-name = ["regex"]

# Outbounds
outbound-direct = []
outbound-drop = []
outbound-redirect = []
outbound-shadowsocks = ["aead", "hkdf", "sha-1", "md-5", "percent-encoding", "tokio-util", "blake3", "base64"]
outbound-obfs = ["base64", "memchr"]
outbound-socks = ["async-socks5"]
outbound-trojan = ["sha2", "hex"]
outbound-http = ["base64"]
outbound-hysteria2 = ["quic", "blake2", "quinn-proto"]
outbound-tuic = ["quic", "tokio/macros"]
outbound-anytls = ["sha2", "md-5", "tokio-util"]
outbound-tls = ["tls"]
outbound-ws = ["tungstenite", "tokio-tungstenite", "http", "httparse", "base64"]
outbound-httpupgrade = ["http", "httparse"]
outbound-failover = ["lru_time_cache"]
outbound-static= []
outbound-tryall = []
outbound-chain = []
outbound-vless = ["hex"]
outbound-reality = ["tls", "hkdf", "sha2", "hmac", "aes-gcm", "hex", "base64"]
outbound-amux= ["tokio-util"]
outbound-quic = ["quic"]
outbound-mptp = []
# The API's select routes read their query string; without the API, the
# selector needs nothing more.
outbound-select = ["axum?/query"]
# Exposes its selection and latencies the way a selector does.
outbound-urltest = ["outbound-select"]
outbound-load-balance = ["lru_time_cache"]
outbound-vmess = ["aead", "lz_fnv", "cfb-mode", "hmac", "sha2", "aes", "aes-gcm", "sha3", "digest", "md-5", "tokio-util", "byteorder", "crc32fast"]

# Inbounds
inbound-trojan = ["sha2", "hex"]
inbound-mixed = ["inbound-http", "inbound-socks"]
inbound-hysteria2 = ["quic", "blake2", "quinn-proto", "url"]
inbound-tuic = ["quic", "tokio/macros"]
inbound-anytls = ["sha2", "md-5", "tokio-util"]
inbound-mptp = []
inbound-shadowsocks = ["aead", "hkdf", "sha-1", "md-5", "tokio-util", "blake3", "base64"]
inbound-socks = []
inbound-http = ["http", "base64"]
inbound-hc = []
inbound-tun = ["tun", "netstack-lwip", "netstack-smoltcp", "pnet_datalink"]
inbound-ws = ["tungstenite", "tokio-tungstenite", "http", "httparse", "base64"]
inbound-httpupgrade = ["http", "httparse"]
inbound-amux = ["tokio-util"]
inbound-quic = ["quic"]
inbound-tls = ["tls"]
inbound-chain = []
inbound-cat = ["tokio/io-std"]
inbound-nf = ["libloading"]
inbound-redirect = []
inbound-tproxy = []

plugin = ["async-ffi", "libloading"]
api = ["axum"]
auto-reload = ["notify"]
ctrlc = ["tokio/signal"]

[dependencies]
# Common
tokio = { version = "1", features = ["sync", "io-util", "net", "time", "rt", "rt-multi-thread", "macros"] }
protobuf = "3.6"
thiserror = "1.0"
futures = "0.3"
async-trait = "0.1"
bytes = "1"
lazy_static = "1.5"
anyhow = "1.0"
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
async-recursion = "1.1"
arc-swap = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

# DNS
hickory-proto = { version = "0.24", default-features = false }
lru = "0.12"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
chrono = "0.4"

# Router
maxminddb = { version = "0.24", features = ["mmap"] }
memmap2 = "0.9"
cidr = "0.2"
regex = { version = "1.11", optional = true }

# plugin
async-ffi = { version = "0.2", optional = true }
libloading = { version = "0.7", optional = true }

# config
serde_json = { version = "1.0", features = ["raw_value"] }
serde_derive = "1.0"
serde = "1.0"
serde_path_to_error = "0.1"

# config-conf


# TLS
btls = { version = "0.5.6", optional = true }
btls-sys = { version = "0.5.6", optional = true }
brotli-decompressor = { version = "5", optional = true }
miniz_oxide = { version = "0.8", optional = true }
ruzstd = { version = "0.8", optional = true }
foreign-types = { version = "0.5", optional = true }
webpki-root-certs = { version = "1", optional = true }

# WebSocket
tungstenite = { version = "0.24", default-features = false, optional = true }
tokio-tungstenite = { version = "0.24", optional = true }

# WebSocket, HTTPUpgrade, gRPC
url = { version = "2.5", optional = true }
http = { version = "1.1", optional = true }
httparse = { version = "1.9", optional = true }

# SOCKS outbound
async-socks5 = { version = "0.6", optional = true }

# Shadowsocks
hkdf = { version = "0.12", optional = true }
md-5 = { version = "0.10", optional = true }
sha-1 = { version = "0.10", optional = true }
percent-encoding = { version = "2.3", optional = true }

# Obfs
base64 = { version = "0.22", optional = true }
blake3 = { version = "1", optional = true }
memchr = { version = "2", optional = true }

# Trojan
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

# VMess
lz_fnv = { version = "0.1", optional = true }
cfb-mode = { version = "0.8", optional = true }
hmac = { version = "0.12", optional = true }
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
sha3 = { version = "0.10", optional = true }
digest = { version = "0.10", optional = true }
byteorder = { version = "1", optional = true }
crc32fast = { version = "1", optional = true }

# Failover
lru_time_cache = { version = "0.11", optional = true }

# amux
tokio-util = { version = "0.7", default-features = false, features = ["io", "codec", "compat"], optional = true }

# QUIC
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio"], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn-btls = { git = "https://github.com/peakpassvpn/quinn-btls.git", rev = "a3efed7d26fa69e323819da8eb6ebf7628c8e7c4", default-features = false, optional = true }

# Hysteria2: Salamander obfuscation, and the congestion controller trait
blake2 = { version = "0.10", optional = true }
quinn-proto = { version = "0.11", default-features = false, optional = true }


# API
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"], optional = true }

# Auto reload
notify = { version = "6", optional = true }

# TUN
tun = { version = "0.7", features = ["async"], optional = true  }
netstack-lwip = { git = "https://github.com/eycorsican/netstack-lwip", rev = "4943435", optional = true }
netstack-smoltcp = { git = "https://github.com/eycorsican/netstack-smoltcp", branch = "pr-16-initialize-unfilled", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
ipconfig = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
pnet_datalink = { version = "0.34", package = "pnet_datalink", optional = true }
libc = "0.2"

[dev-dependencies]
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rcgen = "0.13"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "sync", "io-util", "net", "time", "rt", "rt-multi-thread"] }

[build-dependencies]
cc = "1.2"
protobuf-codegen = "=3.6.0"
protoc-bin-vendored = "3.2"
