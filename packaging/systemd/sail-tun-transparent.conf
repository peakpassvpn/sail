[Service]
# Opt in only for configurations which create/configure a TUN device or use
# transparent proxy sockets. The base unit deliberately has no capabilities.
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=/dev/net/tun rw
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW
