[package]
name = "sail-cli"
version = "0.14.2"
authors = ["eycorsican <eric.y.corsican@gmail.com>"]
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "sail"
path = "src/main.rs"

[features]
# A measurement build: counts allocations and writes them to the file
# SAIL_ALLOC_STATS names (tools/perf).
alloc-stats = ["sail/alloc-stats"]

[dependencies]
tokio = { version = "1", features = ["rt"] }
argh = "0.1"
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(windows))'.dependencies.sail]
path = "../sail"
default-features = false
features = [
  "default",
  "ctrlc",
  "auto-reload"
]

[target.'cfg(windows)'.dependencies.sail]
path = "../sail"
default-features = false
features = [
  "default",
  "ctrlc",
  "auto-reload",
  "inbound-nf",
  "rule-process-name"
]
